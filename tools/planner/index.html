            <div class="field" style="margin-top:8px"><label for="pe-why">why</label><input id="pe-why" name="why" placeholder="what typing it buys, or what deferring it costs" data-fk="pe-why"></div>
            <div style="margin-top:12px"><button class="btn" type="submit" data-fk="pe-add">Add edge</button></div>
          </form>
        </div>
        ${edges.length ? edges.map(plannedEdgeHTML).join('') : `<div class="empty"><b>No planned edge yet</b>An untyped reference in the Gaps view usually becomes one of these.</div>`}
      </section>

      <section class="card" style="grid-column:1/-1">
        <div class="card-hd"><h3>Decisions</h3><span class="mono" style="color:var(--quiet)">${st.decisions.length}</span></div>
        <div class="card-bd">
          <form data-form="decision">
            <div class="field"><label for="pd-q">question</label><input id="pd-q" name="question" placeholder="Does an empty resource class stay empty?" required data-fk="pd-q"></div>
            <div class="field" style="margin-top:8px"><label for="pd-c">choice</label><input id="pd-c" name="choice" placeholder="the answer, in one line" data-fk="pd-c"></div>
            <div class="field" style="margin-top:8px"><label for="pd-r">rationale</label><textarea id="pd-r" name="rationale" placeholder="why — this is the part the documentation will quote" data-fk="pd-r"></textarea></div>
            <div style="margin-top:12px"><button class="btn" type="submit" data-fk="pd-add">Record decision</button></div>
          </form>
        </div>
        ${decs.length ? decs.map(decisionHTML).join('') : `<div class="empty"><b>No decision recorded yet</b>A gap you reject or defer is usually worth a decision saying why.</div>`}
      </section>

      <section class="card" style="grid-column:1/-1">
        <div class="card-hd"><h3>Log</h3><span class="mono" style="color:var(--quiet)">${st.log.length}</span>
          <p class="kind-note">Append-only, newest first. This is the session as the assistant will read it.</p></div>
        <div class="log">
          ${log.length ? log.map(l => `<div class="log-row">
            <span class="lt" title="${h(l.at)}">${h(shortTime(l.at))}</span>
            <span class="la">${h(l.action)}</span>
            <span class="ld">${l.target ? `<b>${h(l.target)}</b> ` : ''}${h(l.detail || '')}</span>
          </div>`).join('') : `<div class="empty"><b>Nothing logged yet</b>Every change you make appears here.</div>`}
        </div>
      </section>
    </div>`;

  wirePlan(root);
}

function plannedModuleHTML(p) {
  return `<div class="item" data-pm="${h(p.name)}">
    <div class="item-hd">
      <span class="id">${h(p.name)}</span>
      <span class="pill p-${h(p.status || 'proposed')}">${h(p.status || 'proposed')}</span>
      <div class="item-actions">
        <select data-pm-status="${h(p.name)}" data-fk="pms-${h(p.name)}" aria-label="Status for ${h(p.name)}" style="padding:3px 6px;font-size:11px;border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--surface)">
          ${MODULE_STATUSES.map(s => `<option ${s === (p.status || 'proposed') ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="item-body">${p.purpose ? h(p.purpose) : UNKNOWN}</div>
    ${(p.holds || []).length ? `<div class="chiplist" style="margin-top:6px">${p.holds.map(x => `<span class="chip">${h(x)}</span>`).join('')}</div>` : ''}
    ${p.at ? `<div class="gap-meta" style="margin-top:6px"><span>${h(shortTime(p.at))}</span></div>` : ''}
  </div>`;
}
function plannedEdgeHTML({ e, i }) {
  return `<div class="item">
    <div class="item-hd">
      <span class="id">${h(e.from)}<span style="color:var(--quiet)">.</span>${h(e.field)}</span>
      <span style="color:var(--quiet)">→</span>
      <span class="id">${h(e.to)}</span>
      ${e.typedAs ? `<span class="chip c-typed">${h(e.typedAs)}</span>` : ''}
      <div class="item-actions"><button class="mini-btn btn-danger" data-pe-del="${i}" data-fk="ped-${i}">remove</button></div>
    </div>
    <div class="item-body">${e.why ? h(e.why) : UNKNOWN}</div>
    ${e.at ? `<div class="gap-meta" style="margin-top:6px"><span>${h(shortTime(e.at))}</span></div>` : ''}
  </div>`;
}
function decisionHTML(d) {
  return `<div class="item">
    <div class="item-hd">
      <span class="id">${h(d.question || '(no question)')}</span>
      <span class="pill p-${h(d.status || 'open')}">${h(d.status || 'open')}</span>
      <div class="item-actions">
        <select data-dec-status="${h(d.id)}" data-fk="ds-${h(d.id)}" aria-label="Status" style="padding:3px 6px;font-size:11px;border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--surface)">
          ${DECISION_STATUSES.map(s => `<option ${s === (d.status || 'open') ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="item-body"><b style="color:var(--ink)">${d.choice ? h(d.choice) : '<span class="unknown">no choice recorded</span>'}</b></div>
    ${d.rationale ? `<div class="item-body" style="color:var(--label)">${h(d.rationale)}</div>` : ''}
    <div class="gap-meta" style="margin-top:6px"><span class="mono">${h(d.id || '')}</span>${d.at ? `<span>${h(shortTime(d.at))}</span>` : ''}</div>
  </div>`;
}

function wirePlan(root) {
  const f = (sel) => root.querySelector(sel);
  f('[data-form="module"]').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const d = Object.fromEntries(new FormData(ev.target).entries());
    if (!d.name.trim()) return;
    const holds = d.holds.split(',').map(s => s.trim()).filter(Boolean);
    const ok = await mutate('addPlannedModule', { name: d.name, purpose: d.purpose, holds: holds.length ? holds : undefined });
    if (ok) { ev.target.reset(); renderPlan(); renderTabCounts(); toast('good', 'Module planned', d.name.trim()); }
  });
  f('[data-form="edge"]').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const d = Object.fromEntries(new FormData(ev.target).entries());
    const ok = await mutate('addPlannedEdge', { from: d.from, field: d.field, to: d.to, typedAs: d.typedAs, why: d.why });
    if (ok) { ev.target.reset(); renderPlan(); toast('good', 'Edge planned', `${d.from.trim()}.${d.field.trim()} → ${d.to.trim()}`); }
  });
  f('[data-form="decision"]').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const d = Object.fromEntries(new FormData(ev.target).entries());
    /* the server mints the decision id — the page must not invent one */
    const ok = await mutate('addDecision', { question: d.question, choice: d.choice, rationale: d.rationale });
    if (ok) { ev.target.reset(); renderPlan(); toast('good', 'Decision recorded', d.question.trim().slice(0, 60)); }
  });
  root.querySelectorAll('[data-pm-status]').forEach(s => s.addEventListener('change', async () => {
    if (await mutate('setPlannedModule', { name: s.dataset.pmStatus, status: s.value })) withFocus(renderPlan);
  }));
  root.querySelectorAll('[data-pe-del]').forEach(b => b.addEventListener('click', async () => {
    if (await mutate('removePlannedEdge', { index: Number(b.dataset.peDel) })) renderPlan();
  }));
  root.querySelectorAll('[data-dec-status]').forEach(s => s.addEventListener('change', async () => {
    if (await mutate('setDecision', { id: s.dataset.decStatus, status: s.value })) withFocus(renderPlan);
  }));
}

/* ══ DETAIL PANEL ════════════════════════════════════════════════════════════ */
function select(sel) {
  S.sel = sel;
  document.body.classList.toggle('panel-open', !!sel);
  renderPanel();
  writeHash();
}
function selKey(sel) {
  if (!sel) return '';
  if (sel.type === 'node') return `n:${sel.name}`;
  if (sel.type === 'gap') return `g:${sel.id}`;
  if (sel.type === 'module') return `m:${sel.module}`;
  if (sel.type === 'cell') return `c:${sel.module}:${sel.col}`;
  return '';
}
function selFromKey(key) {
  if (!key) return null;
  const [t, ...rest] = key.split(':');
  const v = rest.join(':');
  if (t === 'n') return { type: 'node', name: v };
  if (t === 'g') return { type: 'gap', id: v };
  if (t === 'm') return { type: 'module', module: v };
  if (t === 'c') { const [m, c] = v.split(':'); return { type: 'cell', module: m, col: c }; }
  return null;
}

function renderPanel() {
  const p = $('#panel');
  if (!S.sel) { p.hidden = true; p.innerHTML = ''; return; }
  let kicker = '', title = '', body = '';
  try {
    if (S.sel.type === 'module') ({ kicker, title, body } = panelModule(S.sel.module));
    else if (S.sel.type === 'cell') ({ kicker, title, body } = panelCell(S.sel.module, S.sel.col));
    else if (S.sel.type === 'node') ({ kicker, title, body } = panelNode(S.sel.name));
    else if (S.sel.type === 'gap') ({ kicker, title, body } = panelGap(S.sel.id));
  } catch (e) {
    kicker = 'error'; title = 'Could not build this panel';
    body = `<div class="derivation">${h(e.message)}</div>`;
  }
  p.hidden = false;
  p.innerHTML = `
    <div class="panel-hd">
      <div style="min-width:0">
        <div class="kicker">${h(kicker)}</div>
        <h3 class="${S.sel.type === 'node' || S.sel.type === 'module' ? 'mono' : ''}">${h(title)}</h3>
      </div>
      <button class="icon-btn" data-close style="margin-left:auto;flex:none" aria-label="Close detail (Esc)" data-fk="panel-close">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </div>
    <div class="panel-bd">${body}</div>`;
  $('[data-close]', p).addEventListener('click', () => select(null));
  wirePanel(p);
}

function panelModule(name) {
  const IX = S.IX;
  const m = IX.modules.find(x => x.name === name) || null;
  const planned = (S.state?.plannedModules || []).find(x => x.name === name) || null;
  const nodes = IX.byModule.get(name) || [];
  const gaps = IX.gapsByModule.get(name) || [];
  const note = S.state?.moduleNotes?.[name]?.note || '';

  if (!m && planned) {
    return { kicker: 'planned module', title: name, body: `
      <div class="panel-sec"><div class="derivation">Not written. Nothing in <span class="mono">model/</span> carries this name, so every column is <b>planned</b> rather than derived.</div></div>
      <div class="panel-sec"><h4>Purpose</h4><div>${planned.purpose ? h(planned.purpose) : UNKNOWN}</div></div>
      ${(planned.holds || []).length ? `<div class="panel-sec"><h4>Holds</h4><div class="chiplist">${planned.holds.map(x => `<span class="chip">${h(x)}</span>`).join('')}</div></div>` : ''}
      ${moduleNoteHTML(name, note)}` };
  }

  const cells = cellsFor(name);
  return { kicker: 'module', title: name, body: `
    <div class="panel-sec">
      <dl class="kv">
        <dt>file</dt><dd class="mono">${m?.file ? h(m.file) : UNKNOWN}</dd>
        <dt>lines</dt><dd class="mono">${isNum(m?.lines) ? m.lines : UNKNOWN}</dd>
        <dt>entities</dt><dd class="mono">${nodes.filter(n => n.kind === 'entity').length}${isNum(m?.entities) && m.entities !== nodes.filter(n => n.kind === 'entity').length ? ` <span class="unknown">(module header says ${m.entities})</span>` : ''}</dd>
        <dt>value objects</dt><dd class="mono">${nodes.filter(n => n.kind === 'value_object').length}${isNum(m?.valueObjects) && m.valueObjects !== nodes.filter(n => n.kind === 'value_object').length ? ` <span class="unknown">(header says ${m.valueObjects})</span>` : ''}</dd>
        <dt>gaps</dt><dd class="mono">${gaps.length}</dd>
      </dl>
    </div>
    <div class="panel-sec"><h4>Purpose</h4><div>${m?.purpose ? h(m.purpose) : `<span class="unknown">No header comment was captured for this module.</span>`}</div></div>
    <div class="panel-sec"><h4>Columns</h4>
      <div class="linklist">${COLUMNS.map(c => `<button data-cell="${h(name)}|${c}" data-fk="pc-${c}">
        <span class="cell--${cells[c].state}" style="display:inline-flex"><span class="cell-mark"></span></span>
        <span>${c}</span><span class="mut">${isNum(cells[c].n) ? cells[c].n : '?'} · ${h(cells[c].sub)}</span></button>`).join('')}</div>
    </div>
    ${gaps.length ? `<div class="panel-sec"><h4>Gaps in this module</h4><div class="linklist">${gaps.map(gapLinkHTML).join('')}</div></div>` : ''}
    <div class="panel-sec"><h4>Types</h4><div class="chiplist">
      ${nodes.length ? nodes.map(n => `<button class="chip" data-node="${h(n.name)}" data-fk="pt-${h(n.name)}">${h(n.name)}</button>`).join('') : `<span class="unknown">none in the graph</span>`}
    </div></div>
    ${moduleNoteHTML(name, note)}` };
}

function moduleNoteHTML(name, note) {
  return `<div class="panel-sec">
    <h4>Your note on this module</h4>
    <div class="field">
      <textarea data-modnote="${h(name)}" data-fk="mn-${h(name)}" placeholder="what this module is for, what is missing, what you decided" rows="4">${h(note)}</textarea>
      <div style="display:flex;gap:8px;align-items:center;margin-top:6px">
        <button class="btn" data-modnote-save="${h(name)}" data-fk="mns-${h(name)}">Save note</button>
        <span class="saved-hint" data-modhint></span>
      </div>
    </div>
  </div>`;
}

function panelCell(modName, col) {
  const cells = cellsFor(modName);
  const cell = cells[col];
  if (!cell) return { kicker: 'cell', title: `${modName} · ${col}`, body: `<div class="derivation">Unknown column.</div>` };
  const lists = [];
  if (cell.ops?.length) lists.push(['Operations that name a type here', cell.ops.map(o => `<span class="chip">${h(o)}</span>`).join('')]);
  if (cell.caps?.length) lists.push(['Capabilities that name a type here', cell.caps.map(c => `<span class="chip">${h(c)}</span>`).join('')]);
  if (cell.tiers?.length) lists.push(['Contract tiers', cell.tiers.map(t => `<span class="chip">${h(t)}</span>`).join('')]);
  if (cell.classes?.length) lists.push(['Resource classes reached', cell.classes.map(t => `<span class="chip">${h(t)}</span>`).join('')]);
  return {
    kicker: `${modName} · ${col.toLowerCase()}`,
    title: cell.state === 'unknown' ? 'Not derivable from this graph' : `${cell.state}${isNum(cell.n) ? ` — ${cell.n}` : ''}`,
    body: `
      <div class="panel-sec">
        <h4>How this was derived</h4>
        <div class="derivation">${h(cell.how)}</div>
      </div>
      ${lists.map(([t, html]) => `<div class="panel-sec"><h4>${h(t)}</h4><div class="chiplist">${html}</div></div>`).join('')}
      ${cell.gaps?.length ? `<div class="panel-sec"><h4>Gaps behind this cell</h4><div class="linklist">${cell.gaps.map(gapLinkHTML).join('')}</div></div>`
        : `<div class="panel-sec"><h4>Gaps behind this cell</h4><div class="unknown">None recorded against this column.</div></div>`}
      <div class="panel-sec"><button class="btn btn-ghost" data-module="${h(modName)}" data-fk="pcm">Open the whole module</button></div>`,
  };
}

function panelNode(name) {
  const IX = S.IX;
  const n = IX.byName.get(name);
  const gn = G.byName.get(name);
  if (!n) {
    /* A phantom: the graph references it, but no type declares it. Inbound
       comes from the built graph where possible, because that is the only
       place a target inferred from a field name is resolved. */
    const inbound = (G.built && G.byName.has(name))
      ? G.links.filter(l => l.to.name === name).map(l => l.inferred ? Object.assign({}, l.e, { _inferredTo: name }) : l.e)
      : IX.edges.filter(e => e.to === name);
    return { kicker: 'not a type in this model', title: name, body: `
      <div class="panel-sec"><div class="derivation">Nothing in <span class="mono">model/</span> declares this name. It is drawn because ${inbound.length || 'one or more'} reference${inbound.length === 1 ? '' : 's'} point${inbound.length === 1 ? 's' : ''} at it — which is exactly the failure a phantom brand produces: the compiler never resolves the brand, so <span class="mono">tsc</span> passes and the reference silently addresses nothing.</div></div>
      ${inbound.length ? `<div class="panel-sec"><h4>Referenced by</h4><div class="linklist">${inbound.map(edgeLinkHTML).join('')}</div></div>` : ''}
      ${(IX.gapsBySubject.get(name) || []).length ? `<div class="panel-sec"><h4>Gaps</h4><div class="linklist">${(IX.gapsBySubject.get(name) || []).map(gapLinkHTML).join('')}</div></div>` : ''}` };
  }
  const out = IX.outAll.get(name) || [];
  const inT = IX.inTyped.get(name) || [];
  const bare = IX.bareTo.get(name) || [];
  const gaps = IX.gapsBySubject.get(name) || [];
  const brands = IX.idTypes.filter(t => t.brand === name || t.resolvesTo === name);
  const unref = inT.length === 0;

  return { kicker: `${n.kind === 'value_object' ? 'value object' : n.kind} · ${n.module}`, title: name, body: `
    <div class="panel-sec"><dl class="kv">
      <dt>module</dt><dd class="mono">${h(n.module)}</dd>
      <dt>kind</dt><dd class="mono">${h(n.kind)}</dd>
      <dt>tenant scoped</dt><dd class="mono">${n.tenantScoped === true ? 'yes' : n.tenantScoped === false ? 'no' : UNKNOWN}</dd>
      <dt>declared at</dt><dd class="mono">${isNum(n.line) ? `${h((IX.modules.find(m => m.name === n.module) || {}).file || n.module)}:${n.line}` : UNKNOWN}</dd>
      <dt>degree</dt><dd class="mono">${gn ? gn.deg : out.length + inT.length}</dd>
    </dl></div>
    ${unref ? `<div class="panel-sec"><div class="derivation" style="border-color:var(--warn-edge);background:var(--warn-wash);color:var(--warn)">
        <b>No typed reference points at this type.</b> ${bare.length
          ? `It is not orphaned in the model — ${bare.length} id-shaped field${bare.length === 1 ? '' : 's'} below name${bare.length === 1 ? 's' : ''} it as a bare string${bare.some(e => e._inferredTo) ? ', at least one of which is inferred from the field name rather than stated' : ''}. Typing the field restores the edge.`
          : 'And no untyped field names it either — so it is terminal by design, or it is not wired up.'}
      </div></div>` : ''}
    ${brands.length ? `<div class="panel-sec"><h4>Id types</h4><div class="linklist">${brands.map(t => `
      <button data-node="${h(t.resolvesTo || t.brand)}" data-fk="pb-${h(t.name)}"><span class="id">${h(t.name)}</span>
      <span class="mut">brand ${h(t.brand)}${t.resolvesTo ? ` → ${h(t.resolvesTo)}` : ' → unresolved'}${isNum(t.line) ? ` · ${h(t.declaredIn || '')}:${t.line}` : ''}</span></button>`).join('')}</div></div>` : ''}
    <div class="panel-sec"><h4>Points at (${out.length})</h4>
      <div class="linklist">${out.length ? out.map(edgeLinkHTML).join('') : '<span class="unknown">nothing</span>'}</div></div>
    <div class="panel-sec"><h4>Pointed at, typed (${inT.length})</h4>
      <div class="linklist">${inT.length ? inT.map(edgeLinkHTML).join('') : '<span class="unknown">nothing</span>'}</div></div>
    ${bare.length ? `<div class="panel-sec"><h4>Named by an untyped field (${bare.length})</h4>
      <div class="linklist">${bare.map(edgeLinkHTML).join('')}</div></div>` : ''}
    ${gaps.length ? `<div class="panel-sec"><h4>Gaps</h4><div class="linklist">${gaps.map(gapLinkHTML).join('')}</div></div>` : ''}` };
}

function edgeLinkHTML(e) {
  const kind = e.kind || 'typed';
  return `<button data-edge="${h(e.from)}|${h(e.field)}" data-fk="pe-${h(e.from)}-${h(e.field)}">
    <span class="id">${h(e.from)}<span style="color:var(--quiet)">.</span>${h(e.field)}</span>
    <span class="chip c-${kind}" style="margin-left:6px">${h(kind)}</span>
    <span class="mut">${e.to ? h(e.to) : (e._inferredTo ? `${h(e._inferredTo)} (inferred)` : 'no target')}${e.typedAs ? ` · ${h(e.typedAs)}` : ''}${e.cardinality ? ` · ${h(e.cardinality)}` : ''}</span>
  </button>`;
}
function gapLinkHTML(gp) {
  const d = dispositionOf(gp.id);
  return `<button data-gap="${h(gp.id)}" data-fk="pg-${h(gp.id)}">
    <span class="id">${h(gp.subject || gp.id)}</span>
    <span class="mut">${h(KINDS[gp.kind]?.label || gp.kind)} · ${d}</span></button>`;
}

function panelGap(id) {
  const gp = S.IX.gaps.find(x => x.id === id);
  if (!gp) return { kicker: 'gap', title: id, body: `<div class="derivation">No gap with this id is in the current graph. Your disposition for it is still in the state file — regenerate the graph, or the id has changed.</div>` };
  const rec = gapRecord(id);
  const meta = KINDS[gp.kind] || { label: gp.kind, note: '', decides: 'detector' };
  const subjNode = S.IX.byName.get(gp.subject);
  return { kicker: meta.label, title: gp.subject || gp.id, body: `
    ${meta.decides === 'you' ? `<div class="panel-sec"><div class="derivation" style="border-color:var(--primary-edge);background:var(--primary-wash);color:var(--primary)"><b>This one waits on you.</b> The detector can find the shape but cannot settle whether it is a defect.</div></div>` : ''}
    <div class="panel-sec"><h4>What was detected</h4><div>${gp.detail ? h(gp.detail) : UNKNOWN}</div></div>
    <div class="panel-sec"><h4>What this kind means</h4><div class="derivation">${h(meta.note)}</div></div>
    <div class="panel-sec"><dl class="kv">
      <dt>id</dt><dd class="mono">${h(gp.id)}</dd>
      <dt>kind</dt><dd class="mono">${h(gp.kind)}</dd>
      <dt>module</dt><dd class="mono">${gp.module ? h(gp.module) : UNKNOWN}</dd>
      <dt>evidence</dt><dd class="mono">${gp.evidence ? h(gp.evidence) : UNKNOWN}</dd>
      <dt>affects</dt><dd class="mono">${isNum(gp.affects) ? gp.affects : UNKNOWN}</dd>
      <dt>severity</dt><dd class="mono">${gp.severity ? h(gp.severity) : UNKNOWN}</dd>
      <dt>set</dt><dd class="mono">${rec.at ? h(shortTime(rec.at)) : 'never'}</dd>
    </dl></div>
    <div class="panel-sec"><h4>Disposition</h4>
      <div class="seg" role="group" aria-label="Disposition">
        ${DISPOSITIONS.map(d => `<button data-gapid="${h(gp.id)}" data-d="${d}" data-fk="pd-${d}" aria-pressed="${rec.disposition === d}">${d}</button>`).join('')}
      </div>
      <div class="noterow" style="margin-top:8px">
        <input class="note-i" type="text" placeholder="note" value="${h(rec.note)}" data-note="${h(gp.id)}" data-fk="pgn" aria-label="Note">
        <input class="own-i" type="text" placeholder="owner" value="${h(rec.owner)}" data-owner="${h(gp.id)}" data-fk="pgo" aria-label="Owner">
      </div>
      <div class="saved-hint" data-hint="${h(gp.id)}"></div>
    </div>
    ${subjNode ? `<div class="panel-sec"><button class="btn btn-ghost" data-node="${h(gp.subject)}" data-fk="pgs">Open ${h(gp.subject)} in the graph</button></div>` : ''}` };
}

function wirePanel(p) {
  p.querySelectorAll('[data-node]').forEach(b => b.addEventListener('click', () => {
    const name = b.dataset.node;
    select({ type: 'node', name });
    if (S.view === 'graph') { const n = G.byName.get(name); if (n) { centreOn(n); } }
  }));
  p.querySelectorAll('[data-gap]').forEach(b => b.addEventListener('click', () => select({ type: 'gap', id: b.dataset.gap })));
  p.querySelectorAll('[data-module]').forEach(b => b.addEventListener('click', () => select({ type: 'module', module: b.dataset.module })));
  p.querySelectorAll('[data-cell]').forEach(b => b.addEventListener('click', () => {
    const [m, c] = b.dataset.cell.split('|'); select({ type: 'cell', module: m, col: c });
  }));
  p.querySelectorAll('[data-edge]').forEach(b => b.addEventListener('click', () => {
    const [from] = b.dataset.edge.split('|'); select({ type: 'node', name: from });
  }));
  wireGapControls(p);
  const saveNote = p.querySelector('[data-modnote-save]');
  if (saveNote) saveNote.addEventListener('click', async () => {
    const name = saveNote.dataset.modnoteSave;
    const ta = p.querySelector(`[data-modnote="${CSS.escape(name)}"]`);
    if (await mutate('setModuleNote', { module: name, note: ta.value })) {
      const hint = p.querySelector('[data-modhint]');
      if (hint) { hint.textContent = 'saved'; setTimeout(() => { hint.textContent = ''; }, 1800); }
      if (S.view === 'matrix') renderMatrix();
      if (S.view === 'plan') renderPlan();
    }
  });
}

/* ══ SHELL ═══════════════════════════════════════════════════════════════════ */
function withFocus(fn) {
  const a = document.activeElement;
  const key = a && a.dataset ? a.dataset.fk : null;
  const pos = (a && typeof a.selectionStart === 'number') ? a.selectionStart : null;
  fn();
  if (!key) return;
  const t = document.querySelector(`[data-fk="${CSS.escape(key)}"]`);
  if (!t) return;
  t.focus({ preventScroll: true });
  if (pos != null && typeof t.setSelectionRange === 'function') { try { t.setSelectionRange(pos, pos); } catch { /* not a text input */ } }
}

function renderCurrent() {
  if (S.view === 'matrix') renderMatrix();
  else if (S.view === 'graph') renderGraph();
  else if (S.view === 'gaps') renderGaps();
  else if (S.view === 'plan') renderPlan();
  renderTabCounts();
}

function setView(v, { push = true } = {}) {
  if (!VIEWS.includes(v)) v = 'matrix';
  S.view = v;
  VIEWS.forEach(x => {
    $('#view-' + x).hidden = x !== v;
    $('#tab-' + x).setAttribute('aria-selected', String(x === v));
  });
  renderCurrent();
  if (push) writeHash();
}

function renderTabCounts() {
  const IX = S.IX;
  const openGaps = IX.gaps.filter(gp => dispositionOf(gp.id) === 'open').length;
  const set = (k, v, alert) => {
    const el = document.querySelector(`.tab-count[data-c="${k}"]`);
    el.textContent = v; el.classList.toggle('is-alert', !!alert);
  };
  set('matrix', IX.moduleOrder.length + (S.state?.plannedModules?.length || 0));
  set('graph', IX.nodes.length);
  set('gaps', openGaps, openGaps > 0);
  set('plan', (S.state?.plannedModules?.length || 0) + (S.state?.plannedEdges?.length || 0) + (S.state?.decisions?.length || 0));
}

let hashLock = false;
function writeHash() {
  const k = selKey(S.sel);
  const next = '#' + S.view + (k ? '/' + encodeURIComponent(k) : '');
  if (location.hash !== next) { hashLock = true; location.hash = next; setTimeout(() => { hashLock = false; }, 0); }
}
function readHash() {
  const raw = decodeURIComponent(location.hash.replace(/^#/, ''));
  const [v, ...rest] = raw.split('/');
  const view = VIEWS.includes(v) ? v : 'matrix';
  const sel = selFromKey(rest.join('/'));
  S.sel = sel;
  document.body.classList.toggle('panel-open', !!sel);
  setView(view, { push: false });
  renderPanel();
}

function renderProvenance() {
  const el = $('#prov'), g = S.graph;
  const commit = g.sourceCommit || null;
  const gen = g.generatedAt || null;
  const t = Date.parse(gen || '');
  const stale = Number.isFinite(t) && (Date.now() - t) > 6 * 3600 * 1000;
  el.className = 'prov' + (stale ? ' is-stale' : '');
  el.setAttribute('role', 'button');
  el.setAttribute('tabindex', '0');
  el.dataset.fk = 'prov';
  el.title = `model-graph.json — generated ${gen || 'unknown'}, source commit ${commit || 'unknown'}.\nRegenerate: node tools/planner/extract.mjs`;
  el.innerHTML = `<b>${commit ? h(commit) : 'commit unknown'}</b>` +
    `<span class="prov-time">${gen ? ` · ${h(relTime(gen) || shortTime(gen))}` : ' · <span class="unknown">generated unknown</span>'}${stale ? ' · stale' : ''}</span>`;
  const announce = () => toast(stale ? 'bad' : '', stale ? 'This graph may be stale' : 'Graph provenance',
    `generated ${gen || 'unknown'} from ${commit || 'an unknown commit'} — regenerate with: node tools/planner/extract.mjs --write`);
  el.onclick = announce;
  el.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); announce(); } };
}

function renderBanner() {
  const b = $('#banner');
  if (S.serverOk) { b.hidden = true; b.innerHTML = ''; return; }
  b.hidden = false;
  b.className = 'banner is-bad';
  b.innerHTML = `<div><b>The state server is not running, so nothing you change here can be saved.</b>
    The graph below is read-only. Start the server, then reload:
    <code>node tools/planner/serve.mjs</code></div>`;
}

/* ─── theme ──────────────────────────────────────────────────────────────── */
const THEME_KEY = 'reconcile-planner-theme';
function applyTheme(pref) {
  const root = document.documentElement;
  if (pref === 'light' || pref === 'dark') root.setAttribute('data-theme', pref);
  else root.removeAttribute('data-theme');
  const dark = (pref === 'dark') || (!pref && window.matchMedia('(prefers-color-scheme: dark)').matches);
  root.classList.toggle('is-dark', dark);
  if (G.ctx) draw();
}
function initTheme() {
  let pref = null;
  try { pref = localStorage.getItem(THEME_KEY); } catch { /* private mode */ }
  applyTheme(pref);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    let p = null; try { p = localStorage.getItem(THEME_KEY); } catch { /* ignore */ }
    if (!p) applyTheme(null);
  });
  $('#theme').addEventListener('click', () => {
    const dark = document.documentElement.classList.contains('is-dark');
    const next = dark ? 'light' : 'dark';
    try { localStorage.setItem(THEME_KEY, next); } catch { /* ignore */ }
    applyTheme(next);
    if (S.view === 'matrix' || S.view === 'graph') renderCurrent();
  });
}

/* ─── boot ───────────────────────────────────────────────────────────────── */
function showBoot(html) {
  const b = $('#boot');
  b.hidden = false;
  b.querySelector('.box').innerHTML = html;
}

async function boot() {
  initTheme();

  try {
    S.graph = await getJSON('/model-graph.json');
  } catch (e) {
    showBoot(`
      <h2>There is no graph to show yet</h2>
      <p><span class="mono">/model-graph.json</span> could not be read — ${h(e.message)}.
         This page renders only what the extractor derived from <span class="mono">model/</span>; it does not guess.</p>
      <pre>node tools/planner/extract.mjs --write
node tools/planner/serve.mjs</pre>
      <p>Then reload. If the server is running and this still fails, the extractor has not written
         <span class="mono">docs/model-graph.json</span>.</p>`);
    return;
  }
  if (!Array.isArray(S.graph.nodes) || !Array.isArray(S.graph.modules)) {
    showBoot(`<h2>The graph is not in the expected shape</h2>
      <p><span class="mono">/model-graph.json</span> parsed, but it carries no <span class="mono">nodes</span> or no
         <span class="mono">modules</span> array. Rather than invent a shape, this page stops here.</p>
      <pre>node tools/planner/extract.mjs --write</pre>`);
    return;
  }

  S.IX = buildIndex(S.graph);
  S.graphF.modules = new Set(S.IX.moduleOrder);

  try {
    const raw = await getJSON('/api/state');
    S.state = unwrapState(raw) || normState({});
  } catch (e) {
    S.serverOk = false;
    S.state = normState({});
  }

  renderProvenance();
  renderBanner();
  wireShell();
  readHash();
}

function wireShell() {
  $$('.tabs button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));

  const q = $('#q');
  q.dataset.fk = 'q';
  let t = 0;
  q.addEventListener('input', () => {
    clearTimeout(t);
    t = setTimeout(() => {
      S.q = q.value.trim();
      if (S.view === 'graph') draw();
      else withFocus(renderCurrent);
    }, 130);
  });

  window.addEventListener('hashchange', () => { if (!hashLock) readHash(); });

  window.addEventListener('keydown', (ev) => {
    const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
    if (ev.key === '/' && !inField && !ev.metaKey && !ev.ctrlKey) { ev.preventDefault(); q.focus(); q.select(); }
    else if (ev.key === 'Escape') {
      if (document.activeElement === q) { q.blur(); }
      else if (S.sel) { select(null); }
    }
  });
}

boot();
</script>
</body>
</html>
