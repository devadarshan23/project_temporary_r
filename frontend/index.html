<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- G3044: the client sets a per-route title on its first render
         (frontend/src/routes/surfaces.ts). This said "ReconcileAI — kernel
         primitives", the specimen's title, on every page of the product. -->
    <title>ReconcileAI</title>
    <!-- RV-13 (G3392): paint the right theme on the FIRST frame — a blocking
         classic script, not inline, so no inline script exists for a CSP to
         have to allow (and §8's injected-script detector stays exact). It is a
         copy of frontend/src/theme.ts resolve(); tests/app/theme.test.ts
         executes it against the module for every input. -->
    <script src="/theme-boot.js"></script>
    <!-- RV-01, G3391: the kernel's two faces are self-hosted (frontend/fonts/,
         OFL) and declared by frontend/fonts/plex.css, imported from main.tsx.
         The two critical faces are preloaded; Vite rewrites these hrefs to the
         SAME hashed asset the @font-face url() resolves to, so the preload is
         used rather than fetched twice. -->
    <link rel="preload" href="./fonts/IBMPlexSans-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/IBMPlexMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <!-- The dev and client entry. The page tests/design/ asserts against is
         frontend/dist/specimen.html, which is PRE-RENDERED from the same
         <Specimen/> by src/prerender.tsx — a module script cannot load over
         file://, so the built page carries markup rather than a mount point. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
