openapi: 3.1.0
info:
  title: wire-mirror fixture — INTAKE CHANNEL DRIFT (the red witness for `intake_channel_kinds`)
  version: 0.0.0
  description: |
    Fixture for tools/check-wire-mirror.mjs. NOT a real contract, and
    DELIBERATELY WRONG.

    It exists because G109's amendment (11 Aug 2026) is not optional: a pair is
    verified RED against a drifted fixture BEFORE it is pointed at the tree. A
    pair registered green-first is a pair nobody has watched fail, and a checker
    that has never failed is `docs/HANDOFF.md` §5.6 wearing the uniform of the
    tools written to catch it.

    DRIFT IN BOTH DIRECTIONS AT ONCE, AND BOTH ARE THE EXACT DRIFT G184 RULES
    AGAINST rather than an arbitrary mutation:

      • MISSING — `watched_drop` is absent. It is one of the two lanes the
                  deleted three-value `SourceDocument.origin` collapsed into
                  `connector`, and dropping it from the wire is the projection
                  G184 says makes an `EndpointHealth` row unattributable to the
                  lane that produced it.
      • EXTRA   — `api` is present. That is the member G184 DROPS, and the
                  failure mode it names by name: a wire that carries it while
                  the model does not invites the reader to fold it into
                  `upload`, which is a presigned PUT and a different act.

    ⚠️ THE MEMBER ORDER IS ALSO DISTURBED AND THAT IS NOT WHAT THIS FIXTURE
    WITNESSES. The sets differ, so missing/extra dominate and the ordering never
    becomes the reason for the finding. An order-only drift on this pair is
    witnessed by `intake-channel-reordered.openapi.yaml`, because a fixture that
    claims a property its own red run does not exercise is worse than no fixture.
paths: {}
components:
  schemas:
    IntakeChannelStatus:
      type: object
      additionalProperties: false
      required: [channel, wired, lastArrivalAt]
      properties:
        channel:
          type: string
          enum: [mailbox, upload, connector_pull, api]
        wired: { type: boolean }
        lastArrivalAt: { type: [string, 'null'], format: date-time }
