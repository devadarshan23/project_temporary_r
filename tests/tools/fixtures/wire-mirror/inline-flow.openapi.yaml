openapi: 3.1.0
info:
  title: wire-mirror fixture — INLINE FLOW, MIRRORED (the green control)
  version: 0.0.0
  description: |
    Fixture for tools/check-wire-mirror.mjs. NOT a real contract. It is excluded
    from the real-tree scan by the `fixtures` path segment; see
    EXCLUDED_DIR_NAMES in the checker and the exclusion test beside it.

    It exists because the real `Run.status` in capability.openapi.yaml states
    its vocabulary as an INLINE FLOW MAPPING — `status: { type: string, enum:
    [...] }` — not as a block mapping. The four contracts use both forms, and a
    checker that reads only the block form would have reported nothing at all
    for the pair it was written to hold.
paths: {}
components:
  schemas:
    FixtureRun:
      type: object
      additionalProperties: false
      required: [runId, status]
      properties:
        runId: { type: string }
        status: { type: string, enum: [queued, running, completed, failed] }
