openapi: 3.1.0
info:
  title: wire-mirror fixture — MISSING ARM (deliberately drifted, must never be scanned)
  version: 0.0.0
  description: |
    Fixture for tools/check-wire-mirror.mjs. NOT a real contract, and DELIBERATELY
    WRONG. `FixtureLocation` omits `charlie`, which the fixture model declares.
    `Meter` omits `api_calls`, which model/billing.ts declares — that schema
    exists only so the checker's PROCESS exit code can be witnessed as 1 against
    a registered real pair without editing a real contract file.

    If this file is ever picked up by the real-tree scan, `npm run check` goes
    permanently red. That is what the `fixtures` exclusion exists to prevent.
paths: {}
components:
  schemas:
    FixtureLocation:
      type: object
      additionalProperties: true
      required: [kind]
      properties:
        kind:
          type: string
          enum:
            - alpha
            - bravo

    Meter:
      type: string
      enum:
        - input_tokens
        - output_tokens
        - documents_processed
        - pages_extracted
        - reconciliations_run
        - exceptions_raised
        - storage_gb_month
