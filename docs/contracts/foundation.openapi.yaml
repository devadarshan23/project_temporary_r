# ------------------------------------------------------------- reason codes
    #
    # 🛑 A LOCAL COPY OF `errors.yaml#/components/schemas/ErrorCode`, GENERATED
    # FROM IT, AND THE COPY IS A RULING RATHER THAN AN OVERSIGHT. The owner,
    # 21 Sep 2026: *"Stop `$ref`-ing `errors.yaml` from success bodies. A
    # success body carries its own closed enum rather than pointing at the error
    # taxonomy."* `server/contract/bundle.ts` is NOT changed and its refusal of
    # external pointers stands — that refusal is the thing that made a success
    # body pointing here unserialisable, and it is deliberate.
    #
    # ⚠️ WHAT IT COST, NAMED RATHER THAN DISCOVERED: this is a SECOND HOME for a
    # closed vocabulary, which is `db/migrations/0002`'s *"third place to
    # drift"*. It is a MIRROR rather than a fork, and the thing that makes it one
    # is `tests/contracts/success-body-error-codes.test.ts`, which asserts SET
    # EQUALITY WITH `errors.yaml` IN BOTH DIRECTIONS and compares ORDER —
    # `db/migrations/0008`'s precedent for seeded reference data, and
    # `tests/contracts/field-path-wire.test.ts` §3's precedent for a structural
    # copy this same bundler refusal already forced on `FieldPath`.
    #
    # ⚠️ IT IS NOT NARROWED, AND THE NON-NARROWING IS A DECISION WITH A
    # MEASUREMENT BEHIND IT. Only FIVE of these members can be produced into a
    # success body today — `BLOCKER_CODE` in
    # `server/data-plane/resolution-vocabulary.ts` is a TOTAL
    # `Record<ApprovalBlocker, string>` over four, and `unavailableFor`'s
    # producer writes two literals. A narrowed copy was refused for three
    # measured reasons: `decidableBy.blockedBy` has NO producer at all, so any
    # subset there is a guess; at `fast-json-stringify@7.0.1` an `enum` nested
    # in a `oneOf` IS ENFORCED, so an under-guess on `unavailableFor` is a 500
    # in production rather than a documentation error; and a narrow set has no
    # mechanically checkable completeness direction, which is the whole control.
    # **This slice changes the POINTER, not the SURFACE.** Narrowing is a second
    # ruling and needs producers most of these fields do not have.
    #
    # ⚠️ IT IS APPENDED AT THE END OF `components.schemas` DELIBERATELY, AND NOT
    # PLACED ALPHABETICALLY. `docs/contracts/README.md` records that roughly
    # sixty citations in this record address these files as `file.yaml:NNN`;
    # inserting 88 lines anywhere above would shift every one of them into
    # the resolving-but-wrong class `tools/check-citations.mjs` structurally
    # cannot catch.
    #
    # DERIVED, NEVER HAND-TYPED. Regenerate and diff:
    #   node -e "const y=require('yaml'),f=require('fs');\
    #     const p=(x)=>y.parse(f.readFileSync(x,'utf8')).components.schemas.ErrorCode.enum;\
    #     console.log(JSON.stringify(p('docs/contracts/errors.yaml'))===\
    #       JSON.stringify(p('docs/contracts/<this file>')))"

