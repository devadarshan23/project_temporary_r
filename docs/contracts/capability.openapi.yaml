                  definitions:
                    type: array
                    items: { $ref: '#/components/schemas/FacetCount' }
                  ruleLabels:
                    type: array
                    items: { $ref: '#/components/schemas/FacetCount' }
                  severities:
                    type: array
                    items: { $ref: '#/components/schemas/FacetCount' }
        '403': { $ref: '#/components/responses/Denied' }
        '422':
          description: '`validation_failed` — two assignee terms at once (G3424).'
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }

  /exceptions/{exceptionId}:
    get:
      tags: [C6 Exception]
      operationId: getException
      x-capability: view_exception
      x-partner-exposure: 'accepted: one row of the queue a partner is supporting; refusing it while permitting the list would be a clamp nobody could operate under'
      summary: One exception, with the explanation that justifies it.
      description: |
        PRODUCT.md Principle 1 — an exception without its explanation has lost
        the product's point. `explanation` is non-optional in the model and
        non-optional here.

        THE EXPLANATION IS DIRECTIONAL. It reads "the invoice disagrees with
        the purchase order", never the reverse, because the reference slot
        decides which side is authority. `expected` is drawn from the reference
        slot; `observed[]` are the comparands. A client rendering these
        symmetrically throws away the only thing that makes the sentence mean
        something.

        ON `confidence` — WHY IT IS HERE AND ONLY HERE.

        `Explanation.confidence` is exposed on this operation and on no other.
        It is absent from `ExceptionQueueRow`, absent from every filter and
        sort parameter, and absent from `ResolutionProposal`.

        The argument against exposing it at all is strong and it is the
        argument this contract took seriously. A displayed number invites the
        reviewer to treat it as the decision: sort by confidence descending,
        approve the top of the list, and the approval layer has become a
        formality performed at speed.
        `AutonomyDials.medianDecisionSeconds` was added precisely to make that
        failure measurable — "fast is a warning, not a reassurance", with
        `MIN_DECISION_SECONDS = 20` naming the point below which a median reads
        as rubber-stamping. Handing the queue a confidence column is handing it
        the tool to produce that median.

        The argument for exposing it on the DETAIL view is narrower and
        survives. Here the number sits beside `observed[]`, each of which
        carries its own `Provenance.confidence` and a page and a bounding box.
        In that setting a low number is a pointer at which value to check
        first, not a substitute for checking. Extraction confidence genuinely
        bears on the finding — a variance computed from a badly OCR'd figure is
        a different kind of exception from one computed from a parsed
        e-invoice, and hiding that makes the reviewer do the model's job
        blind.

        The distinction the contract draws is therefore not "show or hide" but
        "aggregate or situate". A number you can sort a list by is a ranking
        signal. The same number rendered against the evidence it was computed
        over is provenance. This document exposes the second and refuses to
        make the first constructible: there is no confidence field on the list,
        no confidence parameter on the query, and no bulk mutation that a
        ranking could feed.

        `confidence` is null for parsed documents — a structured e-invoice or a
        source-system pull needs no OCR, no model call and no confidence score.
        Null means "not applicable", never "unknown", and a client that renders
        null as 0% has inverted the meaning of the most trustworthy path in the
        product.
      parameters:
        - $ref: '#/components/parameters/ExceptionId'
      responses:
        '200':
          description: The exception, its explanation, and its resolution history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exception' }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }

  /exceptions/{exceptionId}/assignment:
    put:
      tags: [C6 Exception]
      operationId: assignException
      x-capability: assign_exception
      x-partner-exposure: 'accepted: taking a row is the operating act exceptions_operate names'
      summary: Assign, or clear the assignment.
      description: |
        A PUT rather than a PATCH because the field has exactly two states and
        an idempotent replace is the honest verb. Assigning to null unassigns.

        Assignment is not access. A user who cannot read the exception cannot
        be assigned it, and being assigned grants nothing that policy did not
        already allow — the field is a work-queue affordance, not an
        authorisation.
      parameters:
        - $ref: '#/components/parameters/ExceptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [assignedTo]
              properties:
                assignedTo:
                  type: [string, 'null']
                  description: |
                    A USER ID — the acting person's own (`getSessionPrincipal`'s
                    `userId`) to take a row, or another live member's. Never an
                    alias: G3426 refuses a value that names no member (422).
      responses:
        '200':
          description: Assigned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exception' }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: |
            `validation_failed` — `assignedTo` names nobody who holds a live
            membership in this tenant. G3426, 3 Oct 2026: a client sent the
            literal `me` and the plane stored it. Assign to yourself with your
            own user id (`getSessionPrincipal`'s `userId`).
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }

  /exceptions/{exceptionId}/reversals:
    post:
      tags: [C6 Exception]
      operationId: reverseResolution
      x-capability: reverse_resolution
      summary: Undo a resolution. Always a human, always with a closed reason.
      description: |
        A reversal is a correction, and corrections are signed. `reversedBy` is
        taken from the session and is always a user — there is no agent path to
        this operation, because an agent that can undo its own resolutions can
        launder a bad one.

        THE REASON VOCABULARY IS LOAD-BEARING AND IT IS NOT A COURTESY.
        `reversalIndictsAutonomy()` reads it: `wrong_disposition` and
        `insufficient_evidence` count against the autonomy that produced the
        resolution; `data_corrected`, `rule_wrong` and `downstream_rejected` do
        not. A resolution undone because the underlying data changed
        afterwards was the right judgement on what was known at the time, and
        counting it would have C13's loop strangle itself on the tenant's own
        data corrections — narrowing autonomy across the fleet while looking
        like evidence.

        Reversals accumulate as an array. An exception resolved, reversed,
        re-resolved and reversed again is a signal in itself, and a flag would
        have erased it.
      parameters:
        - $ref: '#/components/parameters/ExceptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, newStatus]
              properties:
                reason: { $ref: '#/components/schemas/ReversalReason' }
                newStatus:
                  $ref: '#/components/schemas/ExceptionStatus'
                  description: Where it goes. Usually back to `open`.
                note: { type: [string, 'null'] }
                correctedDispositionKey:
                  type: [string, 'null']
                  description: |
                    Set when the reverser chose a different disposition rather
                    than reopening. Validated against the same closed list as a
                    proposal — a correction is not an escape from the
                    vocabulary.
      responses:
        '201':
          description: Reversed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exception' }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Two distinct refusals share this status, distinguished by `code`:

              `validation_failed` — there is no resolution to reverse.
              Reversing an unresolved exception is a client bug, not a
              workflow.

              `reversal_window_expired` — the resolution is more than 24
              hours old. A resolution is reversible for 24 hours from when
              it was recorded; after that, a correction is a new entry with
              its own approval. An unlimited undo is not an audit trail.
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }
        '422':
          description: '`disposition_not_offered` on `correctedDispositionKey`.'
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }

  # ================================================================== C7
  /exceptions/{exceptionId}/procedure:
    get:
      tags: [C7 Procedure Runtime]
      operationId: getProcedureState
      x-capability: view_exception
      x-partner-exposure: 'accepted: where the walk stands, on a row the grant already reaches'
      summary: Where the harness has got to, and whether the caller can move it.
      description: |
        A procedure is a GRAPH, not a numbered list. There is no "step 3 of 7"
        in this response because there is no such thing — a branch and an
        escalation both make the remaining count meaningless, and a progress
        bar computed from one is a lie the UI tells confidently.

        `current` is a discriminated union and the discriminator is the whole
        message. The four states a caller must distinguish:

          `running`          the engine holds it. Nothing for a human to do.
          `awaiting_human`   a `human` step, addressed to a role.
          `parked`           an `await` step. NOT ADVANCEABLE BY A CALLER.
          `terminated`       a `terminate` step ran; the disposition closed it.

        THE `parked` VARIANT CARRIES `advanceable: false` AS A CONSTANT. A
        parked `await` on a counterparty reply resumes when a message on its
        thread is ADMITTED — not when one arrives, and never because a caller
        asserted that one did. That distinction is the entire control. If a
        client could advance a parked step, admission would be optional and the
        prompt-injection checkpoint would have a bypass reachable from a
        browser.

        The human-readable SOP is RENDERED from this graph rather than written
        beside it, which is why `renderedSopUrl` points at a derivation and not
        a document. A written SOP and the behaviour it describes drift; that is
        the failure mode written SOPs already have in the field.
      parameters:
        - $ref: '#/components/parameters/ExceptionId'
      responses:
        '200':
          description: |
            The procedure, the current node, and the path taken to reach it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcedureState' }
        '403': { $ref: '#/components/responses/Denied' }
        '404':
          description: |
            `resource_not_found` — the exception exists and its definition has
            no procedure. Distinct from a missing exception: it means the
            definition was authored without a harness, which is legal and
            visible rather than an error.
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }

  /exceptions/{exceptionId}/procedure/advance:
    post:
      tags: [C7 Procedure Runtime]
      operationId: advanceProcedureStep
      x-capability: advance_procedure
      x-partner-exposure: 'accepted: moving the walk is the operating act; a partner supporting the queue cannot support it without advancing a step'
      summary: Complete the current human step and take an edge.
      description: |
        POLICY IS ASKED AT EVERY STEP, NOT AT THE START. C7's whole job is to
        put F3 between the actor and the action every single time — "may this
        actor take this step, here, now". A procedure that checked once at
        entry would be a procedure whose autonomy envelope was decided before
        the exception's value at risk was known.

        `stepId` IS REQUIRED AND IS CHECKED AGAINST THE CURRENT NODE. It is not
        redundant with the path parameter: two operators open the same
        exception, one advances, the second's request arrives against a step
        that is no longer current and gets `step_not_current` instead of
        silently advancing whatever happens to be there now. Optimistic
        concurrency on a workflow is not optional when the workflow disburses
        money.

        `requiredEvidence` on the step is enforced here. A `human` step
        declaring `['document', 'correspondence']` is refused with
        `required_evidence_missing` until both kinds are attached — the
        boolean `requiresEvidence` this replaces had nowhere to put any, so
        the requirement was decorative.

        A CORRESPONDENCE EVIDENCE REF MUST NAME AN ADMITTED MESSAGE. Attaching
        an unadmitted message as evidence returns `message_not_admitted`. This
        is the same rule enforced at proposal time and it is enforced in both
        places on purpose: a check that exists at one of two call sites is a
        check with a documented bypass.
      parameters:
        - $ref: '#/components/parameters/ExceptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [stepId]
              properties:
                stepId:
                  type: string
                  description: Must equal the current node. See above.
                edge:
                  type: [string, 'null']
                  enum: ['true', 'false', 'timeout', null]
                  description: |
                    Null takes the unconditional edge. A `branch` is evaluated
                    by the engine from its predicate and never chosen by a
                    caller — passing `true` or `false` at a branch is refused,
                    because a caller who can pick a branch can route around the
                    predicate that governs the money threshold.
                evidence:
                  type: array
                  items: { $ref: '#/components/schemas/EvidenceInput' }
                note: { type: [string, 'null'] }
      responses:
        '200':
          description: Advanced. The new state, in the same shape as the GET.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcedureState' }
        '403':
          description: |
            `policy_denied` — F3 refused this actor at this step.
            `policy_requires_approval` — the step is permitted but not
            unattended; a proposal and an approval are the path.
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `step_not_current` — someone else moved it.
            `step_awaiting_reply` — the current node is a parked `await`. It
            resumes on admission or timeout and cannot be pushed.
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }
        '422':
          description: |
            `required_evidence_missing`, or `message_not_admitted` where a
            correspondence evidence ref names a message that is not evidence.
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }

  # ================================================================== C9
  /threads:
    get:
      tags: [C9 Correspondence]
      operationId: listThreads
      # `view_document`, NOT `view_exception`, AND THE §10.6 CITATION THAT STOOD
      # HERE WAS WRONG. §10.6 is an argument about a PUSHED digest channel versus
      # a pulled screen; it says nothing about thread metadata, and citing it
      # attributed the concern to a section that does not make it. The real
      # argument is one line up in the model: `view_document`'s own membership
      # entry reads "OPERATE ONLY. A document is the counterparty's paper, not a
      # count of it" — and `Thread.counterpartyName` and `Thread.subject` are
      # that same paper's letterhead. Under `view_exception` this landed in
      # `exceptions_read`, the WEAKER scope, while the document it concerns sat
      # in `exceptions_operate`. No capability is minted to fix that; the one
      # already scoped for counterparty paper is used.
      x-capability: view_document
      x-partner-exposure: 'accepted: a partner under exceptions_operate is working the break the conversation is about, and this is the same scope as the paper itself — the weaker exceptions_read reaches neither'
      summary: Conversations, filtered by exception or counterparty.
      description: |
        Threads and exceptions are MANY-TO-MANY. One vendor reply can concern
        three invoices and one exception can need two conversations. Filtering
        by `exceptionId` therefore returns threads that also concern other
        exceptions, and that is correct — hiding the rest would hide the reason
        the vendor's answer is ambiguous.

        `awaiting_reply` is the status that matters at close. Journey step 08:
        the exception stays open and visible rather than disappearing into
        someone's inbox, which is only true if this list is reachable from the
        queue.
      parameters:
        - name: exceptionId
          in: query
          schema: { type: string }
        - name: counterpartyId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/ThreadStatus' }
        - name: overdueOnly
          in: query
          description: |
            Threads whose `awaitDeadline` has passed. The parked step has
            timed out or is about to, and someone has to escalate.
          schema: { type: boolean }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of threads.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Thread' }
                  nextCursor: { type: [string, 'null'] }
        '403': { $ref: '#/components/responses/Denied' }

    post:
      tags: [C9 Correspondence]
      operationId: openThread
      x-capability: send_outbound
      summary: Start a conversation with a counterparty about an exception.
      description: |
        Opening a thread discloses nothing and is therefore not gated by the
        outbound ceiling. Sending the first message is. Separating the two
        means an operator can assemble the recipients and the linkage before
        the disclosure decision, rather than discovering at send time that the
        endpoint is unverified.

        LINKING A THREAD TO AN EXCEPTION IS A JUDGEMENT, AND IT IS AUDITED.
        `exceptionIds` is recorded as an AuditEvent rather than inferred from a
        subject line, because "which exceptions did we tell this vendor about"
        is a disclosure question and inference is not an answer to one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [counterpartyId, subject, channel, exceptionIds]
              properties:
                counterpartyId: { type: string }
                subject: { type: string }
                channel: { $ref: '#/components/schemas/CorrespondenceChannel' }
                exceptionIds:
                  type: array
                  items: { type: string }
      responses:
        '201':
          description: Opened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Thread' }
        '403': { $ref: '#/components/responses/Denied' }
        '422':
          description: |
            `outbound_channel_not_permitted` — the channel is not in
            `CorrespondenceConfig.permittedChannels`. Refused at open rather
            than at send, so nobody drafts into a channel that cannot be used.
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }

  /threads/{threadId}:
    get:
      tags: [C9 Correspondence]
      operationId: getThread
      x-capability: view_document
      x-partner-exposure: 'accepted: one thread, in the operate-only scope the counterparty paper it concerns already sits in — see listThreads for why this is not view_exception'
      summary: A thread and its messages, each with its evidence state.
      description: |
        EVERY MESSAGE CARRIES ITS `evidence` DISCRIMINATOR. A client cannot
        render this list without encountering the distinction between a message
        that has been admitted and one that has not — which is the design
        intent. A flat list of message bodies with an `admittedAt` timestamp
        somewhere in the object is a list where the timestamp gets ignored.

        Bodies are NOT in this response. `bodyRef` is a pointer; the body is
        content in object storage, never a column, never searched, and
        reachable by the erasure index only through SubjectLocation's `blob`
        variant. Fetch it separately so that fetching it is an auditable read.
      parameters:
        - $ref: '#/components/parameters/ThreadId'
      responses:
        '200':
          description: The thread with its messages in order.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [thread, messages]
                properties:
                  thread: { $ref: '#/components/schemas/Thread' }
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }

  /threads/{threadId}/messages/disclosure-check:
    post:
      tags: [C9 Correspondence]
      operationId: checkOutboundDisclosure
      x-capability: send_outbound
      summary: What would leave the tenant if this were sent, before it is sent.
      description: |
        A DRY RUN OF THE THIRD CEILING. F4's `apply-ceiling` at destination
        `outbound` returns `removedPaths` for exactly this reason: silent
        redaction "produces a chase email missing the number it was about".

        The chase needs detail to be useful — "invoice INV-4471 line 3, we
        received 90 and you billed 100" is the whole point of sending it. So
        the ceiling is a ceiling and an approval gate, never a blanket
        prohibition, and an operator has to be able to see which of those two
        they are facing before they commit.

        This writes NO DisclosureRecord and sends nothing. It is a policy
        query. The decision it reports can change between this call and the
        send if the policy version moves, which is why the send re-evaluates
        rather than trusting a token from here.
      parameters:
        - $ref: '#/components/parameters/ThreadId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OutboundDraft' }
      responses:
        '200':
          description: |
            What the ceiling would do. `verdict` is `sendable`,
            `sendable_redacted`, `requires_approval` or `refused`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisclosureCheck' }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }

  /threads/{threadId}/messages:
    post:
      tags: [C9 Correspondence]
      operationId: sendOutboundMessage
      x-capability: send_outbound
      summary: Send. This is a DISCLOSURE, and it writes a record saying so.
      description: |
        OUTBOUND IS DISCLOSURE TO A THIRD PARTY. Telling a vendor what we
        observed discloses tenant data to someone outside the tenant entirely.
        PDPA treats disclosure as a distinct act from collection or use, which
        makes this the most legally consequential of the three redaction
        ceilings and the only one whose recipient we do not control.

        THE `DisclosureRecord` IS WRITTEN BECAUSE THE DISCLOSURE HAPPENED, NOT
        AS A LOG LINE. It names `disclosedClass`, the exact `fieldsDisclosed`,
        the `policyVersion` in force and the approver where one was required.
        "Which fields did we send to which counterparty" has to be answerable
        without reading email bodies — a query over records, not a search over
        content.

        AN UNVERIFIED ENDPOINT IS REFUSED. `requireVerifiedEndpoint` exists
        because an unverified address is a phishing vector pointing outward:
        we would be the trusted party sending a customer's invoice details to
        an address a vendor's compromised mailbox rewrote.

        The message is `system_generated` or `operator_authored` and is
        ADMITTED AT CREATION. We composed it; there is nothing to decide about
        whether to believe it. Only `untrusted_inbound` faces the admission
        gate.

        An agent may send unattended only where `agentMaySendUnattended`
        allows, and F14's gate G3 has already proved statically that no path
        runs from untrusted content to an outbound notification without an
        intervening human step. This operation enforces the runtime half of
        that; the graph reachability half is checked at persistence.
      parameters:
        - $ref: '#/components/parameters/ThreadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OutboundDraft' }
      responses:
        '201':
          description: |
            Sent, with the disclosure record it produced and the paths the
            ceiling removed. The caller is told what it lost.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403':
          description: |
            `outbound_endpoint_unverified` — the endpoint has never been
            verified and `requireVerifiedEndpoint` is set.
            `policy_requires_approval` — the draft exceeds
            `requiresApprovalAboveClass` and no named approver was supplied.
            `policy_denied` — an agent actor where `agentMaySendUnattended` is
            false.
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422':
          description: |
            `classification_ceiling_exceeded` — a field the draft REQUIRES sits
            above `maxDataClassInOutbound`. Failing is correct: sending it
            anyway is the breach, and dropping it silently produces the chase
            email missing the number it was about.
            `outbound_channel_not_permitted`.
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }

  /messages/{messageId}:
    get:
      tags: [C9 Correspondence]
      operationId: getMessage
      x-capability: view_document
      x-partner-exposure: 'accepted: one message, and the narrowest form of it — `bodyRef` is a pointer and the body is not in this response, so what a partner reads here is the envelope and its evidence state'
      summary: One message, and precisely what it is allowed to be used for.
      description: |
        The response's `evidence` object is a discriminated union with three
        variants and no fourth. Read the discriminator before reading anything
        else.

        An unadmitted message MAY be read, displayed and audited. It may NOT be
        cited in a ResolutionProposal, fed to an agent as grounds, or satisfy
        an `await` step. Its attachments are blob refs and are NOT
        SourceDocuments — they become documents only after admission, which is
        where email intake and this module meet, and skipping it is how an
        attachment from a hostile sender enters extraction.
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: The message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }

  /messages/{messageId}/admission:
    post:
      tags: [C9 Correspondence]
      operationId: decideAdmission
      x-capability: admit_correspondence
      summary: THE TRUST BOUNDARY. Admit an inbound message as evidence, or refuse it.
      description: |
        THIS IS THE MOST SECURITY-SENSITIVE OPERATION IN THE PRODUCT.

        A vendor reply is read by an agent, which makes inbound correspondence
        the sharpest prompt-injection surface here. Invariant 6 — ingested
        content is data, never instruction — is enforced by making a message
        NOT EVIDENCE until something admits it. Without this checkpoint, "the
        agent read the email" and "the agent obeyed the email" are the same
        event.

        THREE STATES, NOT TWO. Unadmitted is not a weaker form of refused and
        refused is not a slower form of unadmitted:

          UNADMITTED  Both `admittedAsEvidenceAt` and `refusedFor` are null.
                      The decision has not been taken. The message is readable
                      and inert.
          ADMITTED    `admittedAsEvidenceAt` is set. It may now be cited, its
                      attachments become documents, and any parked `await` on
                      its thread resumes.
          REFUSED     `refusedFor` is set from a CLOSED vocabulary. Terminal.

        THE DECISION IS ONCE. A second call returns `admission_already_decided`
        rather than overwriting. An admission that can be re-taken is an
        admission that can be taken again after the first reviewer refused —
        which is the attack, performed through the UI.

        A REFUSAL IS A 200, NOT AN ERROR. It is a successful decision with a
        negative outcome, exactly as a policy denial is. Making it a 4xx would
        bury the most security-relevant signal in the product inside every
        dashboard that counts errors, and the count of refusals is a number
        somebody should be watching.

        A CALLER WHO MAY NOT DECIDE GETS A 403. That is different from a
        refusal and the codes say which: `admission_role_insufficient` (the
        caller does not hold `capabilityToAdmit`, or their org class is not in
        `orgClassesThatMayAdmit`), `admission_class_above_agent_ceiling`,
        `admitting_step_carries_tools`, or `admission_second_person_required`.

        `admission_role_insufficient` KEEPS ITS NAME after the 7 Aug 2026
        `RoleKey` migration, deliberately. `ErrorCode` is a closed published
        vocabulary and renaming a member to track an internal type rename is the
        divergence this repository has already been bitten by once. The name is
        now approximate; the meaning is stated above.

        WHY THE GATE IS A CAPABILITY AND NOT A ROLE LADDER. Decided 5 Aug 2026,
        completed 7 Aug 2026. The intent has not changed — the person already
        working the exception has read the thread, and routing admission to an
        approver turns a security decision into a queue, and queues get cleared
        in bulk without reading, which is precisely the failure the checkpoint
        exists to prevent. What changed is how that intent is expressed. An
        ordered ladder over five platform role keys excluded `'partner_admin'`
        while the partner clamp handed partners `'operator'` — the ladder's own
        minimum — and returned -1 for every composed role, denying the entire
        customer estate. `'admit_correspondence'` is a capability a tenant's own
        role can hold and a partner mask does not carry.

        `admittingToolScopeSize` IS RECORDED AT ADMISSION, NOT INFERRED LATER.
        Zero is the safe value for an agent. It is stored on the message so an
        audit can check the control held at the time rather than trusting that
        the procedure has not been edited since — a procedure edited after the
        fact would otherwise rewrite history for every message it ever
        admitted.

        AN AGENT CANNOT REACH THIS OPERATION FROM A BROWSER. The actor is
        derived from the session. Agent admission happens inside a procedure
        step through C7, where the step's tool scope is knowable; there is no
        parameter here by which a caller could assert that it is an agent
        carrying no tools.
      parameters:
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AdmitDecisionInput'
                - $ref: '#/components/schemas/RefuseDecisionInput'
              discriminator:
                propertyName: decision
                mapping:
                  admit: '#/components/schemas/AdmitDecisionInput'
                  refuse: '#/components/schemas/RefuseDecisionInput'
      responses:
        '200':
          description: |
            The decision was taken. `outcome` is `admitted` or `refused`, and
            the message's `evidence` object now reflects it. When admitted,
            `resumedStepId` names the parked step that this unblocked and
            `admittedDocumentIds` names the attachments that have just become
            SourceDocuments — both null on refusal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdmissionOutcome' }
        '403':
          description: |
            The caller may not decide. See the codes listed above. This is not
            a refusal of the message and it does not record one — an
            unauthorised attempt must not consume the single decision.
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `admission_already_decided` — this message has been admitted or
            refused. Terminal, by design.
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }
        '422':
          description: |
            `validation_failed` — a refusal without a `refusedFor`, or an
            admission decision on a message that is not `untrusted_inbound`
            (outbound and operator-authored messages are admitted at creation
            and there is nothing to decide).
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }

  # ================================================================== C10
  /exceptions/{exceptionId}/dispositions:
    get:
      tags: [C10 Resolution]
      operationId: listAvailableDispositions
      x-capability: view_exception
      x-partner-exposure: 'accepted: which dispositions are open on a row a partner is already working'
      summary: HOW A CLIENT DISCOVERS THE CLOSED SET. Never free text.
      description: |
        THIS OPERATION IS THE ANSWER TO "WHERE DO THE VALID VALUES COME FROM".

        A disposition key is never typed, never guessed and never carried in a
        client-side constant. The legal set for a given exception is the
        intersection of three things, none of which a client can compute:

          1. The dispositions the INSTALLED PACK offers (`SolutionPack.
             dispositions`, minted into the tenant at install).
          2. The families the definition's ARCHETYPE allows
             (`DISPOSITION_FAMILIES`). A pack parameterises within an
             archetype and can never extend it.
          3. What POLICY permits this actor to choose right now.

        `ResolutionProposal.action` used to be a free-text string. That single
        field made the judgement the product exists to automate unscoreable,
        unreportable, unlearnable and impossible to vary per domain — you
        cannot report a disposition mix over prose. Journey step 10 states the
        consequence plainly: never free text, which is what makes disposition
        mix reportable.

        UNAVAILABLE ENTRIES ARE RETURNED, NOT OMITTED. A disposition the actor
        may not choose comes back with `available: false` and a reason, because
        a UI that silently drops options teaches the operator that the option
        does not exist — and the reason it is unavailable (an irreversible
        disposition above the autonomy ceiling, a missing adjustment) is
        frequently the thing they need to know.

        `reversibility` IS DECLARED BY THE PACK AUTHOR AND NEVER INFERRED.
        Whether posting a credit note can be undone is a fact about the
        customer's finance process and the world, not about anything we can
        observe. It is also the only one of C13's four dials that cannot be
        measured, which is exactly why it has to be stated rather than left
        implicit in a disposition's name.
      parameters:
        - $ref: '#/components/parameters/ExceptionId'
      responses:
        '200':
          description: |
            The closed set for this exception, with availability per entry.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [archetype, dispositions]
                properties:
                  archetype: { $ref: '#/components/schemas/ReconciliationArchetype' }
                  packKey:
                    type: [string, 'null']
                    description: |
                      Null for a tenant-authored definition with no pack
                      behind it. The set is then whatever that definition's
                      archetype allows, which is narrower than a pack's and
                      visibly so.
                  dispositions:
                    type: array
                    items: { $ref: '#/components/schemas/AvailableDisposition' }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ResolutionNotConfigured' }

  /exceptions/{exceptionId}/proposals:
    get:
      tags: [C10 Resolution]
      operationId: listProposals
      x-capability: view_exception
      x-partner-exposure: 'accepted: a partner may propose and must therefore see what has already been proposed on the row'
      summary: Every proposal on this exception, current and superseded.
      description: |
        Superseded proposals are returned. An exception that took three
        proposals to settle is a signal about the rule or the pack, and
        deleting the first two erases it.

        In finance a disposition is often ALREADY PROPOSED by an agent with its
        evidence when the operator opens the exception; in KYC it is not,
        because autonomy defaults to `none` there. The same screen therefore
        behaves materially differently by domain, and a client should render
        the empty case as normal rather than as a failure.
      parameters:
        - $ref: '#/components/parameters/ExceptionId'
      responses:
        '200':
          description: Proposals, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Proposal' }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ResolutionNotConfigured' }

    post:
      tags: [C10 Resolution]
      operationId: proposeResolution
      x-capability: propose_resolution
      x-partner-exposure: 'accepted: propose_resolution is the operating verb the mask exists to permit; the invariant is that a partner may never be the APPROVING authority, and approve_resolution is out of every scope'
      summary: Propose a disposition, with the evidence for THIS disposition.
      description: |
        AN AGENT MAY PROPOSE; WHETHER IT MAY EXECUTE IS POLICY. `proposedBy` is
        a `ProposalActor` — a user or an agent step — because `propose_
        resolution` is a listed AgentAction and a `proposedBy: UserId` made the
        core act of an agentic product unrepresentable. From this operation the
        actor is always the session user; agent proposals arrive through C7.

        `evidence` IS FOR WHY *THIS* DISPOSITION, NOT WHY IT BROKE. Those are
        different questions and conflating them is the most common misreading
        of this model. `Explanation.observed[]` on the exception is why it
        broke. This is the delivery note, the vendor reply, the prior case that
        settled the same way — the grounds for choosing short delivery over
        price error.

        A CORRESPONDENCE REF MUST NAME AN ADMITTED MESSAGE. Citing an
        unadmitted message returns `message_not_admitted`. This is the second
        of the two enforcement points; C7's advance is the first.

        `adjustment` IS REQUIRED WHEN THE DISPOSITION SAYS SO
        (`requiresAdjustment`), and its currency must match the exception's
        `valueAtRisk`. A cross-currency adjustment accepted without conversion
        is the USD-invoice-against-SGD-purchase-order defect reappearing at the
        point where money actually moves.

        THIS OPERATION EXECUTES NOTHING. It records a proposal. Execution is
        gated separately and deliberately — see
        `POST /proposals/{proposalId}/execution`.
      parameters:
        - $ref: '#/components/parameters/ExceptionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [dispositionKey, rationale, evidence]
              properties:
                dispositionKey:
                  type: string
                  description: |
                    Must be one of the keys returned by
                    `GET /exceptions/{exceptionId}/dispositions` with
                    `available: true`. Any other value is
                    `disposition_not_offered`. There is no free-text fallback
                    and there will not be one.
                rationale:
                  type: string
                  description: |
                    Prose, and deliberately NOT the disposition. The key is the
                    machine-readable judgement; this is the sentence a human
                    reads six months later. Keeping them separate is what stops
                    the rationale becoming a de facto free-text disposition.
                evidence:
                  type: array
                  items: { $ref: '#/components/schemas/EvidenceInput' }
                adjustment:
                  oneOf:
                    - $ref: '#/components/schemas/Money'
                    - type: 'null'
      responses:
        '201':
          description: |
            Proposed. The response carries the `execution` block, which already
            says what still has to happen before this can be executed — usually
            an approval, sometimes two.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Proposal' }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `exception_already_resolved` — reverse the resolution first. A
            second resolution silently replacing the first would break the
            reversal chain C13 measures.

            `resolution_not_configured` — no approval policy or no archetype
            projection for this tenant (G3441); see `ResolutionNotConfigured`.
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }
        '422':
          description: |
            `disposition_not_offered`, `disposition_requires_adjustment`,
            `adjustment_currency_mismatch`, or `message_not_admitted`.
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }

  /proposals/{proposalId}:
    get:
      tags: [C10 Resolution]
      operationId: getProposal
      x-capability: view_exception
      x-partner-exposure: 'accepted: one proposal on a row the grant reaches'
      summary: A proposal, and exactly why it is or is not executable yet.
      description: |
        READ `execution.state` BEFORE ANYTHING ELSE. "Approved" and
        "executable" are different facts and this contract keeps them apart
        deliberately — see the state list on the `ProposalExecution` schema.
      parameters:
        - $ref: '#/components/parameters/ProposalId'
      responses:
        '200':
          description: The proposal with its approval and execution state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Proposal' }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ResolutionNotConfigured' }

  /proposals/{proposalId}/approvals:
    post:
      tags: [C10 Resolution]
      operationId: decideApproval
      x-capability: approve_resolution
      summary: Approve or reject. Rejection always carries a reason.
      description: |
        KEYED TO THE PROPOSAL, NOT THE EXCEPTION. `ApprovalConfig.quorum` and
        `segregationOfDuties` were unimplementable against an exception key:
        you cannot count distinct approvers of a thing, nor assert
        approver ≠ proposer, without knowing which proposal is being decided.

        APPROVING DOES NOT NECESSARILY MAKE IT EXECUTABLE. This is the case the
        contract exists to express. A `human` step may declare
        `secondApproverAbove: Money`, and `ApprovalConfig.quorum` may require
        more than one approver independently of that. An approval that
        satisfies neither leaves the proposal in
        `approved_pending_second_approver` — approved, recorded, signed, and
        still not executable. A client that treats HTTP 200 on this operation
        as "done" will show a green tick over an exception nobody has
        authorised to move money.

        SEGREGATION OF DUTIES IS ENFORCED HERE AND NOT ADVISED. Where
        `segregationOfDuties` is set, the proposer cannot be an approver, and
        an attempt returns `approval_segregation_violation`. The same person
        approving their own proposal is not a policy nuance; it is the control
        being absent.

        REJECTION REQUIRES A REASON, AND THAT IS CARRIED OVER FROM EXISTING
        BEHAVIOUR RATHER THAN INVENTED. A rejection without one tells the next
        reviewer nothing and the analyst who proposed it less.
      parameters:
        - $ref: '#/components/parameters/ProposalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approved, rejected]
                reason:
                  type: [string, 'null']
                  description: Required when `decision` is `rejected`.
      responses:
        '200':
          description: |
            Decided. The response is the whole proposal, so the caller sees the
            recomputed `execution.state` in the same round trip rather than
            assuming it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Proposal' }
        '403':
          description: |
            `policy_denied` — the caller's role is not in
            `ApprovalConfig.approverRoles`.
            `approval_segregation_violation` — the caller proposed this.
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `proposal_superseded` — a newer proposal exists on this exception,
            or this one was already rejected. Deciding a stale proposal would
            approve something nobody is looking at.

            `resolution_not_configured` — no approval policy or no archetype
            projection for this tenant (G3441); see `ResolutionNotConfigured`.
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }
        '422':
          description: '`approval_rejection_reason_required`.'
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }

  /proposals/{proposalId}/execution:
    post:
      tags: [C10 Resolution]
      operationId: executeProposal
      x-capability: execute_resolution
      summary: Execute an approved, executable proposal. Closes the exception.
      description: |
        SEPARATE FROM APPROVAL ON PURPOSE. Folding execution into the approval
        call would make the approved-but-not-executable state unrepresentable,
        and that state is the entire reason a money threshold exists.

        This is the same act C7 performs when a `terminate` step is reached; a
        procedure-driven exception normally never calls this directly. It
        exists for the `manual` resolution mode, where there is no harness, and
        it applies identical gates — one path, one set of checks.

        `execute_resolution` IS A DISTINCT AgentAction FROM
        `propose_resolution`, and the separation is the whole autonomy design:
        an agent may propose everywhere and execute only inside the ceiling.

        THE RESOLUTION RECORDS ITS AUTHORITY. When policy authorised an
        autonomous execution there is no ApprovalDecision, so nothing would
        carry a human name and the accountability chain would terminate at the
        agent — the authorless output that makes abdication easy. In that case
        `ExceptionResolution` records `authorisedByPolicyId` and
        `authorisedByPolicyVersion`, which moves the chain to the person who
        authored that policy, where it always belonged.

        A NON-TERMINAL DISPOSITION DOES NOT CLOSE THE EXCEPTION. It routes to
        another procedure. The response says which, rather than leaving a
        client to infer closure from a status it did not get.
      parameters:
        - $ref: '#/components/parameters/ProposalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: |
            Executed. Carries the resulting `ExceptionResolution` and, where
            the disposition is non-terminal, the procedure it routed to.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionResult' }
        '403':
          description: |
            `policy_denied` — this actor may not execute this disposition at
            this severity or value. Note that an irreversible disposition is
            never a candidate for autonomous execution however well it has
            behaved: good behaviour does not make an unrecoverable action safe.
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `proposal_not_executable` — THE CENTRAL CASE. The proposal is
            approved and the second approver required above the money threshold
            has not signed, or the quorum is unmet. The Problem's `detail`
            names what is outstanding; `execution.blockedBy` on the proposal is
            the machine-readable form.

            `exception_already_resolved`, `proposal_superseded` — the other two.

            `resolution_not_configured` — no approval policy or no archetype
            projection for this tenant (G3441); see `ResolutionNotConfigured`.
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }

  # ================================================================== C11
  /exports:
    post:
      tags: [C11 Reporting & BI]
      operationId: createExport
      x-capability: export_data
      summary: Produce a blob — and therefore incur a retention obligation.
      description: |
        AN EXPORT IS A NEW COPY OF CLASSIFIED DATA, AND THE MODEL TREATS IT AS
        ONE. This is why exports go through F8 rather than being streamed out
        of a query: the blob lands under the tenant prefix, its lifecycle is
        derived from `RetentionClass.export` rather than configured beside it,
        and every classified value inside it registers a SubjectLocation of
        kind `blob` at the moment of writing.

        SKIP THAT REGISTRATION AND ERASURE IS SILENTLY UNEXECUTABLE. A subject
        exercises their right, the erasure plan sweeps rows and traces, and a
        CSV sitting in a bucket still holds their identity number — and no
        query can find it, because you cannot retroactively discover which
        blobs held whose data. The `blob` variant of SubjectLocation was added
        on 5 Aug for exactly this: without it, exports and page renders were
        unreachable.

        The response therefore states the obligation the caller has just
        created. `retention.purgeAfter` is not advisory and not a suggestion to
        the client; it is the date the lifecycle rule will act on.

        POLICY GATES THIS BEFORE ANY BYTE IS WRITTEN. `DataEgressConfig`
        governs whether exporting is allowed at all (`allowExport`), which
        classes may never leave (`neverExport`), and where a destination may be
        (`allowedDestinations`).

        A KNOWN GAP, STATED RATHER THAN PAPERED OVER:
        `DataEgressConfig.requireApprovalToExport` is a boolean with no
        approval record anywhere in `model/`. There is no ExportApproval type,
        no approver field, and nothing to key a decision to. Rather than invent
        one here, this operation returns 403 `policy_requires_approval` when
        the flag is set. That is honest and it is not sufficient — an export
        approval flow needs a modelled decision record before this contract can
        offer one.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, format]
              properties:
                kind:
                  type: string
                  enum: [exception_queue, disposition_mix, run_history, audit_extract]
                  description: |
                    A closed set. An export kind is a shape whose classified
                    fields are known in advance, which is what makes the
                    SubjectLocation registration possible at all — an arbitrary
                    query export would have to classify its own output columns,
                    and would get it wrong once.
                format:
                  type: string
                  enum: [csv, xlsx, json]
                filter:
                  type: object
                  additionalProperties: true
                  description: |
                    The same filter vocabulary as the corresponding list
                    operation. An export of the queue is the queue.
                destination:
                  type: [string, 'null']
                  description: |
                    Null means download. A named destination is checked against
                    `DataEgressConfig.allowedDestinations`.
      responses:
        '202':
          description: |
            Accepted, and the retention obligation it created is stated back.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Export' }
        '403':
          description: |
            `export_forbidden_by_policy` — `allowExport` is false.
            `export_class_excluded` — the requested shape contains a class
            listed in `neverExport`. Refused whole rather than silently
            column-dropped: an export missing a column nobody was told about is
            a reconciliation nobody can reproduce.
            `export_destination_not_allowed`.
            `policy_requires_approval` — see the gap note above.
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }

  /exports/{exportId}:
    get:
      tags: [C11 Reporting & BI]
      operationId: getExport
      x-capability: export_data
      summary: Export status, and a short-lived download when ready.
      description: |
        THE DOWNLOAD URL IS SHORT-LIVED AND MUST NOT BE STORED. A presigned URL
        pasted into a ticket, a chat message or a bookmark is an unauthenticated
        copy of classified data with a longer life than anyone intended. Re-call
        this operation instead — and note that doing so writes a DataAccessEvent
        each time, which is the point: "who looked" is a question with an
        answer.

        `retention.purgedAt` becomes non-null when the lifecycle rule fires.
        The row survives as a tombstone so that "there was an export and it is
        gone" is distinguishable from "there was never an export".
      parameters:
        - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: The export.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Export' }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reports/disposition-mix:
    get:
      tags: [C11 Reporting & BI]
      operationId: getDispositionMix
      x-capability: view_dashboard
      x-partner-exposure: 'accepted: CONTESTED. Per-disposition counts and reversal rates are the customer own close quality. Under export_data a partner would get none of it; view_dashboard is the survey proposal and the exposure is taken knowingly'
      summary: What the closed disposition set buys. The report free text made impossible.
      description: |
        THIS REPORT IS THE ARGUMENT FOR THE CLOSED SET, MADE CONCRETE. Counting
        how a period's exceptions actually settled — short delivery versus
        price error versus duplicate — is a group-by over
        `ExceptionResolution.dispositionKey`. Over prose it is not a report at
        all.

        It carries `reversalRate` per disposition beside the count, because the
        two together are the honest picture: a disposition chosen four hundred
        times and reversed a third of the time was not the success its volume
        suggests. Only reversals where `reversalIndictsAutonomy()` holds are
        counted, for the same reason C13 counts them that way.

        Mode is broken out — autonomous, approved, manual — because the mix
        shifting toward autonomous is the outcome the product is for, and the
        mix shifting toward autonomous WHILE the reversal rate climbs is the
        outcome it must not produce quietly.
      parameters:
        - name: periodId
          in: query
          description: |
            G3624, 3 Oct 2026 — the period of the run that RAISED each settled
            exception (`Exception.runId` → `Run.periodId`). An exception whose
            run is not recorded belongs to no period and is outside the mix.
          schema: { type: string }
        - name: definitionId
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: The mix.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [rows]
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [dispositionKey, label, family, count, byMode, reversalRate]
                      properties:
                        dispositionKey: { type: string }
                        label: { type: string }
                        family: { type: string }
                        count: { type: integer }
                        byMode:
                          type: object
                          additionalProperties: false
                          required: [autonomous, approved, manual]
                          properties:
                            autonomous: { type: integer }
                            approved: { type: integer }
                            manual: { type: integer }
                        reversalRate:
                          type: number
                          description: |
                            0..1, counting only indicting reversals. Null-free:
                            a disposition with no resolutions does not appear.
                        valueAtRisk:
                          oneOf:
                            - $ref: '#/components/schemas/Money'
                            - type: 'null'
        '403': { $ref: '#/components/responses/Denied' }
        # ⛔ THE 422 THAT STOOD HERE IS DELETED — G3624, 3 Oct 2026. It was
        # G954's (20 Sep 2026): *"THE FILTER IS `periodId`. An `Exception`
        # carries no reconciliation period and nothing joins one to a `Run` …
        # The day an exception carries a period, this response is the thing to
        # delete."* `db/migrations/0480` gives an exception the run that raised
        # it (the owner's G3621), so `periodId` is APPLIED through that run's
        # period. Retrieve the removed text with
        # `git show a039fb76:docs/contracts/capability.openapi.yaml`.

  # ================================================================== C12
  /packs/installed:
    get:
      tags: [C12 Pack Install]
      operationId: listInstalledPacks
      x-capability: install_pack
      summary: What is installed, and what each installation minted.
      description: |
        A PACK IS A CONTROL-PLANE ASSET AND MAY NOT POINT AT TENANT ROWS.
        Installing MINTS tenant-scoped copies from templates, and `minted*Ids`
        records exactly which — the proof that a tenant's definitions are its
        own rather than shared references into a platform object. That
        distinction was got wrong once, with the platform Finance pack
        referencing a named customer's definition.

        `rolloutState` is where this tenant sits in the pack's current rollout,
        which is not the same as the pack's lifecycle state. A pack can be
        `active` fleet-wide while this tenant is still `pending`.
      responses:
        '200':
          description: Installed packs.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/InstalledPack' }
        '403': { $ref: '#/components/responses/Denied' }

  /packs/install:
    post:
      tags: [C12 Pack Install]
      operationId: installPack
      x-capability: install_pack
      summary: Verify the signature, then mint. Signature first, always.
      description: |
        THE SIGNATURE IS VERIFIED BEFORE ANYTHING IS MINTED, NOT AFTER. A pack
        carries a detached signature over its contents so a tenant can prove it
        is authentic and unmodified. Verifying after minting would mean an
        unsigned pack had already written definitions, procedures and document
        types into the tenant — and rolling those back is not the same as never
        having written them.

        This is what turns a quarter into a fortnight. It is also the operation
        that decides which dispositions exist for every exception this tenant
        will ever raise, which is why it is `tenant_admin` and not `operator`.

        The binding for an `evaluation` tenant falls back to the `production`
        binding, never to `sandbox` — falling back to sandbox would silently
        run a prospect's real data through a cheaper model with autonomy
        disabled, which is both the wrong behaviour and the wrong impression.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [packId, packVersion]
              properties:
                packId: { type: string }
                packVersion: { type: integer }
      responses:
        '201':
          description: Installed. `minted*Ids` names everything it created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstalledPack' }
        '403': { $ref: '#/components/responses/Denied' }
        '422':
          description: |
            `validation_failed` — signature verification failed, or the pack
            has no binding for this tenant's environment. Both are refusals to
            install, not warnings.
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }

  # ================================================================== C13
  /autonomy/recommendations:
    get:
      tags: [C13 Autonomy Advisor]
      operationId: listAutonomyRecommendations
      x-capability: set_autonomy
      summary: Recommendations awaiting a human decision.
      description: |
        RECOMMENDS, NEVER APPLIES. A system that silently widens its own
        autonomy is the failure the whole approval layer exists to prevent, and
        measurement would only be its disguise. Nothing in this service
        changes a ceiling; `POST .../decision` does, and a person makes it.
      parameters:
        - name: definitionId
          in: query
          schema: { type: string }
        - name: direction
          in: query
          schema:
            type: array
            items: { type: string, enum: [widen, narrow, unchanged] }
        - name: undecidedOnly
          in: query
          schema: { type: boolean, default: true }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Recommendations.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AutonomyRecommendation' }
                  nextCursor: { type: [string, 'null'] }
        '403': { $ref: '#/components/responses/Denied' }

  /autonomy/recommendations/{recommendationId}:
    get:
      tags: [C13 Autonomy Advisor]
      operationId: getAutonomyRecommendation
      x-capability: set_autonomy
      summary: The four dials, the window they were measured over, and the basis.
      description: |
        THE FOUR DIALS ARE NOT THE SAME KIND OF THING, WHICH IS WHY THIS IS A
        LOOP AND NOT A FORM:

          REVERSIBILITY   DECLARED on the Disposition. Unmeasurable by nature —
                          whether a credit note can be undone is a fact about
                          the customer's process, not about our telemetry.
          BLAST RADIUS    OBSERVED. Value at risk across the window.
          FREQUENCY       OBSERVED. Exception count across the window.
          VERIFIABILITY   INFERRED from outcomes — reversal rate, evidence
                          rate, and how long humans actually took.

        `medianDecisionSeconds` IS A WARNING, NOT A REASSURANCE. A median of
        four seconds across a queue means nobody opened the evidence — the
        green-checkmark failure, made measurable. `MIN_DECISION_SECONDS = 20`
        is the floor below which widening is refused regardless of how good
        the reversal rate looks, because a low reversal rate produced by
        nobody checking is not evidence of anything.

        `basis` IS A CLOSED VOCABULARY so the reason survives a restrictive
        SpanAttributePolicy and can be reported on across the fleet. A
        free-text justification would be stripped in exactly the deployments
        where fleet-wide analysis is hardest.

        The thresholds are STARTING POSITIONS, NOT SETTLED NUMBERS —
        `MIN_SAMPLE_TO_WIDEN = 200`, `MAX_REVERSAL_RATE_TO_WIDEN = 0.02`,
        `MIN_EVIDENCE_RATE_TO_WIDEN = 0.9`, `REVERSAL_RATE_TO_NARROW = 0.1`.
        They are returned in `thresholds` rather than compiled into a client,
        so a change is visible to the person deciding rather than a silent
        shift in what the screen recommends.
      parameters:
        - $ref: '#/components/parameters/RecommendationId'
      responses:
        '200':
          description: The recommendation, with its dials and its decision if taken.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutonomyRecommendation' }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }

  /autonomy/recommendations/{recommendationId}/decision:
    post:
      tags: [C13 Autonomy Advisor]
      operationId: decideAutonomyRecommendation
      x-capability: set_autonomy
      summary: Accept the recommendation, or override it with a reason.
      description: |
        THE ONLY OPERATION IN C13 THAT CHANGES ANYTHING, AND A HUMAN TAKES IT.

        `ceilingSet` is what is actually applied. On `accepted` it must equal
        `recommendedCeiling`; on `overridden` it may be anything and the reason
        becomes REQUIRED. That asymmetry is the design: agreeing with a
        measurement needs no explanation, disagreeing with one does — and the
        overrides are the more interesting data. A ceiling repeatedly widened
        past a `narrow` recommendation is a tenant heading somewhere the
        measurement says it should not, and that pattern is only visible
        because the reasons were captured.

        AN OVERRIDE THAT NARROWS IS ALWAYS PERMITTED. Nothing in this operation
        should make caution harder than expansion.

        A STALE RECOMMENDATION IS REFUSED. `recommendation_superseded` when a
        newer one exists for the same definition and disposition: the dials
        moved, and deciding on the old window applies a ceiling justified by
        numbers that are no longer true.
      parameters:
        - $ref: '#/components/parameters/RecommendationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [outcome, ceilingSet]
              properties:
                outcome:
                  type: string
                  enum: [accepted, overridden]
                ceilingSet:
                  $ref: '#/components/schemas/AutonomyCeiling'
                reason:
                  type: [string, 'null']
                  description: Required when `outcome` is `overridden`.
      responses:
        '200':
          description: |
            Decided and applied. The recommendation now carries its decision,
            and the ceiling is in force from `decidedAt`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutonomyRecommendation' }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `recommendation_superseded`, or the recommendation has already been
            decided — a decision is taken once.
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }
        '422':
          description: |
            `autonomy_override_reason_required`, or `validation_failed` when
            `outcome` is `accepted` and `ceilingSet` differs from
            `recommendedCeiling` — that is an override wearing an acceptance's
            name, and it would corrupt the override data the loop depends on.
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }

  /people/{userId}/role-assignments:
    post:
      tags: [C14 Authority]
      operationId: grantRoleAssignment
      x-capability: manage_roles
      summary: Confer a role on a person in this tenant.
      description: |
        THE ONLY OPERATION IN THIS DOCUMENT THAT CREATES AUTHORITY, AND IT IS
        THE ONE THE SCHEMA REFUSED TO ALLOW UNTIL THE HANDLER EXISTED.

        `db/migrations/0009_identity_substrate.sql` granted the app role
        `SELECT` and nothing else on `tenant.role_assignment`, and said why in
        capitals: "a request path that could write `role_assignment` could grant
        itself any capability in the closed set, and `decide()` would then
        permit it CORRECTLY." Two earlier slices designed the fence that makes a
        write safe and deliberately landed none of it, because a write privilege
        with no operation behind it is the shape `0004_subject_ledger.sql`
        refuses at length. The fence and this operation are one commit.

        NO ESCALATION, AND IT IS THE MODEL'S RULE RATHER THAN THIS ENDPOINT'S.
        `canGrant()` loops every capability the conferred role carries and
        refuses on the first one the granter does not already hold, at a scope
        no narrower. Conferring is therefore always a MOVE of authority and
        never a creation of it — which is also why the first holder of any
        capability in a tenant cannot arrive this way, by construction.

        NO SELF-GRANT. `granted_by` is derived from the session and appears
        nowhere in this request; the database compares it against this act's own
        authorisation record, so it cannot be supplied and cannot be forged.

        WHAT THIS DOES NOT DO, SAID HERE BECAUSE THE ABSENCES ARE DECISIONS.
        It does not author a role — composing capabilities into roles is
        `install_pack`, and a pack is a platform release. It does not revoke:
        no operation in this document removes an assignment, and the privilege
        to do so is deliberately withheld. It does not narrow —
        `AssignmentScope` has six dimensions and none of them has a column
        anywhere in this schema, so every assignment carries the deny-all scope
        that every assignment this database can produce already carries. And it
        cannot reach a person who is not already a live member of this tenant.

        THE TARGET MUST BE A CUSTOMER PRINCIPAL, derived from the directory that
        authenticates them and never from their membership. A partner-scoped
        person is refused: durable authority inside a customer's tenant is not
        something a partner may hold, and a membership proves nothing about
        organisation.

        ON THE 403. It is returned for every refusal — a granter who lacks the
        verb, a self-grant, an organisation that may not hold or confer — with
        one constant sentence and no reason on the wire. A refusal naming the
        capability the granter lacks would turn this endpoint into a roster
        oracle for their own authority: try each role in turn and the refusals
        enumerate exactly what they hold. The reason is written to the operator
        log, which is the one reader entitled to it.

        ON THE 404. A person who does not exist, a person in another tenant and
        a person whose membership has lapsed are one answer, for the reason
        `resource_not_found` already gives elsewhere in this document.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [roleId, expiresAt]
              properties:
                roleId:
                  type: string
                  description: |
                    A role already defined in this tenant. It is not created
                    here and its capabilities are not sent here — they are read
                    from the role, so a caller cannot describe a role as
                    narrower than it is.
                expiresAt:
                  type: [string, 'null']
                  format: date-time
                  description: |
                    REQUIRED AND NULLABLE, so that an indefinite assignment is a
                    decision somebody typed rather than a field somebody
                    omitted. Null means indefinite, which only a customer
                    principal may hold.
      responses:
        '201':
          description: |
            Conferred. The assignment is live from `grantedAt` and is pinned to
            the role version read in the same transaction.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleAssignmentRecord' }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ================================================================== C15
  /endpoints/{endpointId}/credential:
    put:
      tags: [C15 Source Credentials]
      operationId: bindEndpointCredential
      x-capability: bind_secret
      summary: Bind (or rotate) the credential an endpoint pulls with.
      description: |
        G2401, THE OWNER'S RULING OF 1 Oct 2026: *"Source credential custody:
        Secrets Manager, one secret per source, encrypted with the tenant's
        per-tenant KMS key (Storage's key factory); only a credentialRef lives
        in Postgres; the FDE binds a credential via a write path under G75's
        secret reach."*

        THE VALUE GOES IN AND NOTHING COMES OUT. The response carries no
        secret, no secret name and no reference, and there is no operation on
        any tier that reads a credential back — the reader of a credential is
        the connector that pulls a source, and it is not built. A second bind
        to the same endpoint ROTATES the value under the same reference; it
        cannot move the credential to another key.

        `bind_secret` is the one capability of class `secret`, and its
        authorisation lives for at most `MAX_AUTHORIZATION_SECONDS.secret` —
        sixty seconds — because binding a credential is ONE act.

        ⚠️ THE TENANT IS NEVER READ FROM THIS REQUEST (invariant 1). The body
        admits exactly one property; a `tenantId`, a secret name or a key in it
        is a 400, not an ignored field.

        ⚠️ A REFUSAL AFTER THE GATE IS A 500 `upstream_unavailable` AND MEANS
        NOTHING WAS RECORDED AS BOUND — including when the tenant has no key
        yet. A credential is never stored under any key but the tenant's.

        ✅ THE FDE TAKES THIS PATH SINCE 1 Oct 2026 (G2591, applying G2407,
        THE OWNER'S RULING): `decide()`'s platform arm honours a LIVE
        `TenantAccessGrant` whose classes include `secret`, and the act's
        record names the grant. A customer principal holding `bind_secret`
        still can too. This sentence read "THE FDE CANNOT TAKE THIS PATH YET"
        and is corrected rather than deleted.
      parameters:
        - name: endpointId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [secretValue]
              properties:
                secretValue:
                  type: string
                  minLength: 1
                  maxLength: 65536
                  description: |
                    The credential, as the source expects it — a password, a
                    key, a token or a JSON document of them. Secrets Manager's
                    own ceiling is 65,536 bytes. Never logged, never echoed,
                    never stored in the database.
      responses:
        '200':
          description: |
            Bound. The credential is stored under this tenant's key and the
            endpoint now references it.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [endpointId, boundAt, rotated]
                properties:
                  endpointId: { type: string }
                  boundAt: { type: string, format: date-time }
                  rotated:
                    type: boolean
                    description: |
                      True when this bind replaced a credential the endpoint
                      already referenced.
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ================================================================== C9
  /endpoints:
    get:
      tags: [C9 Sources]
      operationId: listEndpoints
      x-capability: view_endpoint
      x-partner-exposure: 'accepted: G209 ruling 2 put view_endpoint in both partner operating scopes — a partner triaging a break must see where the data comes from, and nothing here reaches a credential'
      summary: Every declared source, where it is, and what it is doing.
      description: |
        C9 rows 1, 3, 6, 11, 20 and 24. G2681–G2690, 1 Oct 2026.

        `state` IS DERIVED AND NEVER STORED. The pack: *"A declared source
        reads waiting on a credential and stays there; the product learns it
        is done by the source delivering, not by being told."* It is read off
        three facts — the lane's switch, the credential binding and whether
        anything has ever arrived on the lane — in that order, by
        `sourceState()` in `model/connectors.ts`.

        ⚠️ `waiting_on_first_delivery` IS NOT A STATE THE PACK DRAWS. Under
        G2401 we hold the credential, so a bound one is observable; folding it
        back into `waiting_on_credential` would tell a person who has just
        bound one that they have not (G2688).

        NOTHING HERE IS A CREDENTIAL. `credentialBoundAt` is when one was
        bound; what it is, and where it is stored, is never published.
      responses:
        '200':
          description: The tenant's sources, oldest declaration first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [endpoints]
                properties:
                  endpoints:
                    type: array
                    items: { $ref: '#/components/schemas/SourceEndpoint' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Denied' }
    post:
      tags: [C9 Sources]
      operationId: declareEndpoint
      x-capability: configure_endpoint
      summary: Declare a source — an SFTP drop or an S3 drop — and open its lane.
      description: |
        C9 row 1's declaration half and row 3's SFTP and S3 halves. G2681.

        THE DECLARATION CARRIES NO CREDENTIAL AND CANNOT. The body admits a
        label and a connection; a `credentialRef`, a secret or a `tenantId`
        is a 400 (ajv rejects rather than strips, G191). The credential is
        bound afterwards by `bindEndpointCredential`, through custody, under
        the tenant's key — the database refuses this operation the binding
        columns outright (`0340` §6).

        THE S3 EXTERNAL ID IS MINTED HERE AND PUBLISHED BACK (G2685). It goes
        in the customer's trust policy; a caller who could choose it could
        copy another tenant's and name that tenant's role.

        A HOST THAT IS LOOPBACK, PRIVATE, LINK-LOCAL OR OTHERWISE RESERVED IS
        REFUSED (G2686). ⚠️ That is the cheap half: a public name can resolve
        to a reserved address, and only a connector at connect time can see
        it. No connector exists.

        NOTHING IS TESTED. Row 2, *"Test before declare"*, needs an outbound
        connection from a request path, which no ruling permits (G2151). A
        declaration states WHERE; it is never a claim that it works.

        The source's `watched_drop` lane is opened in the same transaction, so
        no committed instant holds a source with no lane.

        Email and SAP are not offered: R16 refused both (1 Oct 2026).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [label, connection]
              properties:
                label: { type: string, minLength: 1, maxLength: 200 }
                connection:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      required: [kind, host, port, path, hostKeyFingerprint]
                      properties:
                        kind: { type: string, enum: [sftp] }
                        host: { type: string, minLength: 1, maxLength: 253 }
                        port: { type: integer, minimum: 1, maximum: 65535 }
                        path: { type: string, minLength: 1, maxLength: 1024 }
                        hostKeyFingerprint:
                          type: string
                          maxLength: 64
                          description: |
                            The PINNED host key, as OpenSSH prints it —
                            `SHA256:` and 43 base64 characters. Required:
                            trust-on-first-use accepts an attacker's key with
                            nobody asked.
                    - type: object
                      additionalProperties: false
                      required: [kind, bucket, keyPrefix, region, roleArn]
                      properties:
                        kind: { type: string, enum: [s3] }
                        bucket: { type: string, minLength: 3, maxLength: 63 }
                        keyPrefix: { type: string, maxLength: 1024 }
                        region: { type: string, maxLength: 32 }
                        roleArn: { type: string, maxLength: 600 }
      responses:
        '201':
          description: |
            Declared. The source reads `waiting_on_credential` until a
            credential is bound.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceEndpoint' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Denied' }
        '422':
          description: |
            `validation_failed` — the connection is not one this product will
            record: an empty label, a host that is not a host name or names a
            reserved address, a port out of range, a relative or traversing
            path, an unpinned host key, or an invalid bucket, prefix, region or
            role ARN. The refusal's kind is in `detail`; it is the caller's own
            input and discloses nothing else.
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }

  /endpoints/{endpointId}/stop:
    post:
      tags: [C9 Sources]
      operationId: stopEndpoint
      x-capability: configure_endpoint
      summary: Stop a source — dated, reversible, and the deliveries stay.
      description: |
        C9 rows 20 and 35. G2684.

        Row 35: *"Disable is dated and reversible, and the deliveries stay
        where they are."* The stop is an APPEND-ONLY event and the source's
        lane is switched off in the same transaction, so the arrival cascade
        refuses everything on it (`channel_disabled`). Nothing is deleted:
        *"A source that has delivered cannot be removed"* — and no operation
        on any tier removes one.

        Stopping a stopped source is a no-op that answers its current state;
        the date of the FIRST stop stands.

        ⚠️ REBINDING IS NOT BUILT (G2689). Row 35's *"the binding history keeps
        both, and a period spanning the change states which binding read it"*
        needs a reader of a binding, and the connector that would read one is
        not built. A source's configuration cannot be edited at all.
      parameters:
        - name: endpointId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The source, now stopped.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceEndpoint' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }

  /endpoints/{endpointId}/resume:
    post:
      tags: [C9 Sources]
      operationId: resumeEndpoint
      x-capability: configure_endpoint
      summary: Resume a stopped source. The stop's date is kept.
      description: |
        C9 row 35's *reversible*. G2684. Appends a `resumed` event and switches
        the lane back on; the earlier `stopped` event is untouched, so when the
        source was stopped stays answerable. Resuming a running source is a
        no-op that answers its current state.
      parameters:
        - name: endpointId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The source, running again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceEndpoint' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }

  /endpoints/{endpointId}/document-types:
    post:
      tags: [C9 Sources]
      operationId: declareEndpointDocumentType
      x-capability: configure_endpoint
      summary: Pair a pattern within a source with one document type, and map its fields.
      description: |
        C9 rows 6, 11 and 14. G2687, G2690.

        Row 6: *"The type is not a property of the source … The identifier is
        the pair — this source, and a pattern within it … each pair naming one
        type."* Row 14: *"Required before extraction, so an incomplete mapping
        refuses the declaration."*

        THE PATTERN IS A LITERAL. `path_prefix` or an exact `filename`,
        compared byte for byte; nothing is compiled (G130, G206).

        THE MAPPING MUST COVER EVERY FIELD THE TYPE DECLARES AND NAME NO FIELD
        IT DOES NOT. It maps the source's own column names onto the type's
        declared fields and never declares one — a classification is the
        type's, not the source's (invariant 4).

        THERE IS NO FIDELITY HERE AND THAT IS ROW 11. Whether a type reads OCR
        is the type's declaration; every pair to it inherits it and cannot
        override it.

        DECLARING A PAIR DRAINS WHAT IS PARKED AGAINST IT — row 16, G2835. In
        the same transaction and under the same authorisation record, every
        parked artefact on this source whose name now falls under exactly
        this pair's pattern, and whose type extracts, is mapped into the
        type's shape and stored as a document; the drain is recorded per
        artefact and its held copy deleted. `drain` in the answer counts both
        halves. ⚠️ THIS PARAGRAPH READ *"NOTHING EXTRACTS BECAUSE OF THIS …
        an `Arrival` carries no filename to match (`0012` §3 refuses the
        column by name), and `ArrivalVerdict` has no parked state (G2692)"*,
        and is corrected rather than deleted: the owner ruled G2692 on
        2 Oct 2026 (`0380`). ⚠️ THE METER DOES NOT MOVE (G2837): row 16's
        *"it counts, the meter moves"* is half true — the drain is counted
        (`listParkedArrivals`) and no usage record is written, because
        nothing allocates a usage sequence.

        A parked artefact holding a subject-class value this plane cannot
        register refuses the pair (422, `parked_artefact_subject_not_digestible`)
        and nothing is written but the act's record: G295 forbids storing a
        subject without its registered location.
      parameters:
        - name: endpointId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [match, documentTypeId, fieldMappings]
              properties:
                match:
                  type: object
                  additionalProperties: false
                  required: [kind, value]
                  properties:
                    kind: { type: string, enum: [path_prefix, filename] }
                    value: { type: string, minLength: 1, maxLength: 255 }
                documentTypeId: { type: string, minLength: 1, maxLength: 200 }
                fieldMappings:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    additionalProperties: false
                    required: [sourceField, fieldPathKey]
                    properties:
                      sourceField: { type: string, minLength: 1, maxLength: 255 }
                      fieldPathKey: { type: string, minLength: 1, maxLength: 1024 }
      responses:
        '201':
          description: |
            Paired. The mapping is complete by construction, and `drain` says
            what the declaration extracted from the parked pile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeclaredSourceDocumentTypePair' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: |
            `document_type_unknown` — no such type in this tenant.
            `validation_failed` — the pattern is invalid or already paired on
            this source, the type declares no field, or the mapping is
            incomplete, repeats a field, or names one the type does not
            declare; or a parked artefact the pair would drain holds a
            subject this plane cannot register. The refusal's kind is in
            `detail`.
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }

  /document-types:
    get:
      tags: [C9 Sources]
      operationId: listDocumentTypes
      x-capability: view_endpoint
      x-partner-exposure: 'accepted: G209 ruling 2 put view_endpoint in both partner operating scopes — a document type''s label is the pack''s own name for a shape, not tenant data, and a partner triaging a parked delivery must see the same names the customer does'
      summary: Every document type this tenant has, by name — the pick list for pairing a source and for raising a parked delivery.
      description: |
        C3-15 of the round-three UI audit. G3941–G3943, 4 Oct 2026.

        ONE LIST AND NOT A LABEL ON THREE READS (G3942). The pairing form must
        offer every type the tenant has, including one no source is paired to
        yet, which no label riding on `listEndpoints` could supply. A client
        joins `documentTypeId` on the other reads to `label` here.

        THE LABEL IS THE PACK'S OWN NAME FOR THE TYPE (`0180` §1), published
        verbatim and interpreted by nothing; a client renders it as text. An
        empty label is published as empty — this plane authors no name.

        `view_endpoint`, because every surface that needs the name is a place
        a type is CHOSEN for a source. Nothing here is a field, a value or a
        document.
      responses:
        '200':
          description: The tenant's document types, by label.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [documentTypes]
                properties:
                  documentTypes:
                    type: array
                    items: { $ref: '#/components/schemas/DocumentTypeChoice' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Denied' }
  /parked:
    get:
      tags: [C9 Sources]
      operationId: listParkedArrivals
      x-capability: view_exception
      x-partner-exposure: 'accepted: a partner operating exceptions must see why a period cannot close, and a parked delivery is that reason; no value from a held artefact is published'
      summary: The parked pile — deliveries no declared pair claims, counted apart from exceptions.
      description: |
        C9 rows 7, 13 and 18. G2831–G2840, applying G2692 (THE OWNER'S RULING,
        2 Oct 2026).

        Row 7: *"Parked as unclassified, never guessed into the nearest type.
        A document that arrived before its type was declared parks in the same
        bucket — one state, not two."* Row 18: *"The register names them as
        awaiting setup with the person who unblocks it named … and counted
        apart from exceptions so the denominator stays honest."*

        ITS OWN OPERATION AND ITS OWN COUNT. Nothing here reads or writes an
        exception, so a parked delivery cannot move the register's
        denominator.

        `parkedBecause` IS DERIVED AND NEVER STORED. It is the same decision
        that parked the artefact, asked again against the pairs declared now
        — so declaring a pair changes it without anything being rewritten.

        `drains` is row 16's *"the register states why rather than leaving an
        unexplained jump"*: every pair declaration that extracted parked
        artefacts, with how many.

        ⚠️ `unblockedBy` NAMES A CAPABILITY AND NOT A PERSON (G2840). Naming a
        person is a read of the administrative directory, which this
        operation does not hold.

        `filename` IS THE SOURCE'S OWN NAME, VERBATIM. It is data: render it
        as text, never as markup and never as a link target.
      responses:
        '200':
          description: Every parked, undrained delivery visible to this session, oldest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [awaitingSetup, items, drains]
                properties:
                  awaitingSetup:
                    type: object
                    additionalProperties: false
                    required: [parked, raisedWithFde]
                    properties:
                      parked: { type: integer, minimum: 0 }
                      raisedWithFde:
                        type: integer
                        minimum: 0
                        description: Row 13's *"the pending pair counted separately"*.
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ParkedArrival' }
                  drains:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [pairId, endpointId, documentTypeId, drained, lastDrainedAt, because]
                      properties:
                        pairId: { type: string }
                        endpointId: { type: string }
                        documentTypeId: { type: string }
                        drained: { type: integer, minimum: 1 }
                        lastDrainedAt: { type: string, format: date-time }
                        because: { type: string, enum: [pair_declared] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Denied' }

  /parked/{arrivalId}:
    get:
      tags: [C9 Sources]
      operationId: getParkedArrival
      x-capability: view_exception
      x-partner-exposure: 'accepted: the pane the register line links to; a partner who may read the line may follow it, and the pane publishes the sample shape and never a value'
      summary: One parked delivery — the sample, why it is parked, and who unblocks it.
      description: |
        C9 rows 9 and 19. G2831–G2840.

        Row 19: *"An user who cannot act still follows it, and lands on one
        pane about that pair only — the sample, why it is parked, and who
        unblocks it. Not a read-only copy of Setup, and never a dead
        sentence."* Row 9: *"Held unextracted, and it is what the admin
        declares the pair against."*

        THE SAMPLE IS ITS SHAPE, NEVER ITS VALUES. A held artefact has no
        document type, so no declared field addresses any position in it, and
        G106 makes every unaddressed value UNREADABLE. `sample.fields` is the
        record's top-level keys, sorted — what a person needs to write a
        field mapping.

        A delivery that is no longer parked — drained, or never parked — is a
        404, because the line that linked here no longer exists.
      parameters:
        - name: arrivalId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The parked delivery's pane.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParkedArrivalPane' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }

  /parked/{arrivalId}/escalation:
    post:
      tags: [C9 Sources]
      operationId: raiseParkedArrival
      x-capability: configure_endpoint
      summary: Raise a parked delivery with the FDE, naming the document type it should be.
      description: |
        C9 row 13. G2839.

        *"A control on this pane, carrying the pack, the type and the sample.
        The pair stays parked pending, and the source's other pairs are
        unaffected."* It carries the SAMPLE (this delivery) and the TYPE. ⚠️
        IT DOES NOT CARRY THE PACK: no document type in this product records
        which pack it came from, and the writer that would (`installPack`) is
        not mounted.

        The delivery stays parked; raising it extracts nothing. Raising the
        same delivery again answers the first raise with a 200 and writes
        nothing.
      parameters:
        - name: arrivalId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [documentTypeId]
              properties:
                documentTypeId: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: Already raised. The FIRST raise, unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParkedEscalation' }
        '201':
          description: Raised.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParkedEscalation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: '`document_type_unknown` — no such type in this tenant.'
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }

components:

  securitySchemes:
    sessionContext:
      type: apiKey
      in: cookie
      name: __Host-reconcile_session
      description: |
        THE SESSION HANDLE, AS AN `HttpOnly` COOKIE — G386, 19 Sep 2026.

        ⚠️ THIS SCHEME READ `in: header` / `name: X-Session` UNTIL THAT RULING
        AND IS CORRECTED RATHER THAN DUPLICATED, because a second scheme would
        leave four tiers declaring two credentials for one session and every
        `security:` list in this file would have to choose between them.

        The ruling: *"`Set-Cookie`, `HttpOnly` `Secure` `SameSite=Lax`, on the
        tenant host, in production. Page script cannot read it, so the
        exfiltration class `frontend/src/api/plane.ts`'s origin allowlist
        exists to guard STOPS BEING POSSIBLE rather than being blocked."*

        🛑 `X-Session` IS NOT DECLARED ANYWHERE ANY MORE AND THAT IS
        DELIBERATE. It survives in exactly one place —
        `server/dev/session-header.ts` — reachable only through a dynamic
        import that runs when `RECONCILE_LOCAL_TEST_AUTH` is exactly `1`, so a
        deployed plane holds no code that reads it. **A local-only channel
        behind a flag is not part of the contract**; declaring it here would
        publish a second way in and invite a client to use it. G192's own
        argument, one channel over.

        ⚠️ AND CSRF IS NOW A LIVE CONCERN THE HEADER DESIGN DID NOT HAVE. A
        custom header is never attached by a cross-site form; a cookie is
        attached by the browser. `SameSite=Lax` keeps it off every cross-site
        `POST`, `PUT`, `PATCH` and `DELETE` — which is every state-changing
        operation served today — and it is **not** a complete answer: a
        state-changing `GET` reached by a top-level navigation would carry it,
        and there is none only because nobody has written one.
        `server/data-plane/session-cookie.ts` states the bound precisely. No
        `csrfToken` is declared here, and minting one is a ruling.

        ⚠️ THE CONTROL-PLANE TIER IS UNCHANGED AND STILL CARRIES A HEADER. That
        is not an oversight: its credential is a machine channel secret read
        from `RECONCILE_CONTROL_*`, not a person's session, and no browser is
        involved. Two different credentials that happened to share a header
        name now differ in the contract as they always differed in fact.
  parameters:
    UploadId:
      name: uploadId
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string }
    ExceptionId:
      name: exceptionId
      in: path
      required: true
      schema: { type: string }
    ThreadId:
      name: threadId
      in: path
      required: true
      schema: { type: string }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string }
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema: { type: string }
    ExportId:
      name: exportId
      in: path
      required: true
      schema: { type: string }
    RecommendationId:
      name: recommendationId
      in: path
      required: true
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      description: |
        Opaque, and opaque on purpose. A cursor a client can construct is a
        cursor a client can point at another tenant's ordering key.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Client-supplied, for operations where a retry after a timeout would
        otherwise double-send or double-propose. Deliberately NOT present on
        run admission, where the key is computed by the server from the period,
        the definition and the slot-fill state — a client-varied key there
        would defeat the deduplication rather than support it.
      schema: { type: string }

  responses:
    Unauthenticated:
      description: No valid session.
      content:
        application/problem+json:
          schema: { $ref: './errors.yaml#/components/schemas/Problem' }
    Denied:
      description: Authenticated, and not permitted.
      content:
        application/problem+json:
          schema: { $ref: './errors.yaml#/components/schemas/Problem' }
    NotFound:
      description: |
        `resource_not_found`. Returned identically for a row that does not
        exist and for a row in another tenant — distinguishing them would make
        this endpoint an existence oracle across the tenant boundary.
      content:
        application/problem+json:
          schema: { $ref: './errors.yaml#/components/schemas/Problem' }
    IdempotencyConflict:
      description: Same key, different payload.
      content:
        application/problem+json:
          schema: { $ref: './errors.yaml#/components/schemas/Problem' }

    ResolutionNotConfigured:
      description: |
        `resolution_not_configured` — G3441, 3 Oct 2026. The tenant has no
        approval policy (`ApprovalConfig`), or this exception's definition has
        no archetype projection, so neither the offered set nor an approval
        gate can be evaluated. A 409 and not a 500: it is a fact about how this
        tenant is set up, it is the same on every retry, and a client must not
        offer a retry for it. FAIL-CLOSED — the chain never defaults to the
        weakest gate (quorum 1, no floor, no segregation).
      content:
        application/problem+json:
          schema: { $ref: './errors.yaml#/components/schemas/Problem' }

  schemas:

    # ---------------------------------------------------------- errors



    # ---------------------------------------------------------- field paths
    #
    # 🛑 THE CANONICAL DECLARATION IS `foundation.openapi.yaml`. THESE THREE ARE A
    # STRUCTURAL COPY, AND THE DUPLICATION IS A COST RATHER THAN A LICENCE.
    #
    # G244 asked for one declaration `$ref`d across tiers — the shape `Meter` uses
    # from this file's sibling. THAT IS NOT AVAILABLE TO THIS TIER TODAY.
    # `server/contract/bundle.ts` throws `ExternalRefError` on any cross-file
    # `$ref`, deliberately: silently dropping one would produce a schema that
    # validates LESS than the contract says. `OutboundDraft.includeFields` below is
    # reachable from the request bodies of `checkOutboundDisclosure` and
    # `sendOutboundMessage`, so a `./foundation…` pointer there makes both
    # operations unmountable — a boot failure waiting for whoever mounts them,
    # which `tests/contracts/request-body-schema.test.ts` catches.
    #
    # ⚠️ THE ARGUMENT IS NOT RESTATED HERE. Read
    # `foundation.openapi.yaml#/components/schemas/FieldPath` for why a token list
    # rather than a dotted string, why JSON Pointer was refused, and why G243
    # refused a wildcard. `tests/contracts/field-path-wire.test.ts` §3 asserts the
    # two copies are structurally identical, so this cannot drift quietly — CHANGE
    # BOTH OR NEITHER. When the bundler learns to resolve a cross-file pointer,
    # these three collapse to a `$ref` and that assertion changes with them.

    FieldSegment:
      description: |
        ONE STEP of a `FieldPath`. Structural copy of
        `foundation.openapi.yaml#/components/schemas/FieldSegment` — see the note
        above. `{"kind":"key","key":"0"}` addresses the string property `"0"`;
        `{"kind":"index","index":0}` addresses the first element of an array.
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, key]
          properties:
            kind: { type: string, enum: [key] }
            key:
              type: string
              description: |
                One own-property of a JSON object, matched by EXACT BYTES.
        - type: object
          additionalProperties: false
          required: [kind, index]
          properties:
            kind: { type: string, enum: [index] }
            index:
              type: integer
              minimum: 0
              description: |
                One element of a JSON array, by ZERO-BASED position.
      discriminator:
        propertyName: kind

    FieldPath:
      type: array
      minItems: 1
      items: { $ref: '#/components/schemas/FieldSegment' }
      description: |
        A NON-EMPTY, ORDERED list of segments addressing EXACTLY ONE position in a
        document. Mirrors `FieldPath` in `model/kernel.ts`; structural copy of
        `foundation.openapi.yaml#/components/schemas/FieldPath` — see the note
        above, and read the argument there rather than here.

        🛑 NO WILDCARD, NO SLICE, NO FILTER, NO DESCENT — G243. Do not add `[]`,
        `each` or `*`: a `FieldSpec` must name ONE field, because G222 rules an
        outbound `DataClass` is the MAXIMUM over the `FieldSpec` classes carried.

    FieldPathKey:
      type: string
      description: |
        A `FieldPath` collapsed to its one-way identity token, used where a path
        has to be a JSON object's PROPERTY NAME and an array therefore cannot be.
        Structural copy of `foundation.openapi.yaml#/components/schemas/FieldPathKey`
        — see the note above.

        🛑 NOT A GRAMMAR, AND MUST NOT BE PARSED. There is no inverse anywhere in
        this repository. A reader that needs to know which entry is which computes
        the token FORWARD from the `FieldSpec` paths it holds.

    # ---------------------------------------------------------- primitives

    DomainKey:
      type: string
      enum: [finance, kyc, credit_underwriting, medical_records]

    # RoleKey — DELETED 7 Aug 2026, with `ROLE_KEYS` in model/domain.ts.
    #
    #   RoleKey: { type: string, enum: [viewer, operator, approver, tenant_admin, partner_admin] }
    #
    # It was not a primitive. It was a five-member enum doing two jobs — a
    # stakeholder's relationship to the work, and a capability — with a third
    # hiding in `partner_admin`, an ORGANISATION baked into a role name. The
    # concrete cost on this wire: a bare `'approver'` is satisfied by any pack's
    # role keyed `approver`, and role identity is `(packId, key)`, so a KYC
    # reviewer approving an AP write-off was one string comparison away.
    #
    # Its two referents in THIS file migrated apart, because they asked
    # different questions:
    #   - `NodeAwaitingHuman.role`         -> `requires: CapabilityRequirement`
    #   - `decidableBy.minimumRoleToAdmit` -> `capabilityToAdmit`
    # The third, `resolveMembership.role`, became `roleId` in
    # foundation.openapi.yaml.
    #
    # Do not reintroduce it as a convenience enum for a picker. Composed roles
    # are per tenant and per pack; a role list is a query, not a constant.

    CapabilityRequirement:
      type: object
      description: |
        Mirrors `CapabilityRequirement` in `model/access.ts`. What a step or an
        approval policy asks for — never who holds it.

        `capability` is a bare string here rather than enumerated: not one of the
        thirty-six capabilities appears in any contract file yet, and
        enumerating them in this one document would create a second, partial
        copy of a closed set that the administration tier is going to have to
        publish properly. Defined locally rather than $ref'd across files, per
        the convention in `README.md`.
      additionalProperties: false
      required: [capability, distinctHolders, appliesAtOrAboveValue]
      properties:
        capability: { type: string }
        distinctHolders:
          type: integer
          minimum: 1
          description: |
            Above one, they must be different PEOPLE — four-eyes means two
            names, and stating it here is what stops a second signature being
            the first person signing twice.
        appliesAtOrAboveValue:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: |
            The requirement only binds at or above this value. Null = always.

    Severity:
      type: string
      enum: [critical, high, medium, low]

    AutonomyCeiling:
      type: string
      description: |
        `Severity | 'none'`. The ladder is none → low → medium → high →
        critical, and widening moves right.
      enum: [none, low, medium, high, critical]

    DataClass:
      type: string
      enum: [public, internal, personal, sensitive_personal]

    ExceptionStatus:
      type: string
      enum:
        - open
        - investigating
        - resolution_proposed
        - pending_approval
        - resolved
        - rejected
        - dismissed

    FindingStanding:
      type: string
      description: |
        G74'S REGISTER VOCABULARY. The five words the State column may show, and
        the reason it is not `ExceptionStatus` directly above is structural
        rather than a matter of taste: THE REGISTER'S ROWS ARE NOT ONE TYPE. One
        row is a `MatchGroup` whose outcome is `matched`, another is a
        `SourceDocument` under a `FieldSpec.confidenceFloor`, and only SOME rows
        are an `Exception`. Every one of `ExceptionStatus`'s seven members is
        about an `Exception`, so it cannot carry the other two row kinds and a
        re-key is lossy in both directions.

        🛑 DERIVED, NEVER STORED. No row on this contract and no interface in
        `model/` carries a standing as a column — G74 records that a stored copy
        "diverged within hours every previous time". A consumer computes it from
        the facts it already holds; the model's `standingFor(FindingBasis)`
        (`model/domain.ts`) is the reference derivation, and
        `tests/model/finding-standing.test.ts` asserts on every
        `npm run check` that no `model/*.ts` interface declares the column.

        🛑 EVERY TERM IS A WORD, AND NO STANDING DEPENDS ON HUE. A renderer that
        distinguishes these five by colour alone has published four of them to
        nobody. `design/system/index.html`'s "Grammar three" already carries
        `Needs authority ›` as word-plus-chevron for this reason.

        ✅ PINNED BY THE `finding_standings` WIRE-MIRROR PAIR, so this enum is
        compared against `FINDING_STANDINGS` in `model/domain.ts`
        ELEMENT-FOR-ELEMENT, IN ORDER, on every `npm run check`. The order is
        load-bearing and is not alphabetical: it is the model's declaration
        order, which is what a sort control mirrors.

        ⚠️ NO OPERATION REFERENCES THIS SCHEMA YET, AND THAT IS DELIBERATE
        RATHER THAN AN OVERSIGHT. G200 holds that no operation may be mounted;
        served is 4 of 72 and this commit moves neither number. What #211's
        State-column sort control was blocked on was a DECLARED vocabulary with
        an order behind it — that is what this is. Attaching it to a register
        row is #211's commit, not this one.
      enum:
        - closed
        - needs_authority
        - no_recourse
        - below_floor
        - waiting

    ReconciliationArchetype:
      type: string
      description: |
        A CLOSED SET. It determines which config shape is legal, which
        predicates apply and which disposition families exist. A pack
        parameterises within it and can never extend it — adding an archetype
        is a platform release, not a configuration change.
        `balance_rollforward` is modelled and not built.
      enum:
        - n_way_document_match
        - attribute_verification
        - set_reconciliation
        - existence_completeness
        - balance_rollforward

    Money:
      type: object
      description: |
        ISO-4217, EXACT INTEGER MINOR UNITS. Never a float, never a bare number.
        `currency` appeared exactly once in the whole model before this was
        fixed, and a USD invoice against an SGD purchase order reported a 35%
        critical variance on a correct invoice.

        🛑 `amountMinor` IS A DECIMAL STRING AND WAS `{ type: integer }` UNTIL
        19 Sep 2026 — G286 applying G65, and it is BREAKING ON THE WIRE. The
        model type is `bigint`; JSON has no bigint, and a JSON NUMBER would be
        read back by every consumer as an IEEE-754 double and silently lose
        exactness above 2^53 minor units — which is the exact ceiling the ruling
        was taken to raise. Emitting an integer would have raised the ceiling in
        the model and left it in place here.

        ⚠️ A CONSUMER THAT CALLS `Number()` ON THIS STRING IS BACK AT 2^53 AND
        HAS LOST THE GUARANTEE. Parse it as an arbitrary-precision integer, or
        keep it as a string. `model/money.ts` is the only thing in this
        repository permitted to convert in either direction — G111.

        ⚠️ `exponent` STAYS A JSON NUMBER. It is a power of ten in single
        digits, not an amount.
      additionalProperties: false
      required: [currency, amountMinor, exponent]
      properties:
        currency: { type: string, description: "ISO 4217, e.g. 'SGD'." }
        amountMinor: { type: string, pattern: '^-?[0-9]+$' }
        exponent:
          type: integer
          description: Minor units per major unit as a power of ten. 2 for SGD, 0 for JPY.

    FacetCount:
      type: object
      additionalProperties: false
      required: [value, label, count]
      properties:
        value: { type: string }
        label: { type: string }
        count: { type: integer }

    Provenance:
      type: object
      description: Renders as a highlight over the source page.
      additionalProperties: false
      required: [page, boundingBox, confidence]
      properties:
        page: { type: [integer, 'null'] }
        boundingBox:
          type: [object, 'null']
          additionalProperties: false
          properties:
            x: { type: number }
            y: { type: number }
            width: { type: number }
            height: { type: number }
        confidence:
          type: [number, 'null']
          description: |
            NULL MEANS NOT APPLICABLE, NEVER UNKNOWN. A structured e-invoice or
            a source-system pull is parsed deterministically and has no
            confidence score to give. A client that renders null as 0% has
            inverted the meaning of the most trustworthy path in the product.

    ExtractedScalar:
      type: object
      description: |
        Discriminated by `kind`. Replaces `string | number | null`, which could
        carry neither a currency nor a line-item array.
      additionalProperties: true
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/ExtractedScalarKind' }

    # ---------------------------------------------------------- C1 / C2

    IntakeChannelStatus:
      type: object
      additionalProperties: false
      required: [channel, wired, lastArrivalAt]
      properties:
        channel:
          type: string
          enum: [upload, watched_drop, connector_pull, mailbox]
          description: |
            C1's four channels, and — since G184 was applied on 24 Aug 2026 —
            the model's only intake vocabulary. `INTAKE_CHANNEL_KINDS`
            (`model/ingestion.ts`) declares these four members in this order,
            and `tools/check-wire-mirror.mjs` compares the two AS SEQUENCES, so
            reordering either side is a finding even though the set is
            unchanged.

            The three-value `SourceDocument.origin` this description used to
            record a divergence against is DELETED, not deprecated: three
            values were a lossy projection of four, and collapsing
            `watched_drop` and `mailbox` into one `connector` is what made an
            `EndpointHealth` row unattributable to the lane that produced it.
            `api` is DROPPED rather than folded — `upload` is the presigned PUT
            below, a different act with a different admission story, and
            nothing in the record specifies a document-push API. If one is ever
            specified it returns as a FIFTH member here, never as a
            reinterpretation of `upload`.
        wired: { type: boolean }
        lastArrivalAt: { type: [string, 'null'], format: date-time }

    DocumentTypeChoice:
      type: object
      additionalProperties: false
      description: |
        A document type as a person picks it. Three of `DocumentType`'s seven
        fields; `key`, `domain` and `carriesControlTotal` have no reader on a
        served surface. G3941.
      required: [documentTypeId, label, expectedFidelity]
      properties:
        documentTypeId: { type: string }
        label:
          type: string
          description: The pack's own name for the type, verbatim. Rendered as text, parsed by nothing.
        expectedFidelity:
          type: string
          enum: [structured, tabular, digital_text, scanned]
    SourceEndpoint:
      type: object
      additionalProperties: false
      description: |
        A declared source. G2681–G2690. `connection` carries the SFTP fields
        when `kind` is `sftp` and the S3 fields when it is `s3`, and never the
        other kind's.
      required:
        - endpointId
        - label
        - direction
        - state
        - connection
        - declaredAt
        - credentialBoundAt
        - lastArrivalAt
        - stoppedAt
        - documentTypes
      properties:
        endpointId: { type: string }
        label: { type: string }
        direction: { type: string, enum: [inbound, outbound, bidirectional] }
        state:
          type: string
          enum: [waiting_on_credential, waiting_on_first_delivery, delivered, stopped]
        connection:
          type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, enum: [sftp, s3] }
            host: { type: string }
            port: { type: integer }
            path: { type: string }
            hostKeyFingerprint: { type: string }
            bucket: { type: string }
            keyPrefix: { type: string }
            region: { type: string }
            roleArn: { type: string }
            externalId:
              type: string
              description: |
                MINTED BY US (G2685). Put it in the role's trust policy as the
                `sts:ExternalId` condition.
        declaredAt: { type: string, format: date-time }
        credentialBoundAt: { type: [string, 'null'], format: date-time }
        lastArrivalAt: { type: [string, 'null'], format: date-time }
        stoppedAt:
          type: [string, 'null']
          format: date-time
          description: When the CURRENT stop began. Null while running.
        documentTypes:
          type: array
          items: { $ref: '#/components/schemas/SourceDocumentTypePair' }

    DeclaredSourceDocumentTypePair:
      type: object
      additionalProperties: false
      description: |
        A pair as `declareEndpointDocumentType` answers it: the pair, and what
        its declaration drained from the parked pile (row 16, G2835).
      required: [pairId, match, documentTypeId, expectedFidelity, mappedFields, drain]
      properties:
        pairId: { type: string }
        match:
          type: object
          additionalProperties: false
          required: [kind, value]
          properties:
            kind: { type: string, enum: [path_prefix, filename] }
            value: { type: string }
        documentTypeId: { type: string }
        expectedFidelity:
          type: string
          enum: [structured, tabular, digital_text, scanned]
        mappedFields: { type: integer, minimum: 1 }
        drain:
          type: object
          additionalProperties: false
          required: [drained, stillParked]
          properties:
            drained:
              type: integer
              minimum: 0
              description: Parked deliveries this declaration extracted into documents.
            stillParked:
              type: integer
              minimum: 0
              description: Parked deliveries on this source the declaration did not claim.

    ParkedArrival:
      type: object
      additionalProperties: false
      description: |
        One parked delivery, as the register's line names it. G2831–G2840.
        `filename` is the source's own name, verbatim — data, never markup.
      required:
        - arrivalId
        - endpointId
        - endpointLabel
        - filename
        - arrivedAt
        - parkedBecause
        - matchingPairIds
        - escalation
        - unblockedBy
      properties:
        arrivalId: { type: string }
        endpointId: { type: string }
        endpointLabel: { type: string }
        filename: { type: [string, 'null'] }
        arrivedAt: { type: string, format: date-time }
        parkedBecause:
          type: string
          enum:
            - no_declared_pair_matches
            - more_than_one_pair_matches
            - pair_type_is_not_extractable
            - artefact_does_not_fit_the_mapping
            - drain_owed
          description: |
            DERIVED NOW, never stored. `pair_type_is_not_extractable` is R12:
            the one pair matching it names a type that reads OCR or a model,
            and neither is taken. `drain_owed` would extract now and has not
            been drained — unreachable through this product's own writers,
            published rather than hidden if it is ever reached.
        matchingPairIds:
          type: array
          items: { type: string }
        escalation:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [documentTypeId, raisedAt]
              properties:
                documentTypeId: { type: string }
                raisedAt: { type: string, format: date-time }
        unblockedBy:
          type: object
          additionalProperties: false
          required: [capability]
          properties:
            capability: { type: string, enum: [configure_endpoint] }

    ParkedArrivalPane:
      type: object
      additionalProperties: false
      description: |
        One parked delivery's pane — row 19. The line's fields, and the
        sample's SHAPE (G106: no value of a held artefact is readable).
      required:
        - arrivalId
        - endpointId
        - endpointLabel
        - filename
        - arrivedAt
        - parkedBecause
        - matchingPairIds
        - escalation
        - unblockedBy
        - sample
      properties:
        arrivalId: { type: string }
        endpointId: { type: string }
        endpointLabel: { type: string }
        filename: { type: [string, 'null'] }
        arrivedAt: { type: string, format: date-time }
        parkedBecause:
          type: string
          enum:
            - no_declared_pair_matches
            - more_than_one_pair_matches
            - pair_type_is_not_extractable
            - artefact_does_not_fit_the_mapping
            - drain_owed
        matchingPairIds:
          type: array
          items: { type: string }
        escalation:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [documentTypeId, raisedAt]
              properties:
                documentTypeId: { type: string }
                raisedAt: { type: string, format: date-time }
        unblockedBy:
          type: object
          additionalProperties: false
          required: [capability]
          properties:
            capability: { type: string, enum: [configure_endpoint] }
        sample:
          type: object
          additionalProperties: false
          required: [isRecord, fields]
          properties:
            isRecord:
              type: boolean
              description: False when the delivery is not a JSON object — no mapping can apply to it.
            fields:
              type: array
              items: { type: string }
              description: The record's top-level keys, sorted. Never a value.

    ParkedEscalation:
      type: object
      additionalProperties: false
      required: [arrivalId, documentTypeId, raisedAt]
      properties:
        arrivalId: { type: string }
        documentTypeId: { type: string }
        raisedAt: { type: string, format: date-time }

    SourceDocumentTypePair:
      type: object
      additionalProperties: false
      required: [pairId, match, documentTypeId, expectedFidelity, mappedFields]
      properties:
        pairId: { type: string }
        match:
          type: object
          additionalProperties: false
          required: [kind, value]
          properties:
            kind: { type: string, enum: [path_prefix, filename] }
            value: { type: string }
        documentTypeId: { type: string }
        expectedFidelity:
          type: string
          enum: [structured, tabular, digital_text, scanned]
          description: |
            THE TYPE'S, READ THROUGH THE PAIR (row 11, G2690). A pair carries
            no fidelity of its own and cannot override this.
        mappedFields: { type: integer, minimum: 1 }

    UploadTicket:
      type: object
      additionalProperties: false
      required: [uploadId, method, url, headers, expiresAt, maxBytes]
      properties:
        uploadId: { type: string }
        method: { type: string, const: PUT }
        url:
          type: string
          format: uri
          description: |
            Single-use and short-lived. The key inside it was chosen by the
            server under the tenant prefix; a client that rewrites it gets a
            signature failure from S3, which is the correct place for that
            check to live.
        headers:
          type: object
          additionalProperties: { type: string }
          description: Must be sent verbatim. They are covered by the signature.
        expiresAt: { type: string, format: date-time }
        maxBytes: { type: integer }

    DocumentStatus:
      type: string
      description: |
        `rejected` carries `rejectedFor`. A rejection is a normal outcome of
        F12's structural checks and arrives asynchronously, which is why it is
        a status rather than an error response on the completing call.
      enum: [received, sanitising, extracting, extracted, rejected, purged]

    DocumentSummary:
      type: object
      additionalProperties: false
      required: [documentId, documentTypeId, filename, status, synthetic, ingestedAt]
      properties:
        documentId: { type: string }
        documentTypeId: { type: string }
        filename: { type: string }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        rejectedFor:
          oneOf:
            - $ref: '#/components/schemas/ErrorCode'
            - type: 'null'
          description: |
            Set when status is `rejected`. Drawn from the same closed enum so
            the reason survives a restrictive telemetry profile.
        synthetic: { type: boolean }
        ingestedAt: { type: string, format: date-time }
        purgeAfter:
          type: [string, 'null']
          format: date-time
          description: |
            Derived from the tenant's retention policy AT INGEST, not at read
            time. A retention policy shortened later does not retroactively
            change what a document promised.

    Document:
      description: |
        `DocumentSummary` plus the extracted content. NOTE the absence of
        `additionalProperties: false` on the second branch — under an `allOf` it
        would not see the sibling branch's properties and would reject every
        field inherited from the summary. Every other object in this document
        is closed; this one is closed by composition instead.
      allOf:
        - $ref: '#/components/schemas/DocumentSummary'
        - type: object
          required: [extracted, lines, redactedPaths, acquisitionFidelity]
          properties:
            acquisitionFidelity:
              type: string
              enum: [structured, tabular, digital_text, scanned]
              description: |
                Describes the ARTEFACT, not the route it took. A connector can
                deliver a scan and an upload can be structured XML. It makes a
                downgrade visible: invoices structured last quarter and scanned
                this one are a supplier problem, not a model-tuning problem,
                and the two need entirely different responses.
            extracted:
              type: object
              additionalProperties: { $ref: '#/components/schemas/ExtractedValue' }
              propertyNames: { $ref: '#/components/schemas/FieldPathKey' }
              description: |
                Header-grain fields, keyed by `FieldPathKey` — the one-way
                identity token of a `FieldPath`, NOT a path and NOT a dotted
                string. ⚠️ THIS SAID "keyed by FieldPath" UNTIL G244, 23 Aug
                2026, and it could not have been true even before G214: a JSON
                property name is a string. Mirrors
                `SourceDocument.extracted: Record<FieldPathKey, ExtractedValue>`.
            lines:
              type: array
              description: Line-grain fields. Empty for documents with no line structure.
              items:
                type: object
                additionalProperties: false
                required: [index, fields]
                properties:
                  index: { type: integer }
                  fields:
                    type: object
                    additionalProperties: { $ref: '#/components/schemas/ExtractedValue' }
                    propertyNames: { $ref: '#/components/schemas/FieldPathKey' }
                    description: |
                      Keyed by `FieldPathKey`, as `extracted` is, and
                      LINE-RELATIVE: the path is rooted at this line, not at the
                      document. Mirrors `ExtractedLine.fields`.
            redactedPaths:
              type: array
              description: |
                What the reader was not shown. Named rather than silently
                omitted — a reviewer comparing a redacted value against an
                unredacted one reaches a confident wrong conclusion.
              items: { $ref: '#/components/schemas/FieldPath' }
            pageRenderUrl:
              type: [string, 'null']
              format: uri
              description: |
                Short-lived. A page render carries the personal data of the
                page it renders, which is why `page_render` is its own
                RetentionClass rather than a cache.

    ExtractedValue:
      type: object
      additionalProperties: false
      required: [scalar, provenance]
      properties:
        scalar: { $ref: '#/components/schemas/ExtractedScalar' }
        provenance: { $ref: '#/components/schemas/Provenance' }

    # ---------------------------------------------------------- C5

    RunTrigger:
      type: object
      description: |
        WHAT DID START A RUN. Recorded on the run; never a configuration, and
        never asserted by a caller.
      additionalProperties: true
      required: [kind]
      properties:
        kind:
          type: string
          enum: [manual, scheduled, ingest, source_signal, rerun]

    Run:
      type: object
      additionalProperties: false
      required:
        - runId
        - definitionId
        - definitionName
        - definitionVersion
        - periodId
        - periodStartsOn
        - periodEndsOn
        - trigger
        - status
        - startedAt
        - completeness
      properties:
        runId: { type: string }
        definitionId: { type: string }
        definitionName:
          type: [string, 'null']
          description: |
            G3351, 3 Oct 2026 — `ReconciliationDefinition.name`, stored in
            `tenant.reconciliation_definition.name` (`db/migrations/0420`).
            OPERATOR-AUTHORED TEXT, stored verbatim and parsed by nothing: a
            consumer renders it as TEXT and never as markup or instruction
            (invariant 6's posture, `0022`'s precedent for
            `counterparty.display_name`).

            REQUIRED-AND-NULLABLE, NEVER OPTIONAL, and `null` is an answer:
            THIS PLANE HOLDS NO NAME FOR THE DEFINITION — it was written before
            the column existed, or its row is not visible. A client renders
            `definitionId` in that case, which is a true thing to render; a
            plane that answered the id here, or the empty string, would be
            INVENTING a name.
        definitionVersion:
          type: integer
          description: Pins the definition as it stood, so a re-run is distinguishable.
        periodId: { type: [string, 'null'] }
        periodStartsOn:
          type: [string, 'null']
          format: date
          description: |
            G3429, 3 Oct 2026 — the first CALENDAR day of the run's period,
            inclusive (`tenant.reconciliation_period.starts_on`,
            `db/migrations/0430`). A date and never an instant, so a label does
            not move with the reader's zone. REQUIRED-AND-NULLABLE: `null`
            means this plane holds no dates for the period, and a client draws
            `periodId` instead. Null exactly when `periodEndsOn` is.
        periodEndsOn:
          type: [string, 'null']
          format: date
          description: The last calendar day of the period, inclusive. See `periodStartsOn`.
        trigger: { $ref: '#/components/schemas/RunTrigger' }
        # O-16. `incomplete` is SOUND OVER LESS THAN EVERYTHING — the ledger is
        # persistable, the population it was computed over is not the
        # population. It is neither `completed` nor `failed`; a consumer that
        # folds it into either one is choosing between discarding a sound
        # partial result and persisting an unsound one without being told.
        # Mirrored from `RunStatus` (model/domain.ts) and PINNED: the
        # `run_status` pair in tools/check-wire-mirror.mjs compares this list
        # element-for-element against the model.
        #
        # ✅ G153's CARVE-OUT ⓐ IS DISCHARGED HERE, AND THE COMMENT THAT STOOD
        # IN THIS SPOT IS REPLACED RATHER THAN DELETED BECAUSE A READER WOULD
        # HAVE TRUSTED IT. It read: "`SetReconciliationResult.completeness` …
        # reaches NO contract tier. Neither does `postconditions`, `residue`,
        # `admissionRates` or `refusedAtAdmission`; this schema is
        # `additionalProperties: false` with no findings channel at all. So a
        # WIRE consumer learns THAT a run is incomplete and never WHAT is
        # missing … Minting those schemas is its own commit."
        #
        # THAT COMMIT IS THIS ONE. `completeness` below is the shortfall
        # channel on this schema; `getRunAccount` carries all six channels
        # including `postconditions`, `admissionRates` and `refusedAtAdmission`;
        # and `listRunResidue` carries the residue at line grain. Leaving the
        # old sentence standing would make the contract lie about itself.
        #
        # ⚠️ *"all five channels"* UNTIL 22 Aug 2026. G237 folded `meterFacts`
        # onto the same account as the sixth, which is the same correction shape
        # this comment was written to perform and is recorded rather than swept.
        #
        # G4033, THE OWNER'S, 4 Oct 2026 — `refused` is the SIXTH member: the
        # engine refused the definition and produced no ledger. Not `failed`
        # (an unsound ledger) and not `queued` (nothing ran). WHY it refused is
        # `getRunAccount`'s `refused` arm; `exceptionsRaised` is null on it.
        status: { type: string, enum: [queued, running, completed, failed, incomplete, refused] }
        inputs:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          description: Document ids per slot, pinned at admission.
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        exceptionsRaised: { type: [integer, 'null'] }
        completeness:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/CompletenessFinding' }
          description: |
            WHAT IS MISSING, not merely THAT something is — G153's carve-out ⓐ,
            discharged. `incomplete` means SOUND OVER LESS THAN EVERYTHING, and
            until this channel existed a consumer got that one word and nothing
            it could act on. Each finding carries the magnitude and the address:
            a mapper that dropped one row in three and a shredder that truncated
            a file are different remedies applied by different people.

            🛑 `null` AND `[]` ARE DIFFERENT ANSWERS AND COLLAPSING THEM IS THE
            DEFECT THIS FIELD EXISTS TO AVOID. `[]` is the ENGINE saying it
            observed no shortfall. `null` is this plane saying IT HOLDS NO
            ENGINE ACCOUNT FOR THIS RUN AT ALL — no reconciliation result is
            persisted anywhere in this repository yet, so `null` is what every
            run answers today. A non-nullable array would force the second to be
            spelled as the first and would report a clean close for a run nobody
            reconciled. It is the same posture as `ResidueEntry.settlement`,
            which is required-and-nullable precisely because its first version
            carried a fabricated zero.

            🛑 AND THE BOUNDARY OF WHAT EITHER ANSWER CAN MEAN. The engine knows
            what the documents it was HANDED presented, and what a file said
            about ITSELF. NOTHING IN THIS REPOSITORY KNOWS WHAT ARRIVED. Ten
            files despatched and three landed is invisible to both arms and
            would stay invisible if all three were internally perfect — there is
            no manifest, no delivery receipt and no expected-file register. A
            consumer reading `[]` as *nothing is missing* is reading it wrongly.
            No operation in this tier invents that denominator, because a count
            invented to make this state tidy would be a number with no source.

    RunAdmission:
      type: object
      description: |
        `outcome` distinguishes a new run from a deduplicated one. BOTH ARE
        SUCCESSES. A client showing an error toast on `deduplicated` is telling
        the operator that the correct behaviour went wrong.
      additionalProperties: false
      required: [outcome, run, idempotencyBasis]
      properties:
        outcome:
          type: string
          enum: [admitted, deduplicated]
        run: { $ref: '#/components/schemas/Run' }
        idempotencyBasis:
          type: object
          description: |
            The three things the key was computed from, returned so a puzzled
            operator can see WHY their press of Run joined an existing run
            instead of starting one.
          additionalProperties: false
          required: [definitionId, periodId, slotFillFingerprint]
          properties:
            definitionId: { type: string }
            periodId: { type: [string, 'null'] }
            slotFillFingerprint:
              type: string
              description: |
                A hash over which documents currently occupy which slots. It is
                what makes "the same run" mean the same INPUTS rather than
                merely the same period.

    # ------------------------------------------------- C5 · THE ENGINE'S ACCOUNT
    #
    # 🛑 EVERY VOCABULARY BELOW IS A MIRROR OF `model/reconciliation.ts`, NOT A
    #    RESTATEMENT OF IT. The model is the authority; the wire mirrors it, in
    #    declaration order. Eleven of them are PINNED by pairs in
    #    `tools/check-wire-mirror.mjs`, which compares each `<X>Kind` enum
    #    element-for-element against the model's union and fails the build on a
    #    reordering as well as on a missing member.
    #
    # ⚠️ AND EACH VOCABULARY IS STATED TWICE IN THIS FILE, DELIBERATELY, WITH
    #    ONE COPY THE CHECKER CANNOT REACH. A pair addresses ONE list at ONE
    #    path under `components.schemas`; a discriminated `oneOf` also states
    #    each member as the single-value `enum` on its own arm's `kind`, and no
    #    pair can bind to that. This is the same class as the run-status strings
    #    restated inline at the `/runs` `status` query parameter, which the
    #    checker names in its own header. The second copy is guarded by
    #    `tests/contracts/engine-read-wire.test.mjs` group C — the arm set must
    #    EQUAL the pinned enum, member for member, in order — and by nothing
    #    else. The flat alternative (one object carrying every arm's fields as
    #    optional properties) was refused: it makes every invalid combination
    #    legal, which is §5.5.
    #
    # ⚠️ `PopulationAdmissionRefusal` IS NAMED THAT WAY BECAUSE `AdmissionRefusal`
    #    IS ALREADY TAKEN IN THIS FILE, BY A DIFFERENT CONCEPT, AND THE COLLISION
    #    IS RECORDED RATHER THAN RESOLVED BY GUESSING. The existing one is C9's
    #    MESSAGE admission — `injection_suspected`, `sender_unverified`, a purely
    #    security decision about a piece of correspondence. This one is the
    #    engine's ROW admission — whether a transaction could be read out of a
    #    document at all. Two unrelated things called "admission" in one contract
    #    is a hazard whoever reads this next should know about; renaming the
    #    older one is a breaking contract change and is not this slice's to make.
    #
    # ✅ ONE UNION IN THE MODULE WAS DELIBERATELY NOT PINNED. W-1 (#186) HAS
    #    LANDED AND IT IS PINNED NOW. This block is corrected rather than
    #    deleted, because it is the one a reader would have trusted. It read:
    #    "`RunRefusalKind` below mirrors `SetReconciliationRefusal`, whose
    #    FIFTEEN arms the wire-mirror's model-side reader currently reads as
    #    SEVENTEEN — it harvests `kind: '…'` out of the NESTED union inside
    #    `tolerance_unit_disagrees`, yielding the phantoms `pairing` and
    #    `strategy_binding`. That is W-1 (#186), OPEN … It is hand-maintained
    #    until #186 lands."
    #
    #    `unionKinds()` now accepts `kind` only at an arm's OWN object depth and
    #    returns exactly fifteen, so the `run_refusal_kinds` pair is registered
    #    in `tools/check-wire-mirror.mjs` and `RunRefusalKind` IS NO LONGER
    #    HAND-MAINTAINED. `tests/contracts/engine-read-wire.test.mjs` group D
    #    still asserts the fifteen BY NAME and still measures the reader — the
    #    measurement is INVERTED, not removed, so it goes red if the answer ever
    #    returns to seventeen. The old warning stands unchanged in one respect:
    #    if the phantoms ever reappear, DO NOT sweep this enum to agree with
    #    them. The model is the authority.

    PopulationSide:
      type: string
      description: |
        Which of the two populations. Mirrors `PopulationSide`.
      enum: [left, right]

    ExtractedScalarKind:
      type: string
      description: |
        PINNED against `ExtractedScalar`. ⚠️ THIS VOCABULARY ALREADY EXISTED IN
        THIS FILE, INLINE ON `ExtractedScalar.kind`, AND IT IS MOVED HERE RATHER
        THAN COPIED. `PopulationAdmissionRefusal` needs to name a scalar KIND
        without carrying a scalar VALUE, and restating six members beside the six
        that were already here would be a second place to drift with nothing
        checking it. `ExtractedScalar.kind` now `$ref`s this, so there is one
        declaration and a wire-mirror pair reaches it.
      enum: [text, number, date, money, identifier, absent]

    ItemRef:
      type: object
      description: |
        ONE transaction inside a population, at LINE grain.

        A bank statement is one `SourceDocument` with four hundred extracted
        lines, so every allocation, every residual and every FIFO position is
        addressed by this pair — even though a population is declared at
        document grain. `MatchGroup.members` addresses DOCUMENTS and can never
        record which line paired.

        ⚠️ THE MODEL'S INTERNAL `itemKey()` — a length-prefixed collision-free
        string — IS NOT ON THE WIRE AND MUST NOT BECOME AN IDENTIFIER HERE. What
        an operator can act on is a file to re-cut and a line to look at, which
        is exactly this pair.
      additionalProperties: false
      required: [sourceDocumentId, lineIndex]
      properties:
        sourceDocumentId: { type: string }
        lineIndex:
          type: [integer, 'null']
          description: Null for a header-grain transaction; the line index for a statement line.

    # ---- money and normalisation refusals, mirrored so the arms that wrap
    #      them can wrap rather than restate ------------------------------------

    MoneyRefusalKind:
      type: string
      description: |
        PINNED against `MoneyRefusal`. ⚠️ No arm carries an amount or a currency
        string, in the model or here: "a refusal is the value most likely to be
        put in a log by the first engineer who debugs this", and a minor-unit
        amount is a transaction value.
      enum:
        - currency_mismatch
        - exponent_mismatch
        - not_integer_minor_units
        - exceeds_exact_integer_range
        - currency_not_stated
        - exponent_not_a_non_negative_integer
        - no_items

    MoneyRefusal:
      type: object
      description: Why a money operation refused. Carries no amount and no currency.
      additionalProperties: false
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/MoneyRefusalKind' }

    NormalisationDefectKind:
      type: string
      description: PINNED against `NormalisationDefect`.
      enum:
        - max_input_chars_not_stated
        - empty_separator
        - empty_literal
        - negative_index
        - non_integer_index

    NormalisationDefect:
      type: object
      description: |
        A defect in a declared identifier normalisation. `opIndex` names the
        operation an operator has to fix; `max_input_chars_not_stated` is a
        property of the whole normalisation and carries none.
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, enum: [max_input_chars_not_stated] }
        - type: object
          additionalProperties: false
          required: [kind, opIndex]
          properties:
            kind: { type: string, enum: [empty_separator] }
            opIndex: { type: integer }
        - type: object
          additionalProperties: false
          required: [kind, opIndex]
          properties:
            kind: { type: string, enum: [empty_literal] }
            opIndex: { type: integer }
        - type: object
          additionalProperties: false
          required: [kind, opIndex]
          properties:
            kind: { type: string, enum: [negative_index] }
            opIndex: { type: integer }
        - type: object
          additionalProperties: false
          required: [kind, opIndex]
          properties:
            kind: { type: string, enum: [non_integer_index] }
            opIndex: { type: integer }
      discriminator:
        propertyName: kind

    ExtractionRefusalKind:
      type: string
      description: |
        PINNED against `ExtractionRefusal`. ⚠️ No arm carries the extracted
        value — the rejected string is counterparty-controlled (invariant 6).
      enum:
        - input_exceeds_max_chars
        - segment_index_out_of_range
        - empty_after_ops
        - normaliser_not_implemented

    ExtractionRefusal:
      type: object
      description: |
        Why an identifier could not be normalised out of a field. `opIndex` is
        null wherever the refusal is a property of the whole extraction rather
        than of one operation.
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, opIndex]
          properties:
            kind: { type: string, enum: [input_exceeds_max_chars] }
            opIndex: { type: 'null' }
        - type: object
          additionalProperties: false
          required: [kind, opIndex]
          properties:
            kind: { type: string, enum: [segment_index_out_of_range] }
            opIndex: { type: integer }
        - type: object
          additionalProperties: false
          required: [kind, opIndex]
          properties:
            kind: { type: string, enum: [empty_after_ops] }
            opIndex: { type: 'null' }
        - type: object
          additionalProperties: false
          required: [kind, opIndex]
          properties:
            kind: { type: string, enum: [normaliser_not_implemented] }
            opIndex: { type: 'null' }
      discriminator:
        propertyName: kind

    ReaderRefusalKind:
      type: string
      description: |
        PINNED against `ReaderRefusal` — why the normalisation reader produced
        no verdict. `candidate_index_out_of_range` is the containment guard
        holding: the model named an index outside the candidate set and the
        engine refused rather than reaching for a name.
      enum:
        - not_implemented
        - contract_violation
        - response_truncated
        - response_exceeded_byte_cap
        - transport_failed
        - candidate_index_out_of_range
        - model_rejected_by_policy
        - field_not_eligible_for_prompt

    # ---- admission: what admission did, and what it refused ------------------

    SettlementTally:
      type: object
      description: |
        G3541 — ONE SIDE'S SETTLEMENT, IN COUNTS AND IN MONEY. `matched` is the
        admitted items the engine FULLY allocated; `open` is the admitted items
        it did not (`unallocated` or `partially_allocated` residue rows). A row
        refused at admission was never admitted and is in neither count — it is
        in `AdmissionRate.refused`. So `matched + open === admitted`, a property
        a caller can CHECK against `admissionRates`.
      additionalProperties: false
      required: [side, matched, open, unsettled]
      properties:
        side: { $ref: '#/components/schemas/PopulationSide' }
        matched: { type: integer, minimum: 0 }
        open: { type: integer, minimum: 0 }
        unsettled: { $ref: '#/components/schemas/UnsettledValue' }

    UnsettledValue:
      type: object
      description: |
        G3541 — THE OPEN ITEMS' RESIDUAL, SUMMED, OR THE REASON IT IS NOT.

        🛑 THREE ARMS AND NEVER A ZERO OR A CONVERSION. `nothing_open` is its
        own arm because a zero needs a currency and a side with nothing open
        has none — `ResidueEntry.settlement`'s fabricated-zero defect, one
        level up. `mixed_units` is a REFUSAL: the open residuals are in more
        than one currency (or exponent), there is no FX rate on this path, and
        a single figure would be a conversion nobody performed. `total` is the
        exact sum, folded through `model/money.ts` (G111).
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, enum: [nothing_open] }
        - type: object
          additionalProperties: false
          required: [kind, total]
          properties:
            kind: { type: string, enum: [total] }
            total: { $ref: '#/components/schemas/Money' }
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, enum: [mixed_units] }
      discriminator:
        propertyName: kind

    AdmissionRate:
      type: object
      description: |
        WHAT ADMISSION DID, PER SIDE. Recorded on every successful run,
        unconditionally, so that a permissive ceiling suppresses the REFUSAL and
        never the EVIDENCE — the model's own instruction is "READ THE RATE,
        NEVER RAISE THE CEILING", and until this schema existed that instructed
        an operator to read a number no surface could show them.

        🛑 THREE INDEPENDENT COUNTS, AND NOTHING DIVIDED. `presented` is folded
        from the DOCUMENTS by a source independent of the admission fold, which
        is what makes `presented === admitted + refused` a property a caller can
        CHECK rather than a tautology it is handed — a fold that LOST a row moves
        `admitted` and leaves `refused` alone. There is deliberately no `rate`,
        no percentage and no basis-point field here: the engine compares
        `refused × 10000 > ceiling × sideRowCount`, exact integer arithmetic,
        cross-multiplied and never divided, and a divided quantity would
        reintroduce exactly the rounding that comparison was written to avoid.
      additionalProperties: false
      required: [side, presented, admitted, refused]
      properties:
        side: { $ref: '#/components/schemas/PopulationSide' }
        presented:
          type: integer
          description: Rows the DOCUMENTS presented. Independent of the admission fold.
        admitted: { type: integer }
        refused: { type: integer }

    PopulationAdmissionRefusalKind:
      type: string
      description: |
        PINNED against `AdmissionRefusal` in `model/reconciliation.ts` — why ONE
        ROW could not be admitted. ⚠️ NOT `AdmissionRefusal` in this file, which
        is C9's MESSAGE admission and an unrelated vocabulary; see the banner
        above this block.

        `field_not_classified` is G106's fail-closed refusal — a payload key with
        no `FieldSpec` is UNREADABLE, stored but unaddressable by any agent,
        prompt, export or dashboard — and it fires at four call sites in
        `admitPopulation()`. It is the only executable form invariant 4 has, and
        this is the first surface on which it is reachable by a person.

        ⚠️ NO ARM CARRIES A PAYLOAD VALUE. `date_not_iso_calendar` in particular
        omits the rejected string deliberately: it is counterparty-controlled.

        🛑 `amount_not_exact_money` IS THE EIGHTH AND IT WAS APPENDED TO A CLOSED
        ENUM, WHICH IS A CONTRACT CHANGE MADE DELIBERATELY RATHER THAN AVOIDED.
        OQ-1: admission checked the amount's scalar KIND and its declared UNIT and
        never called `guardMoney`, so a row whose minor units were `1.5`, `NaN`,
        `Infinity` or past the exact integer range was ADMITTED and then left the
        ledger entirely — in neither the residue nor the allocations, with
        `refusedAtAdmission` empty and `open_item_missing_from_residue` unable to
        fire for the one case it is named for. The member carries the
        `MoneyRefusal` `guardMinor` already returns — `not_integer_minor_units` or
        `exceeds_exact_integer_range` — so no new REASON is minted here, only a
        new place for an old one to be reported. `docs/contracts/errors.yaml` is
        untouched: a refused ROW is a successful run's finding, not a failed
        request.

        ⚠️ ORDER IS LOAD-BEARING. `tools/check-wire-mirror.mjs`
        (`admission_refusal_kinds`) pins this list against `AdmissionRefusal` in
        `model/reconciliation.ts` member for member AND in order, so the new
        member is appended in both places or the gate goes red.
      enum:
        - field_not_classified
        - field_absent
        - amount_not_money
        - date_not_extractable
        - date_not_iso_calendar
        - identifier_not_extractable
        - money_unit_disagrees_with_declared
        - amount_not_exact_money

    PopulationAdmissionRefusal:
      type: object
      description: Why one row was not admitted. Carries reasons and never content.
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, enum: [field_not_classified] }
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, enum: [field_absent] }
        - type: object
          additionalProperties: false
          required: [kind, found]
          properties:
            kind: { type: string, enum: [amount_not_money] }
            found: { $ref: '#/components/schemas/ExtractedScalarKind' }
        - type: object
          additionalProperties: false
          required: [kind, found]
          properties:
            kind: { type: string, enum: [date_not_extractable] }
            found: { $ref: '#/components/schemas/ExtractedScalarKind' }
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, enum: [date_not_iso_calendar] }
        - type: object
          additionalProperties: false
          required: [kind, refusal]
          properties:
            kind: { type: string, enum: [identifier_not_extractable] }
            refusal: { $ref: '#/components/schemas/ExtractionRefusal' }
        - type: object
          additionalProperties: false
          required: [kind, refusal]
          properties:
            kind: { type: string, enum: [money_unit_disagrees_with_declared] }
            refusal: { $ref: '#/components/schemas/MoneyRefusal' }
        # OQ-1. The amount was money, in the declared unit, and not an exact
        # whole number of minor units. It carries the SAME `MoneyRefusal` the
        # variant above carries, and that is the point: `guardMinor` named both
        # failures long before admission called it.
        - type: object
          additionalProperties: false
          required: [kind, refusal]
          properties:
            kind: { type: string, enum: [amount_not_exact_money] }
            refusal: { $ref: '#/components/schemas/MoneyRefusal' }
      discriminator:
        propertyName: kind

    RefusedItem:
      type: object
      description: |
        ONE refused row, with the reason admission gave.

        `path` is the operator-declared field path that refused — never a value
        read out of the payload. That is what makes a `field_not_classified`
        refusal actionable while leaving the unclassified key unreadable, which
        is G106's whole posture.
      additionalProperties: false
      required: [side, ref, path, refusal]
      properties:
        side: { $ref: '#/components/schemas/PopulationSide' }
        ref: { $ref: '#/components/schemas/ItemRef' }
        path:
          $ref: '#/components/schemas/FieldPath'
          description: The declared `FieldSpec` path. Operator-authored, never counterparty content.
        refusal: { $ref: '#/components/schemas/PopulationAdmissionRefusal' }

    # ---- population integrity: control totals and the conformance floor ------

    PopulationDefectKind:
      type: string
      description: |
        PINNED against `PopulationDefect` — the defects that are properties of
        the POPULATION rather than of any one row.

        TWO REFUSE AND SIX REPORT, and the split turns on WHO CONTROLS THE
        OPERAND. A trailer's `lineCount` and `total` are counterparty-controlled
        content parsed from a file's last row, so refusing on them would hand the
        party being reconciled against a one-cell kill switch on the whole close;
        those six are reported beside a sound ledger. `duplicate_item_address`
        refuses because the fold would eat a row before any post-condition could
        see it, and `admission_refusal_rate_above_ceiling` refuses because its
        operand is the OPERATOR'S OWN stated ceiling.
      enum:
        - duplicate_item_address
        - admission_refusal_rate_above_ceiling
        - control_total_declared_nothing
        - declared_line_count_disagrees
        - control_total_unverifiable_rows_refused
        - control_total_not_evaluable
        - declared_control_total_disagrees
        - control_total_arm_disagrees_with_document_type

    PopulationDefect:
      type: object
      description: |
        ONE VOCABULARY, WRAPPED BY TWO ENVELOPES AND COPIED BY NEITHER.
        `PostconditionFailure.population_integrity_reported` and
        `CompletenessFinding.source_self_report_unmet` both `$ref` this schema;
        neither restates a field of it.

        ⚠️ `sideRowCount` ON THE RATE ARM COUNTS ROWS ON THE WHOLE SIDE.
        `documentRowCount` on the control-total arms counts rows in ONE
        DOCUMENT. Nothing may sum, average or render "rows presented" across arms
        of this union: they are different denominators, and one field name for
        both would be §5.3 inverted.
      oneOf:
        # C17 — an ADDRESS collision, not duplicate-invoice detection. `itemKey`
        # is an address; the same invoice number at two different addresses is a
        # different finding with its own mechanism.
        - type: object
          additionalProperties: false
          required: [kind, ref, occurrences]
          properties:
            kind: { type: string, enum: [duplicate_item_address] }
            ref: { $ref: '#/components/schemas/ItemRef' }
            occurrences:
              type: integer
              description: |
                Two and seventeen are different defects: two is a re-delivery,
                seventeen is a mapper emitting a constant line index.
        # C13's CONFIGURABLE HALF — the conformance floor, expressed as a
        # ceiling on the refusal rate.
        #
        # ⚠️ NO `sourceDocumentId` ON THIS ARM. `defectDocument()` returns null
        # for it: a rate is a property of the SIDE, the rows came from every
        # document on it, and naming one would be a claim about which file
        # caused a rate.
        - type: object
          additionalProperties: false
          required: [kind, refusedCount, sideRowCount, ceilingBasisPoints]
          properties:
            kind: { type: string, enum: [admission_refusal_rate_above_ceiling] }
            refusedCount: { type: integer }
            sideRowCount:
              type: integer
              description: Rows on the WHOLE SIDE — not rows in one document.
            ceilingBasisPoints:
              type: integer
              description: |
                THE CEILING THAT WAS USED, and it travels because refusing
                discards the result and with it `admissionRates` — so the refusal
                has to be the evidence an operator reads.

                🛑 STATED NON-GOAL: NO OPERATION IN THIS TIER OFFERS A WAY TO SET
                ONE. G139 makes every conformance floor FDE-set pack
                configuration refusing on absence, and there is no surface on
                which any of them is set — `administration.openapi.yaml` does not
                exist. A settable ceiling on a tenant-facing operation would be
                the off-switch G79 already refused once.
        # C18 — the file's own account of itself. Six arms, all REPORTED.
        - type: object
          additionalProperties: false
          required: [kind, sourceDocumentId]
          properties:
            kind: { type: string, enum: [control_total_declared_nothing] }
            sourceDocumentId: { type: string }
        - type: object
          additionalProperties: false
          required: [kind, sourceDocumentId, declaredCount, documentRowCount]
          properties:
            kind: { type: string, enum: [declared_line_count_disagrees] }
            sourceDocumentId: { type: string }
            declaredCount: { type: integer }
            documentRowCount:
              type: integer
              description: |
                THE TRUNCATED-SHRED DETECTOR. Compared against rows PRESENTED,
                never rows admitted — a truncated file and an unreadable row are
                different defects and keying one check on both is §5.1.
        - type: object
          additionalProperties: false
          required: [kind, sourceDocumentId, documentRowCount, admittedCount]
          properties:
            kind: { type: string, enum: [control_total_unverifiable_rows_refused] }
            sourceDocumentId: { type: string }
            documentRowCount: { type: integer }
            admittedCount:
              type: integer
              description: |
                THE ARM THAT MAKES THE TOTAL CHECK HONEST. A refused row has no
                readable amount, so a sum over the admitted rows of a
                partially-refused document is NOT the file's total. The engine
                says it cannot verify rather than producing a wrong verdict in
                either direction.
        - type: object
          additionalProperties: false
          required: [kind, sourceDocumentId, refusal]
          properties:
            kind: { type: string, enum: [control_total_not_evaluable] }
            sourceDocumentId: { type: string }
            refusal: { $ref: '#/components/schemas/MoneyRefusal' }
        - type: object
          additionalProperties: false
          required:
            - kind
            - sourceDocumentId
            - declaredMinor
            - declaredExponent
            - admittedMinor
            - admittedExponent
          properties:
            kind: { type: string, enum: [declared_control_total_disagrees] }
            sourceDocumentId: { type: string }
            # 🛑 DECIMAL STRINGS SINCE 19 Sep 2026 — G286. Both MINOR fields, and
            # neither EXPONENT: a minor-unit figure derived from a `Money` is
            # money and carries money's wire form; an exponent is not an amount.
            declaredMinor: { type: string, pattern: '^-?[0-9]+$' }
            declaredExponent:
              type: integer
              description: |
                🛑 THE EXPONENT IS CARRIED, in the one control whose entire
                subject is a hundredfold error. This arm is emitted PER DOCUMENT
                into a multi-document array, where "one run is one unit by
                construction" does not hold. MINOR UNITS AND NEVER A `Money`:
                `Money.currency` is a string and the containment proof forbids
                it, which is the same reason `MoneyRefusal` carries no currency.
            admittedMinor: { type: string, pattern: '^-?[0-9]+$' }
            admittedExponent: { type: integer }
        - type: object
          additionalProperties: false
          required: [kind, sourceDocumentId]
          properties:
            kind: { type: string, enum: [control_total_arm_disagrees_with_document_type] }
            sourceDocumentId: { type: string }
      discriminator:
        propertyName: kind

    # ---- the two result channels, and the declaration that separates them ----

    PostconditionFailureKind:
      type: string
      description: PINNED against `PostconditionFailure`.
      enum:
        - open_item_missing_from_residue
        - item_in_residue_twice
        - fully_allocated_item_in_residue
        - negative_residual
        - gross_not_partitioned
        - population_integrity_reported
        - population_wholly_refused

    PostconditionFailure:
      type: object
      description: |
        ⚠️ NON-EMPTY IS NOT AN INSTRUCTION AND MUST NOT BE READ AS ONE. It means
        EITHER the ledger is unsound OR the population it was computed over is
        not the population — two properties on one channel. Which of the two an
        arm is about is declared by `PostconditionProperty`, and `terminalStatus`
        on `RunEngineAccount` is what a caller switches on instead of a length
        test. A caller that still treats this list as a do-not-persist flag will
        discard sound partial closes.
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, count]
          properties:
            kind: { type: string, enum: [open_item_missing_from_residue] }
            count: { type: integer }
        - type: object
          additionalProperties: false
          required: [kind, count]
          properties:
            kind: { type: string, enum: [item_in_residue_twice] }
            count: { type: integer }
        - type: object
          additionalProperties: false
          required: [kind, count]
          properties:
            kind: { type: string, enum: [fully_allocated_item_in_residue] }
            count: { type: integer }
        - type: object
          additionalProperties: false
          required: [kind, count]
          properties:
            kind: { type: string, enum: [negative_residual] }
            count: { type: integer }
        - type: object
          additionalProperties: false
          required: [kind, admittedMinor, accountedMinor]
          properties:
            kind: { type: string, enum: [gross_not_partitioned] }
            # 🛑 DECIMAL STRINGS SINCE 19 Sep 2026 — G286. These two are
            # CUMULATIVE TOTALS over a whole population, which is the case the
            # 2^53 ceiling reached first and the reason the ruling was taken.
            admittedMinor: { type: string, pattern: '^-?[0-9]+$' }
            accountedMinor: { type: string, pattern: '^-?[0-9]+$' }
        - type: object
          additionalProperties: false
          required: [kind, side, defect]
          properties:
            kind: { type: string, enum: [population_integrity_reported] }
            side: { $ref: '#/components/schemas/PopulationSide' }
            defect: { $ref: '#/components/schemas/PopulationDefect' }
        - type: object
          additionalProperties: false
          required: [kind, side, sideRowCount]
          properties:
            kind: { type: string, enum: [population_wholly_refused] }
            side: { $ref: '#/components/schemas/PopulationSide' }
            sideRowCount: { type: integer }
      discriminator:
        propertyName: kind

    PostconditionProperty:
      type: object
      description: |
        WHICH PROPERTY EACH POST-CONDITION ARM IS ABOUT — a CONSTANT the server
        publishes, not per-run data.

        🛑 SHIPPING THE LIST WITHOUT THIS DECLARATION WOULD PUT THE O-16 DEFECT
        ON THE WIRE ON PURPOSE. Two of the seven arms were never about soundness
        at all. A consumer doing `postconditions.length > 0` discards sound
        partial closes; a consumer doing nothing persists unsound ledgers. This
        is what a client switches on instead of re-deriving the split from an
        arm's name.

        ⚠️ THE CHECKER CANNOT PIN THIS. `tools/check-wire-mirror.mjs` has no
        source kind that reads a const object's KEYS — `constValues()` returns
        its VALUES — so the soundness/completeness assignment is covered by
        `tests/contracts/engine-read-wire.test.mjs` E4, key by key, and by
        nothing else.
      additionalProperties: false
      required:
        - open_item_missing_from_residue
        - item_in_residue_twice
        - fully_allocated_item_in_residue
        - negative_residual
        - gross_not_partitioned
        - population_integrity_reported
        - population_wholly_refused
      properties:
        open_item_missing_from_residue: { type: string, enum: [soundness] }
        item_in_residue_twice: { type: string, enum: [soundness] }
        fully_allocated_item_in_residue: { type: string, enum: [soundness] }
        negative_residual: { type: string, enum: [soundness] }
        gross_not_partitioned: { type: string, enum: [soundness] }
        population_integrity_reported: { type: string, enum: [completeness] }
        # A side where every presented row refused is the EXTREME of incomplete,
        # not a case of unsoundness: the ledger is sound over NOTHING, and
        # refusing it was refused because the residue is then the only output
        # there is. This is the assignment most likely to be got backwards,
        # because the word *refused* reads like a failure.
        population_wholly_refused: { type: string, enum: [completeness] }

    CompletenessFindingKind:
      type: string
      description: |
        PINNED against `CompletenessFinding`. TWO ARMS, DISJOINT BY WHAT
        WITNESSES THEM — the run's OWN observation, and the FILE's observation
        about itself. A consumer handling only one passes half of it.
      enum:
        - rows_presented_not_admitted
        - source_self_report_unmet

    CompletenessFinding:
      type: object
      description: |
        WHAT THE ENGINE COULD NOT ESTABLISH ABOUT COMPLETENESS — with the
        magnitude and the address, never a bare fact that something is amiss.

        🛑 A BOOLEAN WAS REFUSED AND THE REASON IS THE WHOLE POINT. `complete:
        false` leaves an operator unable to tell a mapper that dropped one row in
        three from a shredder that truncated a file, which are different remedies
        applied by different people.

        ⚠️ NEITHER ARM MEANS DO-NOT-PERSIST. That is `postconditions` on a
        soundness arm, and the two channels are kept apart precisely so a caller
        can persist a partial close and refuse an unsound one.
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, side, presented, admitted, refused]
          properties:
            kind: { type: string, enum: [rows_presented_not_admitted] }
            side: { $ref: '#/components/schemas/PopulationSide' }
            presented: { type: integer }
            admitted: { type: integer }
            refused:
              type: integer
              description: |
                🛑 ALL FOUR TRAVEL. The engine keys on `presented > admitted`,
                NOT on `refused > 0`, because a fold that LOST a row without
                refusing it moves `admitted` and leaves `refused` alone — so
                keying on `refused` would miss exactly the case where the
                shortfall was silent. `refused` rides along as evidence, and
                `presented !== admitted + refused` is a caller-checkable
                disagreement between two independent counts.
        - type: object
          additionalProperties: false
          required: [kind, side, defect]
          properties:
            kind: { type: string, enum: [source_self_report_unmet] }
            side: { $ref: '#/components/schemas/PopulationSide' }
            # 🛑 A BARE `$ref`, AND THE SPELLING IS THE ASSERTION. THE DEFECT
            # TRAVELS VERBATIM AND IS NEVER RESTATED: `PopulationDefect` is the
            # vocabulary and this is a second envelope over it, exactly as
            # `PostconditionFailure.population_integrity_reported` is the first.
            # Declaring `declaredCount`/`documentRowCount` again here would be
            # two spellings of one finding, drifting the first time an arm
            # gained a field (§5.3). An `allOf` wrapper carrying a description
            # stood here for one revision and was replaced: it is the same
            # vocabulary, but it is a DIFFERENT SPELLING of the reference from
            # the one the other envelope uses, and two spellings is how the two
            # envelopes start to diverge.
            defect: { $ref: '#/components/schemas/PopulationDefect' }
      discriminator:
        propertyName: kind

    # ---- the residue: the product ------------------------------------------

    ResidueCauseKind:
      type: string
      description: |
        PINNED against `ResidueCause`.

        🛑 `control_total_unverified` DOMINATES THE OTHERS DELIBERATELY. If a
        file is truncated, doubled or one row short, every matching verdict over
        its rows is suspect — so *nothing matched it* would send an operator
        chasing a match for a row whose file is the actual problem. The fix is a
        file to re-cut and the cause has to say so before it says anything else.
      enum:
        - no_strategy_paired
        - identifier_ambiguous
        - admission_refused
        - cash_exceeded_obligations
        - obligation_not_fully_settled
        - counterparty_unattributed
        - bucket_exceeded_bound
        - search_budget_exhausted
        - reader_refused
        - reader_found_no_candidate
        - control_total_unverified
        - read_held_below_floor
        # ⚠️ APPENDED, NEVER INSERTED — G291, 19 Sep 2026. `check-wire-mirror`
        # compares this list against `ResidueCause`'s arms AS A SEQUENCE, so a
        # member placed where it reads most naturally is a red gate; the model's
        # union appends it in the same position for the same reason.
        - amount_tolerance_declined

    ResidueCause:
      type: object
      description: Why this row is still open. Closed vocabulary; no counterparty text.
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind]
          properties: { kind: { type: string, enum: [no_strategy_paired] } }
        - type: object
          additionalProperties: false
          required: [kind]
          properties: { kind: { type: string, enum: [identifier_ambiguous] } }
        - type: object
          additionalProperties: false
          required: [kind, refusal]
          properties:
            kind: { type: string, enum: [admission_refused] }
            refusal: { $ref: '#/components/schemas/PopulationAdmissionRefusal' }
        - type: object
          additionalProperties: false
          required: [kind]
          properties: { kind: { type: string, enum: [cash_exceeded_obligations] } }
        - type: object
          additionalProperties: false
          required: [kind]
          properties: { kind: { type: string, enum: [obligation_not_fully_settled] } }
        - type: object
          additionalProperties: false
          required: [kind]
          properties: { kind: { type: string, enum: [counterparty_unattributed] } }
        - type: object
          additionalProperties: false
          required: [kind]
          properties: { kind: { type: string, enum: [bucket_exceeded_bound] } }
        # G114 — a bound that was hit is recorded, never silently absorbed. The
        # subset-sum search was cut short by its step budget, so the engine does
        # not know whether an exact combination exists. Distinct from
        # `bucket_exceeded_bound`, a bucket REFUSED on a predicted cost, and from
        # `no_strategy_paired`, which would claim nothing matched.
        - type: object
          additionalProperties: false
          required: [kind]
          properties: { kind: { type: string, enum: [search_budget_exhausted] } }
        - type: object
          additionalProperties: false
          required: [kind, refusal]
          properties:
            kind: { type: string, enum: [reader_refused] }
            refusal: { $ref: '#/components/schemas/ReaderRefusalKind' }
        - type: object
          additionalProperties: false
          required: [kind]
          properties: { kind: { type: string, enum: [reader_found_no_candidate] } }
        - type: object
          additionalProperties: false
          required: [kind]
          properties: { kind: { type: string, enum: [control_total_unverified] } }
        # G227 — a read that came in under `FieldSpec.confidenceFloor` is HELD and
        # a person is asked, never refused: a refusal DISCARDS the value and the
        # floor's own declaration says the value must be shown. It folds into the
        # residue rather than onto a third channel because the residue already
        # carries a caller obligation — something must dispose of every entry —
        # and a held read dropped here inherits it. The arm carries no payload;
        # the field-level detail is on `ResidueEntry.heldReads`.
        - type: object
          additionalProperties: false
          required: [kind]
          properties: { kind: { type: string, enum: [read_held_below_floor] } }
        # 🛑 G291 — THE IDENTIFIER JOIN FOUND THIS ROW'S BUCKET AND THE MONEY
        # DECLINED, and this arm exists because `no_strategy_paired` was
        # absorbing it. The two are OPPOSITE claims: one says the engine looked
        # and found nothing to pair this with, the other says it found exactly
        # what to pair it with and the totals were outside the declared
        # tolerance. An operator handed the first audits their MATCHING RULES;
        # an operator handed the second changes ONE NUMBER. Same argument
        # `control_total_unverified` makes above about a different cause, and
        # the same G114 sentence `search_budget_exhausted` is annotated with:
        # a bound that was hit is recorded, never silently absorbed.
        #
        # ⚠️ `signedVarianceMinor` IS A DECIMAL STRING, for `Money.amountMinor`'s
        # reason two hundred lines up: it is `bigint` in the model (G286) and a
        # JSON number is an IEEE double that loses exactness above 2^53. It is
        # `leftTotal − rightTotal` over the WHOLE BUCKET, so on an N:M bucket
        # every member carries the same figure and it is the BUCKET's — a
        # bucket-grain fact reported on a row, exactly as C18 reports a
        # DOCUMENT-grain one.
        #
        # 🛑 THE RUN-LEVEL HALF OF G291 IS NOT PUBLISHED HERE AND THAT IS A
        # NAMED GAP. The model carries `SetReconciliationResult.toleranceDeclines`
        # — how many buckets declined and how wide each was — and `RunAccount`
        # below publishes NEITHER tolerance channel, `toleranceRefusals`
        # included. Publishing one alone would put *the tolerance was too tight*
        # on the wire while *the tolerance is nonsense* stayed invisible, which
        # is the two-findings-one-view defect G291 corrects, pointing the other
        # way. Both, or neither, and neither is what stands.
        - type: object
          additionalProperties: false
          required: [kind, signedVarianceMinor]
          properties:
            kind: { type: string, enum: [amount_tolerance_declined] }
            signedVarianceMinor: { type: string, pattern: '^-?[0-9]+$' }
      discriminator:
        propertyName: kind

    ItemSettlementKind:
      type: string
      description: |
        PINNED against `ItemSettlement`. ⚠️ THERE IS DELIBERATELY NO
        `over_allocated` MEMBER — over-allocation is a REFUSAL carrying both
        numbers, not a state something can be left in (§5.5).
      enum: [unallocated, partially_allocated, fully_allocated]

    ItemSettlement:
      type: object
      description: How much of this item was settled, and how much is still open.
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, residual]
          properties:
            kind: { type: string, enum: [unallocated] }
            residual: { $ref: '#/components/schemas/Money' }
        - type: object
          additionalProperties: false
          required: [kind, allocated, residual]
          properties:
            kind: { type: string, enum: [partially_allocated] }
            allocated: { $ref: '#/components/schemas/Money' }
            residual: { $ref: '#/components/schemas/Money' }
        - type: object
          additionalProperties: false
          required: [kind, allocated]
          properties:
            kind: { type: string, enum: [fully_allocated] }
            allocated: { $ref: '#/components/schemas/Money' }
      discriminator:
        propertyName: kind

    EngineAssignableDisposition:
      type: string
      description: |
        THE ENGINE MAY ONLY EVER ASSIGN THREE OF THE SIX DISPOSITIONS. PINNED
        against `EngineAssignableDisposition` with the `literal_union` reader,
        because it is a bare string-literal union with no discriminator.

        `timing_difference`, `in_transit` and `write_off` are finance judgements
        about WHY something failed to pair, and an engine that guessed one would
        be manufacturing a finance decision out of an absence. They are for
        residue rules and for a human. A wire offering all six would let a client
        read an engine verdict as a finance judgement.
      enum: [unidentified, error_left, error_right]

    ResidueEntry:
      type: object
      description: |
        ONE OPEN ROW — the product. Addressed by `ItemRef` at LINE grain, which
        is what an operator can act on.

        🛑 THIS ROW CARRIES NO LINK TO A FINDING, AND THE REASON CHANGED UNDER
        #247 [W-12]. It read: *"nothing converts one to the other — so a finding
        opened from a residue row could not carry its own audit trail (MG14)"*.
        **That is no longer true.** `Exception` still requires a match group and a
        rule at DOCUMENT grain while this is addressed at LINE grain — and G228's
        answer was a SECOND ROW TYPE rather than a widening, so `LineFinding`
        carries `(side, sourceDocumentId, lineIndex)` and synthesises no match
        group. A link is absent here because no operation serves one yet, not
        because the trail would be lost.

        ⚠️ THE FIELDS BELOW ARE WHY `LineFinding` CARRIES NO AMOUNT AND NO PATH.
        `settlement` and `heldReads` are on THIS row, read under this same
        capability; duplicating either onto the finding would mint a second
        representation of one number and would fail the model's own containment
        proof, since a `Money.currency` and a `FieldSegment` key are each a bare
        string.

        ⚠️ NO COUNTERPARTY PROSE. `AdmittedItem.untrustedDescription` is the one
        such field in the engine and it is named here precisely so nobody adds
        it: this row is rendered on an operator surface and logged (invariant 6).
      additionalProperties: false
      required: [side, ref, settlement, disposition, cause]
      properties:
        side: { $ref: '#/components/schemas/PopulationSide' }
        ref: { $ref: '#/components/schemas/ItemRef' }
        settlement:
          anyOf:
            - $ref: '#/components/schemas/ItemSettlement'
            - type: 'null'
          description: |
            🛑 REQUIRED AND NULLABLE, NEVER OPTIONAL. An item refused at
            admission has no settlement because it has no AMOUNT. The first
            version of this field was non-null and the refused case carried a
            zero in an empty currency — a FABRICATED zero sitting on the one row
            a finance user reads to find out what went wrong. Optional-and-absent
            would reintroduce the same ambiguity one level out.
        disposition: { $ref: '#/components/schemas/EngineAssignableDisposition' }
        cause: { $ref: '#/components/schemas/ResidueCause' }
        heldReads:
          type: array
          items: { $ref: '#/components/schemas/HeldRead' }
          description: |
            G227 — every read on this row that came in under its declared floor.

            🛑 REQUIRED AND POSSIBLY EMPTY, NEVER OPTIONAL. An empty array says
            every declared read on this row cleared its floor, or that no floor
            was declared for it; an absent field would say nothing at all, and an
            optional wire field would let a server omit the array under exactly
            the condition it exists to survive — the same argument `settlement`
            above makes about its null.

            ⚠️ IT IS NOT KEYED ON `cause`. A row whose cause is
            `control_total_unverified` may still carry a held read: the file's own
            account dominates the cause, and the person's question survives it.

    HeldRead:
      type: object
      description: |
        ONE READ THE ENGINE WOULD NOT TRUST, at field grain.

        A read whose extraction confidence came in under the floor the pack
        declared for that field. It is HELD, not refused: the item is admitted,
        kept out of every pass, and lands in the residue carrying this record —
        `FieldSpec.confidenceFloor` says the value is *asked about* rather than
        *guessed at*, and a refusal would discard it.

        🛑 NO EXTRACTED VALUE, EVER, AND THAT IS THE POINT RATHER THAN AN
        OMISSION. The whole reason a read is held is that a person will look at
        the value — which is exactly why it must be FETCHED under a
        classification rather than embedded here. This record is rendered on an
        operator surface and logged (invariant 6). `path` is the
        operator-declared `FieldSpec` path, never a key read out of the payload.

        ⚠️ `readConfidence` AND `floor` ARE IN `FieldSpec.confidenceFloor`'s OWN
        UNIT AND ARE NOT BASIS POINTS, against the habit of every other rate on
        this tier. Converting would mint a second representation of one declared
        number, which is the shape G111 refuses for money.
      additionalProperties: false
      required: [ref, path, readConfidence, floor]
      properties:
        ref: { $ref: '#/components/schemas/ItemRef' }
        path:
          $ref: '#/components/schemas/FieldPath'
          description: The declared `FieldSpec` path. Operator-authored, never counterparty content.
        readConfidence:
          anyOf:
            - type: number
            - type: 'null'
          description: |
            🛑 REQUIRED AND NULLABLE, NEVER OPTIONAL. Null means a floor WAS
            declared for this path and the extraction reported no confidence at
            all, so there was nothing to compare against it. That is HELD, not
            passed — fail-closed, the same direction as G106's
            unreadable-by-default. Optional-and-absent would make *no confidence
            reported* indistinguishable from *this field has no held read*.
        floor:
          type: number
          description: The floor this read missed, as the pack declared it.

    # ---- R13: what matched with what ----------------------------------------

    AllocationEnd:
      type: object
      description: |
        One end of an allocation: WHICH population and WHICH line. An address,
        never a key — see `ItemRef`.
      additionalProperties: false
      required: [side, ref]
      properties:
        side: { $ref: '#/components/schemas/PopulationSide' }
        ref: { $ref: '#/components/schemas/ItemRef' }

    PairingEvidenceKind:
      type: string
      description: |
        PINNED against `PairingEvidence` by the `pairing_evidence_kinds`
        wire-mirror pair. Seven arms; the `amount_sum_waterfall` arm is G105's
        JUDGEMENT about cash nobody could attribute and is recorded ON THE ROW,
        never inferred from an absence.
      enum:
        - exact_identifier
        - tolerant_identifier
        - amount_and_date
        - amount_sum_exact
        - amount_sum_waterfall
        - fuzzy_reference
        - reader_confirmed

    PairingEvidence:
      type: object
      description: |
        WHY a pair formed, as closed vocabulary and numbers. 🛑 NO ARM CARRIES
        THE VALUE THAT JOINED — R13. `on` is the DECLARED path.
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, on]
          properties:
            kind: { type: string, enum: [exact_identifier] }
            on: { $ref: '#/components/schemas/FieldPath' }
        - type: object
          additionalProperties: false
          required: [kind, on, signedVarianceMinor]
          properties:
            kind: { type: string, enum: [tolerant_identifier] }
            on: { $ref: '#/components/schemas/FieldPath' }
            signedVarianceMinor:
              type: string
              description: A decimal STRING, for `Money.amountMinor`'s reason.
        - type: object
          additionalProperties: false
          required: [kind, dayGap]
          properties:
            kind: { type: string, enum: [amount_and_date] }
            dayGap: { type: integer }
        - type: object
          additionalProperties: false
          required: [kind, memberCount]
          properties:
            kind: { type: string, enum: [amount_sum_exact] }
            memberCount: { type: integer }
        - type: object
          additionalProperties: false
          required: [kind, fellThroughFrom]
          properties:
            kind: { type: string, enum: [amount_sum_waterfall] }
            fellThroughFrom: { type: string, enum: [budget_exhausted, no_exact_solution] }
        - type: object
          additionalProperties: false
          required: [kind, similarityBasisPoints, metric]
          properties:
            kind: { type: string, enum: [fuzzy_reference] }
            similarityBasisPoints: { type: integer }
            metric: { type: string, enum: [levenshtein_ratio, jaro_winkler] }
        - type: object
          additionalProperties: false
          required: [kind, confidenceBasisPoints, modelEntryId]
          properties:
            kind: { type: string, enum: [reader_confirmed] }
            confidenceBasisPoints: { type: integer }
            modelEntryId: { type: string }
      discriminator:
        propertyName: kind

    RunAllocation:
      type: object
      description: |
        ONE ALLOCATION — value moved OUT of `from` and INTO `to`. R13. Ids and
        amounts only; see `listRunAllocations`.
      additionalProperties: false
      required: [from, to, amount, evidence]
      properties:
        from: { $ref: '#/components/schemas/AllocationEnd' }
        to: { $ref: '#/components/schemas/AllocationEnd' }
        amount: { $ref: '#/components/schemas/Money' }
        evidence: { $ref: '#/components/schemas/PairingEvidence' }

    # ---- G217: where the engine stopped looking ------------------------------

    PairingStrategyKind:
      type: string
      description: |
        THE FOUR PAIRING STRATEGIES, in the order `PairingStrategy` declares
        them. Pinned by the `pairing_strategy_kinds` wire-mirror pair.

        ⚠️ THE ONE PINNED ENGINE VOCABULARY DECLARED OUTSIDE `model/reconciliation.ts`.
        `PairingStrategy` lives in `model/domain.ts` because it is part of a
        DEFINITION — what an operator configured — rather than part of a run's
        output. `AmbiguityFinding.strategyKind` is a projection of it
        (`PairingStrategy['kind']`), so the pair reads the declaration and not
        the projection; a pair against a restatement compares a copy with itself.
      enum:
        - exact_identifier
        - amount_and_date
        - amount_sum
        - fuzzy_reference

    AmbiguityFinding:
      type: object
      description: |
        AN IDENTIFIER THAT JOINED MORE CANDIDATES THAN THE DECLARED CARDINALITY
        PERMITS — so BOTH sides went to the residue as `unidentified` rather than
        the engine picking one.

        🛑 IT ADDRESSES BY `ItemRef` AND NEVER BY KEY, and that is why it could
        reach the wire under G217 while the bucket arrays could not: an ADDRESS
        is actionable and a KEY is counterparty-authored text. The candidate
        COUNTS and the candidate ADDRESSES are stated separately and must agree —
        a finding whose count said two and whose refs named one dispositioned the
        unnamed row `no_strategy_paired`, which told an auditor the wrong thing.

        ⚠️ `on` IS THE ONE STRING-BEARING THING HERE AND IT IS DEFENSIBLE. A
        `FieldPath` is OPERATOR-authored addressing out of a `FieldSpec`, not a
        value out of a payload — the same argument `RefusedItem.path` makes.
        Required and NULLABLE: a strategy that joined on no declared path (
        `amount_and_date`) has nothing to name, and an absent field would make
        that indistinguishable from a path nobody recorded.
      additionalProperties: false
      required: [on, strategyKind, leftCandidates, rightCandidates, leftRefs, rightRefs]
      properties:
        on:
          oneOf:
            - $ref: '#/components/schemas/FieldPath'
            - type: 'null'
          description: The declared path the join ran on. Operator-authored, never counterparty content.
        strategyKind: { $ref: '#/components/schemas/PairingStrategyKind' }
        leftCandidates:
          type: integer
          description: How many left rows the identifier reached. Never a bucket key.
        rightCandidates:
          type: integer
          description: How many right rows it reached.
        leftRefs:
          type: array
          items: { $ref: '#/components/schemas/ItemRef' }
          description: EVERY left candidate, not the winner. The set is the finding.
        rightRefs:
          type: array
          items: { $ref: '#/components/schemas/ItemRef' }

    SearchBoundaryEntry:
      type: object
      description: |
        ONE PLACE A BOUND BIT — how much was in scope, and one address into it.

        🛑 `exampleRef` IS AN EXAMPLE AND NOT A MEMBERSHIP LIST. The full
        membership is on the residue, one row each, carrying
        `bucket_exceeded_bound` or `search_budget_exhausted`. This says how the
        search was SHAPED, which the residue cannot: rows spread across three
        refused buckets and rows all inside one look identical there.
      additionalProperties: false
      required: [itemCount, exampleRef]
      properties:
        itemCount:
          type: integer
          description: Open items in scope when the engine stopped. Never a size class.
        exampleRef: { $ref: '#/components/schemas/ItemRef' }

    SearchBoundary:
      type: object
      description: |
        WHERE THE ENGINE STOPPED LOOKING — G217.

        🛑 THE RULING: COUNTS PLUS `ItemRef`. NO BUCKET KEY REACHES THIS WIRE, IN
        ANY FORM — NOT VERBATIM AND NOT HASHED. A bucket key is
        counterparty-authored text by construction: it is whatever the join key
        held in a file somebody sent us. The model carried two
        `readonly (string | null)[]` arrays of them and no containment proof at
        all, which is how they got there.

        ⚠️ THE HASH ALTERNATIVE WAS REFUSED FOR A REASON THAT LOOKS SAFE. A
        digest of a LOW-CARDINALITY key — a date, a short code, an invoice prefix
        — is reversible by anyone who can guess the input space, and for a
        reconciliation join key that space is small and structured. A hash of a
        guessable value is an ENCODING, not a protection.

        WHAT IT COSTS, STATED PLAINLY: some debugging convenience. An operator
        who wants the key reads the row through the `ItemRef`, inside the tenant
        scope, through an operation that is authorised.

        🛑 THE THREE CHANNELS HAVE THREE DIFFERENT GRAINS AND THE NAMES SAY SO.
        The model field this replaced was called `exhaustedBuckets` and counted
        SEARCHES, once per cash item; a name that lies about its grain is a
        number somebody will divide by the wrong thing.
      additionalProperties: false
      required: [oversizedBuckets, exhaustedSearches, oversizedAmountBuckets]
      properties:
        oversizedBuckets:
          type: array
          items: { $ref: '#/components/schemas/SearchBoundaryEntry' }
          description: |
            One entry per BUCKET refused before any search ran, on a PREDICTED
            cost — `maxBucketSize`. Its rows carry `bucket_exceeded_bound`.
        exhaustedSearches:
          type: array
          items: { $ref: '#/components/schemas/SearchBoundaryEntry' }
          description: |
            G114 — one entry per SEARCH cut short by the step budget, an OBSERVED
            cost. `budget_exhausted` establishes only that the engine STOPPED
            LOOKING, which is a different fact from *no combination exists*; its
            rows carry `search_budget_exhausted`.
        oversizedAmountBuckets:
          type: array
          items: { $ref: '#/components/schemas/SearchBoundaryEntry' }
          description: |
            G115 — one entry per ROW whose fuzzy comparison was skipped because
            its exact-amount bucket was wider than `maxBucketSize`.

            🛑 THIS CHANNEL IS WHERE G115's REFUSAL BECAME VISIBLE FOR THE FIRST
            TIME. The engine accumulated these and read them nowhere: the comment
            at the accumulation site claimed they reused `bucket_exceeded_bound`,
            and they did not — that cause joins on the COUNTERPARTY key and these
            are AMOUNT keys, so the two sets never met. A bound that was hit was
            being silently absorbed, which is what G114 exists to forbid.

            ⚠️ THE RESIDUE CAUSE FOR THESE ROWS IS UNCHANGED — they still report
            `no_strategy_paired`, which is what a comparison that never ran
            leaves behind. Re-attributing them is a matching decision and was not
            this slice's to take.

    # ---- G228: the register's second row type -------------------------------

    LineFindingRefusalKind:
      type: string
      description: |
        WHY AN ADDRESS DID NOT BECOME A FINDING. Pinned by the
        `line_finding_refusal_kinds` wire-mirror pair. Neither arm carries the
        address it was given back.
      enum:
        - no_such_residue_row
        - residue_row_not_unique

    LineFindingRefusal:
      type: object
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, enum: [no_such_residue_row] }
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, enum: [residue_row_not_unique] }
      discriminator:
        propertyName: kind

    LineFinding:
      type: object
      description: |
        A FINDING AT LINE GRAIN — the register's SECOND ROW TYPE, G228.

        🛑 IT IS NOT AN `Exception` AND IT IS NOT A WIDENING OF ONE. An
        `Exception` requires `matchGroupId` and `ruleId` at DOCUMENT grain; a
        residue row is addressed by `(side, sourceDocumentId, lineIndex)` and has
        neither. Widening `Exception` reads as the smaller change and is the
        larger one: it changes the meaning of every existing `Exception` reader,
        and every document-grain consumer would silently need to aggregate. G74
        had already adjudicated the register as HETEROGENEOUS, so a second row
        type is the shape it was ruled to have.

        🛑 NO `matchGroupId` IS SYNTHESISED. There is nothing to derive one from,
        and minting one out of a source document id is a fabricated fact on the
        one row an auditor reads. `grain` is the discriminator that lets a
        heterogeneous register tell the two apart without inspecting fields.

        🛑 NO MONEY AND NO `FieldPath`, AND BOTH ARE FORCED. `Money.currency` and
        a `FieldSegment`'s key are each a bare string, so a settlement or a held
        read here fails the model's containment proof. The amount is on
        `ResidueEntry.settlement` and the paths on `ResidueEntry.heldReads`, both
        read through `listRunResidue` under the same capability; duplicating
        either would mint a second representation of one number as well.

        ⚠️ NO OPERATION PRODUCES THIS YET, DELIBERATELY. `/close/finding/:ref` is
        #213's and the model conversion is #247's; declaring the row here is what
        lets the wire vocabulary be pinned in the commit that mints it rather
        than after the drift a pair exists to catch. Do not read the absence of a
        path as an oversight and do not add one here.
      additionalProperties: false
      required: [grain, runId, side, ref, cause, disposition]
      properties:
        grain:
          type: string
          enum: [line]
          description: THE DISCRIMINATOR. The second type announces itself.
        runId: { type: string }
        side: { $ref: '#/components/schemas/PopulationSide' }
        ref: { $ref: '#/components/schemas/ItemRef' }
        cause: { $ref: '#/components/schemas/ResidueCause' }
        disposition: { $ref: '#/components/schemas/EngineAssignableDisposition' }

    # ---- the account envelope -----------------------------------------------

    RunRefusalKind:
      type: string
      description: |
        THE FIFTEEN NAMED REFUSALS. A refused run produced NOTHING and the
        refusal IS the output; before this existed a consumer got the bare word
        `failed`, which flattens fifteen distinct remedies into one.

        ✅ PINNED BY THE `run_refusal_kinds` WIRE-MIRROR PAIR. ⚠️ THIS PARAGRAPH
        SAID "HAND-MAINTAINED, AND THAT IS RECORDED RATHER THAN HIDDEN … every
        other vocabulary in this block is pinned by a wire-mirror pair. This one
        is not, because the checker's model-side reader harvests `kind: '…'` out
        of the NESTED union inside `tolerance_unit_disagrees` and reports
        SEVENTEEN members for a fifteen-arm union … That is W-1 (#186), OPEN."
        It is corrected rather than deleted, because a reader would have
        concluded this enum had no mechanical guard, and from 16 Aug 2026 it
        does. `unionKinds()` reads `kind` only at an arm's own object depth,
        returns fifteen, and the pair compares this enum against
        `SetReconciliationRefusal` in declaration order on every `npm run check`.
        `tests/contracts/engine-read-wire.test.mjs` group D is unchanged in
        substance and INVERTED in direction: it still asserts the fifteen by
        name, still asserts both phantoms absent, and still MEASURES the reader
        — it now fails if the count returns to seventeen rather than if it
        leaves it. Two controls, not one: the pair proves this enum and the
        model agree; the by-name list proves they agree on the RIGHT fifteen,
        which a pair alone cannot catch if a rename is applied to both sides.
      enum:
        - cross_tenant_documents
        - strategy_binding_count_mismatch
        - strategy_binding_kind_mismatch
        - normalisation_invalid
        - reader_candidate_cap_not_stated
        - similarity_max_chars_not_stated
        - subset_sum_bound_not_stated
        - admission_refusal_ceiling_not_stated
        - declared_unit_invalid
        - declared_units_disagree
        - tolerance_unit_disagrees
        - population_integrity_refused
        - admitted_item_key_collision
        - control_total_expected_but_absent
        - population_empty_and_not_expected

    RunRefusal:
      type: object
      description: |
        Why the run produced nothing. Every arm carries operands and ids and no
        counterparty text.
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind]
          properties: { kind: { type: string, enum: [cross_tenant_documents] } }
        - type: object
          additionalProperties: false
          required: [kind, expected, supplied]
          properties:
            kind: { type: string, enum: [strategy_binding_count_mismatch] }
            expected: { type: integer }
            supplied: { type: integer }
        - type: object
          additionalProperties: false
          required: [kind, index]
          properties:
            kind: { type: string, enum: [strategy_binding_kind_mismatch] }
            index: { type: integer }
        - type: object
          additionalProperties: false
          required: [kind, side, defects]
          properties:
            kind: { type: string, enum: [normalisation_invalid] }
            side: { $ref: '#/components/schemas/PopulationSide' }
            defects:
              type: array
              items: { $ref: '#/components/schemas/NormalisationDefect' }
        # An absent bound is a REFUSAL, never a default — the same posture as
        # G100's deny-on-NULL and G106's unreadable-by-default.
        - type: object
          additionalProperties: false
          required: [kind]
          properties: { kind: { type: string, enum: [reader_candidate_cap_not_stated] } }
        - type: object
          additionalProperties: false
          required: [kind]
          properties: { kind: { type: string, enum: [similarity_max_chars_not_stated] } }
        - type: object
          additionalProperties: false
          required: [kind]
          properties: { kind: { type: string, enum: [subset_sum_bound_not_stated] } }
        # C13. The conformance floor was not stated, or was stated as an
        # off-switch. ⚠️ It carries NO number, unlike the rate defect: the
        # rejected value is configuration the caller already holds.
        - type: object
          additionalProperties: false
          required: [kind]
          properties: { kind: { type: string, enum: [admission_refusal_ceiling_not_stated] } }
        - type: object
          additionalProperties: false
          required: [kind, side, refusal]
          properties:
            kind: { type: string, enum: [declared_unit_invalid] }
            side: { $ref: '#/components/schemas/PopulationSide' }
            refusal: { $ref: '#/components/schemas/MoneyRefusal' }
        - type: object
          additionalProperties: false
          required: [kind, refusal]
          properties:
            kind: { type: string, enum: [declared_units_disagree] }
            refusal: { $ref: '#/components/schemas/MoneyRefusal' }
        - type: object
          additionalProperties: false
          required: [kind, tolerance, refusal]
          properties:
            kind: { type: string, enum: [tolerance_unit_disagrees] }
            tolerance:
              description: |
                WHICH tolerance, because the fix differs and only one of the two
                routes has an index to give. ⚠️ THIS NESTED UNION WAS THE SOURCE
                OF #186's TWO PHANTOMS — its `kind` values are `pairing` and
                `strategy_binding`, which the wire-mirror's reader USED TO
                harvest as if they were arms of the OUTER union. #186 landed on
                16 Aug 2026 and it no longer does. **The prohibition is
                unchanged and is the durable half of this note: they are not
                arms of `SetReconciliationRefusal`, and `RunRefusalKind` above
                must never contain them.** `engine-read-wire.test.mjs` D1 and D2
                both assert their absence by name.
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [kind]
                  properties: { kind: { type: string, enum: [pairing] } }
                - type: object
                  additionalProperties: false
                  required: [kind, index]
                  properties:
                    kind: { type: string, enum: [strategy_binding] }
                    index: { type: integer }
              discriminator:
                propertyName: kind
            refusal: { $ref: '#/components/schemas/MoneyRefusal' }
        - type: object
          additionalProperties: false
          required: [kind, side, defects]
          properties:
            kind: { type: string, enum: [population_integrity_refused] }
            side: { $ref: '#/components/schemas/PopulationSide' }
            defects:
              type: array
              items: { $ref: '#/components/schemas/PopulationDefect' }
        - type: object
          additionalProperties: false
          required: [kind, side, ref]
          properties:
            kind: { type: string, enum: [admitted_item_key_collision] }
            side: { $ref: '#/components/schemas/PopulationSide' }
            ref: { $ref: '#/components/schemas/ItemRef' }
        # C18's ONE refusing arm: a format declared to carry a trailer arrived
        # without one, which is exactly what truncation looks like.
        - type: object
          additionalProperties: false
          required: [kind, side, sourceDocumentId]
          properties:
            kind: { type: string, enum: [control_total_expected_but_absent] }
            side: { $ref: '#/components/schemas/PopulationSide' }
            sourceDocumentId: { type: string }
        # O-15. ⚠️ It carries the side and nothing else, and the absence is a
        # statement: every count it could carry is zero by the condition that
        # produced it, and a field fixed at zero is a field a reader would try to
        # read.
        - type: object
          additionalProperties: false
          required: [kind, side]
          properties:
            kind: { type: string, enum: [population_empty_and_not_expected] }
            side: { $ref: '#/components/schemas/PopulationSide' }
      discriminator:
        propertyName: kind

    EngineMeter:
      type: string
      description: |
        THE FOUR METERS THIS ENGINE CAN PRODUCE A FACT FOR. Mirrors
        `EngineMeter` (model/reconciliation.ts) and PINNED: the `engine_meter`
        pair in tools/check-wire-mirror.mjs compares this list element-for-element
        against the model.

        ⚠️ THIS IS NOT `Meter`, AND THE TWO MUST NOT BE MERGED. `Meter` — on the
        foundation and control-plane tiers — is the BILLING vocabulary, eight
        values, pinned by its own `meters` pair. These four are a STRICT SUBSET
        of those eight: the other four have other producers, and this engine is
        not one of them. The relation is checked as a subset and never as an
        equality by `tests/contracts/meter-fact-wire.test.mjs` B, because a
        control demanding equality would go red on the day one of those other
        producers shipped rather than on the day a real drift arrived.

        `input_tokens` and `output_tokens` had NO producer anywhere before this
        engine; the other two are counted, not reported by a provider.
      enum: [input_tokens, output_tokens, reconciliations_run, exceptions_raised]

    # 🛑 THERE IS NO UNIT OF MONEY ON `MeterFact` BELOW, AND ITS ABSENCE IS
    # INVARIANT 5 RATHER THAN A DESIGN CHOICE. *Money is always derived.*
    # `UsageRecord` is immutable and unpriced, which is why `metering` is its own
    # resource class with NO WRITE MODE and cannot live in `commercial`, whose
    # defining rule is that a partner may read it. A raw usage record is volume
    # in the clear. Anything that divides, multiplies or totals these facts is a
    # derivation and belongs where derivations live — not on this schema, and not
    # on the run's own account. The engine's own header controls record that
    # `MeterPrice`, `PriceTier`, `RateCard` and `RatedTotal` are not imported and
    # that `ModelCatalogEntry.cost` is not read.
    #
    # ⚠️ THIS ARGUMENT IS A COMMENT AND NOT A `description:`, DELIBERATELY, AND
    # THE REASON IS THE CONTROL RATHER THAN TASTE. Both #202's acceptance grep
    # and `tests/contracts/meter-fact-wire.test.mjs` C scan the minted surface
    # for `price|rate|cost|amount|currency` and demand zero hits — and a
    # paragraph that REFUSES a price has to NAME one, so writing the refusal into
    # the schema body would make the control red against its own reasoning and
    # teach the next reader to weaken it. A comment is outside the parsed
    # document a consumer receives and outside the awk range that starts at
    # `MeterFact:`, so the argument survives in the file while the surface stays
    # clean. C's subject is the PARSED schema on purpose: a price reaches a
    # consumer as a FIELD or a `$ref`, never as a word in a paragraph.
    MeterFact:
      type: object
      description: |
        ONE MEASURED QUANTITY, AND NEVER WHAT IT IS WORTH. Mirrors `MeterFact`
        (model/reconciliation.ts). See the comment block above this schema for
        why nothing here values what it measures.

        ⚠️ THE FOUR FIELDS ARE ALL UNCONDITIONAL. The model declares four
        readonly members and no optional one. `modelEntryId` is NULLABLE and not
        OPTIONAL: "null for non-inference meters" is a value a reader can act on,
        and an absent key is a different claim.
      additionalProperties: false
      required: [meter, quantity, idempotencyKey, modelEntryId]
      properties:
        meter: { $ref: '#/components/schemas/EngineMeter' }
        quantity:
          type: integer
          minimum: 0
          description: |
            HOW MUCH, AND NOTHING ABOUT WHAT IT IS WORTH. Provider-reported for
            the two token meters; counted by the engine for the other two.
        idempotencyKey:
          type: string
          description: |
            THE DEDUP KEY, AND IT IS WHAT MAKES THE FACT REPLAYABLE. It is
            `${runId}#${meter}` or `${providerRequestId}#${meter}`. Never bare:
            a key with no meter suffix cannot tell two facts about one run apart,
            and a replay would fold them into one.

            🛑 G30 IS OPEN AND THIS DECLARATION DOES NOT SETTLE IT. Whether the
            outbox uniqueness grain is `(idempotencyKey)` or
            `(idempotencyKey, meter)` is an unresolved question, named here
            rather than answered by silence.
            `db/migrations/0001_tenancy_and_rls.sql` omits the outbox columns for
            exactly this reason — folding a grain in under schedule pressure
            would settle a live ruling by accident. This slice mints a READ shape
            and no outbox table. A consumer must not assume either grain.
        modelEntryId:
          type: [string, 'null']
          description: |
            WHICH CATALOGUE ROW INCURRED IT — `ModelCatalogEntryId`, the id the
            catalogue mints. NULL for the two meters that involve no model call
            at all, `reconciliations_run` and `exceptions_raised`.

            ⚠️ INVARIANT 7 — RESIDENCY SURVIVES INFERENCE — AND WHERE THE CHECK
            LIVES. `resolveModel()` (model/catalog.ts) is the ONLY executable
            residency enforcement in this codebase, and THIS READ IS NOT IT.
            Carrying a catalogue id here must not be read as evidence that a
            residency check was made; it records which row was used, so that a
            check made elsewhere has something to address. Rule R1 keeps an
            identifier bare only where AWS mints it — the catalogue mints this
            one, so it stays the catalogue's id and is branded in the model.

    DocumentTrailerVerdict:
      type: object
      description: |
        G236 — WHAT THE COMPARISON CONCLUDED ABOUT ONE FILE.

        🛑 IT RE-DECLARES NONE OF C18's SIX COMPARISON ARMS. The disagreeing case
        carries `PopulationDefect` verbatim; spelling `declaredCount` and
        `documentRowCount` again here would be two vocabularies for one finding,
        drifting the first time an arm gained a field (§5.3). The same argument
        `PostconditionFailure` and `CompletenessFinding` already make.
      oneOf:
        # NOT the same as `agreed`, and collapsing the two is the exact
        # conflation G236 forbids one level up: a file that said nothing is not a
        # file that vouched for itself.
        - type: object
          additionalProperties: false
          required: [kind]
          properties: { kind: { type: string, enum: [nothing_to_check] } }
        # THE ARM THE RULING EXISTS FOR. Before G236 this row did not exist
        # anywhere: a trailer that was MET produced no defect and therefore
        # appeared in no channel.
        - type: object
          additionalProperties: false
          required: [kind]
          properties: { kind: { type: string, enum: [agreed] } }
        - type: object
          additionalProperties: false
          required: [kind, defects]
          properties:
            kind: { type: string, enum: [reported] }
            defects:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/PopulationDefect' }
        # C17 fired somewhere on this side, so no per-document comparison ran.
        # A NAMED STATE rather than an omitted row, for G236's own reason: an
        # address collision makes every count on the side wrong, so `agreed`
        # here would be a MANUFACTURED met trailer — worse than the silence the
        # ruling is fixing — and dropping the row would be the silence itself.
        # Unreachable on a produced run: `duplicate_item_address` refuses.
        - type: object
          additionalProperties: false
          required: [kind]
          properties: { kind: { type: string, enum: [not_evaluated_address_collision] } }
      discriminator:
        propertyName: kind

    RunDocumentAccount:
      type: object
      description: |
        G236 — ONE FILE'S ACCOUNT OF ITSELF, emitted for every document on every
        successful run whatever the comparison concluded.

        🛑 THE MET ROWS ARE WHY THIS SCHEMA EXISTS. C18 records a control-total
        DISAGREEMENT as a `PopulationDefect`; a document whose declared count and
        declared total both MATCH produced no defect and appeared in no channel,
        so **a met trailer that produces no row was indistinguishable from a file
        that declared nothing** — the first is evidence, the second is absence.
        G114: *a bound that was hit is recorded, never silently absorbed.*

        🛑 A `sourceDocumentId` AND NEVER A FILENAME. A filename is
        counterparty-controlled and this record is rendered and logged
        (invariant 6).

        🛑 MINOR UNITS AND AN EXPONENT, NEVER A `Money`. The exponent is carried
        because this record is emitted PER DOCUMENT into a multi-document array,
        where *one run is one unit* is not a property anybody may lean on — the
        same reason `declared_control_total_disagrees` carries the pair.

        ⚠️ `presented` AND `admitted + refused` ARE INDEPENDENT, which is what
        makes `presented === admitted + refused` a property a caller can CHECK
        rather than a tautology it is handed. `AdmissionRate` states the same
        property at side grain.
      additionalProperties: false
      required:
        - side
        - sourceDocumentId
        - trailer
        - declaredLineCount
        - declaredMinor
        - declaredExponent
        - presented
        - admitted
        - refused
        - verdict
      properties:
        side: { $ref: '#/components/schemas/PopulationSide' }
        sourceDocumentId: { type: string }
        trailer:
          type: string
          enum: [declared, not_declared_by_format, expected_but_absent]
          description: |
            The PARSER's arm, verbatim. `expected_but_absent` is unreachable on a
            produced run — it refuses in the gate, before admission — and is
            declared here rather than excluded so that a new arm is a decision
            somebody has to take rather than a silent widening.
        declaredLineCount:
          anyOf: [{ type: integer }, { type: 'null' }]
          description: Null where no trailer was found, or one was found declaring no count.
        declaredMinor:
          # 🛑 A DECIMAL STRING SINCE 19 Sep 2026 — G286. It is a `Money`'s
          # minor units. `null` where no trailer declared a total.
          anyOf: [{ type: string, pattern: '^-?[0-9]+$' }, { type: 'null' }]
        declaredExponent:
          anyOf: [{ type: integer }, { type: 'null' }]
        presented:
          type: integer
          description: Rows this DOCUMENT presented. Independent of the admission fold.
        admitted: { type: integer }
        refused: { type: integer }
        verdict: { $ref: '#/components/schemas/DocumentTrailerVerdict' }

    RunEngineAccount:
      type: object
      description: |
        THE RUN'S OWN ACCOUNT OF ITSELF — returned by `getRunAccount`.

        ⚠️ THE MODEL DISCRIMINATES ON A BOOLEAN AND THIS DISCRIMINATES ON A
        STRING, AND THE DEPARTURE IS RECORDED RATHER THAN MADE SILENTLY.
        `SetReconciliationOutcome` is `{ ok: true; result } | { ok: false;
        refusal }`; OpenAPI 3.1 discriminators are string-valued, and the house
        idiom in this file is already `RunAdmission.outcome:
        admitted | deduplicated`. Two spellings of one concept inside one
        document would be §5.3, so this follows the file's idiom and says so
        here rather than inventing a second one.

        🛑 THE REFUSED ARM CANNOT CARRY A LEDGER, AND THAT MIRRORS THE MODEL
        RATHER THAN TIDYING IT. `SetReconciliationOutcome`'s `ok: false` arm
        carries no residue, no `refusedAtAdmission` and no ambiguities — a
        refused run produced nothing, and the refusal IS the output. Declaring
        those properties on it "just in case" would make an invalid state legal
        (§5.5).
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - outcome
            - terminalStatus
            - admissionRates
            - settlementTallies
            - openResidual
            - documentAccounts
            - refusedAtAdmission
            - ambiguities
            - searchBoundary
            - postconditions
            - completeness
            - meterFacts
          properties:
            outcome: { type: string, enum: [produced] }
            terminalStatus:
              type: string
              enum: [completed, failed, incomplete]
              description: |
                THE JOIN, STATED VERBATIM. Soundness outranks completeness:
                `failed` means do-not-persist, `incomplete` means
                persist-and-tell-somebody, and a run that is both must report the
                stronger instruction because acting on the weaker one persists an
                unsound ledger. Mirrors `TerminalRunStatus`, the three states a
                FINISHED run may be in — `queued` and `running` are not reachable
                here, which is a statement about the input rather than an
                omission.
            admissionRates:
              type: array
              minItems: 2
              maxItems: 2
              items: { $ref: '#/components/schemas/AdmissionRate' }
              description: |
                One entry for `left` and one for `right`, in that order, on every
                successful run. REQUIRED AND NOT OPTIONAL: the model records it
                unconditionally so that a permissive ceiling suppresses the
                refusal and never the evidence, and an optional wire field would
                let a server omit it under exactly the condition it exists to
                survive.
            settlementTallies:
              type: array
              minItems: 2
              maxItems: 2
              items: { $ref: '#/components/schemas/SettlementTally' }
              description: |
                G3541, 3 Oct 2026 — HOW MANY ADMITTED ITEMS THE ENGINE SETTLED,
                HOW MANY IT LEFT OPEN, AND WHAT THE OPEN ONES ARE STILL WORTH, per
                side, `left` then `right`. The C1 Close surface draws the first
                as `Matched` and the third as `In variance`.

                🛑 DERIVED, NOT STORED. It is read off `admissionRates` and the
                residue this same account already holds — every admitted item
                not fully allocated sits in the residue exactly once (RESIDUE
                COMPLETENESS, the engine's own post-condition) — so a stored
                copy could only disagree with them. A run that broke that
                post-condition says so in `postconditions`, beside this.

                REQUIRED AND NOT OPTIONAL, for `admissionRates`' reason.
            openResidual:
              $ref: '#/components/schemas/UnsettledValue'
              description: |
                G3804, 4 Oct 2026 — *"IN VARIANCE"*, AS THE OWNER DEFINED IT.
                THE OWNER'S RULING ON C3-02/C3-09, quoted: *"Store a signed
                delta: the engine records direction (over/under); the column
                shows sign, totals net correctly, 'In variance' is defined as
                the open residual."*

                The LEFT side's unsettled total MINUS the RIGHT side's — the
                engine's own sign convention (`over` = left exceeds right), so
                `total.amountMinor` MAY BE NEGATIVE. `nothing_open` when neither
                side has anything open; `mixed_units` when the two sides'
                residuals are not one unit (there is no FX on this path).

                🛑 IT IS THE FIGURE THE REGISTER'S SIGNED `variance` COLUMN
                TOTALS TO FOR THE SAME RUN (`listExceptions?runId=`), whenever
                every open item raises one exception and each declined bucket
                raises once — the demo seed's shape, proven by
                `tests/db/staging-demo-data.test.ts` §5. A residue entry whose
                (side, cause) has no declared rule raises nothing (G3745) and is
                then in this figure and not in the column; the difference is
                exactly what was withheld.

                DERIVED from `settlementTallies` at read time and stored nowhere.
                The C1 Close surface draws it as `In variance`; the per-side
                `unsettled` totals beside it are unchanged.
            documentAccounts:
              type: array
              items: { $ref: '#/components/schemas/RunDocumentAccount' }
              description: |
                G236. One entry per document, left's then right's, each in
                supplied order, on every successful run — INCLUDING documents
                whose trailer was met and documents whose format declares none.
                REQUIRED AND NOT OPTIONAL, for `admissionRates`' reason one grain
                down: the model records it unconditionally so that a check which
                only speaks when it fails cannot come back through the wire.

                This is the channel `design/routes/close.html`'s *What each file
                said about itself* is drawn from; before G236 its `done` rows
                could not be built from the engine's result at all.
            refusedAtAdmission:
              type: array
              items: { $ref: '#/components/schemas/RefusedItem' }
              description: |
                One entry per refused row, with its side, its `ItemRef`, the
                declared path that refused and the reason admission gave.
            ambiguities:
              type: array
              items: { $ref: '#/components/schemas/AmbiguityFinding' }
              description: |
                G217 — WHERE AN IDENTIFIER NAMED MORE THAN ONE ROW, addressed by
                `ItemRef` on both sides. Without this an operator reading
                `no_strategy_paired` on a residue row cannot tell *nothing
                matched* from *two things matched and the engine would not
                choose*, and only the second is a duplicate-invoice finding.

                REQUIRED AND POSSIBLY EMPTY, for `admissionRates`' reason: a
                channel that only speaks when it fired cannot be told from one
                nobody wired up.
            searchBoundary:
              $ref: '#/components/schemas/SearchBoundary'
              description: |
                G217 — WHERE THE ENGINE STOPPED LOOKING, as counts plus `ItemRef`
                on three channels. See the schema for the ruling and for why the
                hash alternative was refused.

                🛑 IT IS THE DISTINCTION G114 WAS TAKEN TO PRESERVE. `no_strategy_paired`
                on a residue row means the engine looked and found nothing;
                `search_budget_exhausted` means it stopped looking. A consumer
                that cannot separate the two is reading a bound as a verdict.
            postconditions:
              type: array
              items: { $ref: '#/components/schemas/PostconditionFailure' }
              description: |
                In the order the engine emitted them — a shredded trailer
                produces a count disagreement AND a total disagreement, and the
                two are independent findings about the same file. Read
                `postconditionProperty` before acting on the length of this list.
            completeness:
              type: array
              items: { $ref: '#/components/schemas/CompletenessFinding' }
              description: |
                EMPTY ON A WHOLE RUN, which is what makes the state worth having:
                a channel that fired on everything would be routed around within
                a week. See `Run.completeness` for the arrivals boundary, which
                binds this list identically.
            # ⚠️ THE INVARIANT-5 ARGUMENT FOR THIS CHANNEL IS THE COMMENT BLOCK
            # ABOVE THE `MeterFact` SCHEMA, not the description below, and for
            # the same reason: this channel is part of the minted surface that
            # `tests/contracts/meter-fact-wire.test.mjs` C scans for
            # `price|rate|cost|amount|currency`, so a description that named what
            # it refuses would turn the control red against its own reasoning.
            meterFacts:
              type: array
              items: { $ref: '#/components/schemas/MeterFact' }
              description: |
                WHAT THE RUN SPENT, AS FOUR METERS AND NOTHING ABOUT WHAT THEY
                ARE WORTH — the sixth channel, added under G237.

                🛑 IT FOLDS ONTO THIS ACCOUNT AND MINTS NOTHING. A run's meters
                are facts about ONE RUN, and this is already that run's own
                account: it is already declared, already gated
                `x-capability: admit_source`, and already the read a consumer
                ⚠️ (`view_exception` since 4 Oct 2026 — G3801, the owner's C3-06
                ruling. 🛑 THAT PUTS THESE METERS INSIDE
                `PARTNER_CAPABILITY_MASK`'s reach, the exposure §11.9a minted
                `view_metering` to keep out, and it is NAMED AS A CONSEQUENCE OF
                THE RULING rather than hidden — G3802.)
                makes. So there is no seventy-third operation here, no fortieth
                capability, and no second thing to authorise.

                THE ALTERNATIVE IS PRESERVED AS REJECTED, because it is what
                #202 was written expecting: a standalone meters read gated
                `view_metering`, on the argument that `metering` is its own
                resource class and a tenant-data verb must not reach it. It was
                refused because folding onto an already-gated run account
                achieves the same containment without the extra operation. Do
                not read the absence of a `/runs/{runId}/meters` path as an
                oversight, and do not add one.

                UNCONDITIONAL, like the five channels above it and for the same
                reason: an optional field lets a server omit the evidence under
                exactly the condition it exists to survive. EMPTY IS LEGAL and
                is not the same claim as absent — a run that made no model call
                and raised nothing has four meters' worth of nothing to report.

                🛑 AND IT IS ABSENT FROM THE `refused` ARM. A refused run
                produced nothing and the refusal IS the output; declaring a meter
                channel there would make an invalid state legal (§5.5).
            postconditionProperty:
              allOf:
                - $ref: '#/components/schemas/PostconditionProperty'
              description: |
                The soundness/completeness declaration, published beside the list
                it classifies so a client switches on it instead of re-deriving
                the split from an arm's name.
        - type: object
          additionalProperties: false
          required: [outcome, refusal]
          properties:
            outcome: { type: string, enum: [refused] }
            refusal: { $ref: '#/components/schemas/RunRefusal' }
      discriminator:
        propertyName: outcome

    # ---------------------------------------------------------- C6

    ExceptionQueueRow:
      type: object
      description: |
        EVERY FIELD HERE IS A DENORMALISED COLUMN OR A KEY, AND THAT IS THE
        WHOLE DESIGN. `domain`, `definitionId`, `ruleLabel`, `severityRank` and
        `valueAtRisk` are copies. They are derived and never authoritative —
        the live relations remain the source of truth — but they are what makes
        the primary read surface a single-table query at a hundred thousand
        open rows.

        `costCentre` and `legalEntity` joined them on 7 Aug 2026 and are a
        DIFFERENT KIND OF COLUMN. The five above are convenience; these two are
        the attributes `AssignmentScope.costCentres` and `.legalEntities`
        narrow on. Until they existed, both dimensions matched every row — the
        narrowing typechecked, rendered in an access review, and did nothing.
        A server filtering this endpoint by an assignment's scope MUST filter on
        these two columns, and a null value must never satisfy a narrowing.

        NOTE WHAT IS ABSENT: no `explanation.observed[]`, no provenance, no
        `confidence`. A triage decision needs the summary and the columns. The
        evidence lives one click away, and the click is the point.
      additionalProperties: false
      required:
        - exceptionId
        - domain
        - definitionId
        - ruleLabel
        - severity
        - severityRank
        - valueAtRisk
        - costCentre
        - legalEntity
        - status
        - assignedTo
        - assignedToName
        - assignedToFormerMember
        - raisedAt
        - summary
        - carriedForwardFrom
        - runId
        - variance
      properties:
        exceptionId: { type: string }
        domain: { $ref: '#/components/schemas/DomainKey' }
        definitionId: { type: string }
        definitionName: { type: string }
        ruleLabel:
          type: string
          description: Pinned at `ruleVersion`. A rule renamed since does not rewrite this.
        severity: { $ref: '#/components/schemas/Severity' }
        severityRank:
          type: integer
          description: |
            The ordinal exists because ORDER BY on the string union sorts
            critical, high, low, medium — alphabetically, and therefore
            wrongly, in a way that looks plausible enough to ship.
        valueAtRisk:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Null where the finding is not monetary. Sortable without parsing.
        variance:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: |
            🛑 SIGNED IN FACT SINCE 4 Oct 2026 — G3804, THE OWNER'S RULING ON
            C3-02: *"the column shows sign, totals net correctly"*. Until then
            this said "SIGNED" and published the MAGNITUDE, and a client
            prefixed `+` to every under-variance. `amountMinor` is now
            NEGATIVE when `Explanation.delta.direction` is `under`, and a
            non-zero money delta with NO recorded direction (a row stored
            before `db/migrations/0510`) publishes `null` here rather than a
            guessed sign. For an open item with no counterpart the variance is
            the item's whole open residual, `over` on the left and `under` on
            the right, so the column totals to `getRunAccount`'s
            `openResidual` for the same run (see there).

            THE ORIGINAL TEXT FOLLOWS, and its first clause is now true:
            G3542, 3 Oct 2026 — THE LINE'S SIGNED MONEY VARIANCE: the
            `absolute` of `Explanation.delta` when that delta is `money`, the
            same value `getException` already publishes, copied onto the row
            from the same stored columns so the register's Variance column is
            one read rather than one per row.

            REQUIRED AND NULLABLE. `null` means THIS LINE HAS NO MONEY
            VARIANCE TO SHOW: its delta is not monetary or is absent, OR its
            money delta was taken ACROSS CURRENCIES (it carries an FX
            conversion). The second is a REFUSAL, not an absence — there is no
            FX on this path (`FxConversion` is dropped for v1), and publishing
            the converted figure in a column a reader totals would be a
            conversion this surface cannot account for. The converted delta is
            still on `getException`, beside the rate it used.
        costCentre:
          type: [string, 'null']
          description: |
            Resolved at raise time from `TagPolicy.chargebackKey`. Opaque
            customer text — the platform knows the key name and nothing about
            the org chart behind it.

            Null means untagged, and untagged is OUTSIDE every cost-centre-scoped
            assignment rather than inside all of them.
        legalEntity:
          type: [string, 'null']
          description: |
            Resolved at raise time from `TagPolicy.legalEntityKey`. Opaque
            customer text. Null is the common single-entity case; the same
            null rule as `costCentre` applies.
        status: { $ref: '#/components/schemas/ExceptionStatus' }
        assignedTo: { type: [string, 'null'] }
        assignedToName:
          type: [string, 'null']
          description: |
            G3886, 4 Oct 2026 — THE ASSIGNEE'S `display_name`, AS STORED, verbatim and parsed by
            nothing (D6-9: drawn as a text node). THE OWNER'S C3-05 RULING, quoted:
            *"Narrow name-only read: a policy letting a tenant member read
            display_name (only) of people who share their tenant membership; widen
            G447's directory rule for that one column."* Read through
            `tenant.co_member_name` (`db/migrations/0520`), so it is `null` when the
            person is not a LIVE co-member of the reader (a lapsed member, another
            tenant's person, a reader holding no membership) and when the
            id itself is `null`. REQUIRED AND NULLABLE: `null` is a refusal to name,
            never an empty name.
        assignedToFormerMember:
          type: boolean
          description: |
            G4021, 4 Oct 2026 — WHETHER THE ASSIGNEE IS A FORMER MEMBER OF THIS TENANT: they
            held a membership here and hold no LIVE one now. Derived from
            `tenant.membership` alone (G447: *"a tenant can read WHO BELONGS and cannot
            read WHO THEY ARE"*), so it NAMES NOBODY and widens nothing the owner's
            C3-05 ruling decided. It exists because `assignedToName` is `null` for a
            lapsed member AND for a reader holding no membership, and a client that
            cannot tell the two apart draws a lapsed person as "a colleague". `true`
            implies `assignedToName` is `null`. `false` when the id is `null`, when the
            person holds a live membership, and when they NEVER held one (a partner
            under a grant) — that last is not a former member, and its word is the
            owner's to choose (G4022). REQUIRED.
        raisedAt: { type: string, format: date-time }
        summary:
          type: [string, 'null']
          description: |
            `Explanation.summary` only. The one prose field on a queue row, and
            it is directional — "the invoice disagrees with the purchase order".
            ⚠️ NULLABLE SINCE G3748 (4 Oct 2026), applying R-D (the owner's):
            *"Store typed facts only … the sentence is composed where it is
            displayed."* An exception the ENGINE raises stores no sentence
            (`db/migrations/0500` §2 makes that a policy), so `null` means NO
            SENTENCE WAS AUTHORED — never an empty one — and the client composes
            its line from the row's typed facts (`ruleLabel`, `valueAtRisk`).
        carriedForwardFrom:
          type: [string, 'null']
          description: |
            Cross-run identity. Non-null means this exception survived a prior
            period and is the SAME exception, not a new one. March's exception
            is still March's in April.
        runId:
          type: [string, 'null']
          description: |
            G3622, 3 Oct 2026 — THE RUN THAT RAISED THIS EXCEPTION
            (`db/migrations/0480`, the owner's ruling G3621: *"exceptions
            record the run that raised them"*). REQUIRED AND NULLABLE: `null`
            means NOT RECORDED — a row stored before the column existed — and
            never "no run" and never a guessed one. A run-scoped read
            (`runId`, `periodId`) does not return a `null` row.
        hasProposal:
          type: boolean
          description: |
            Whether a disposition is already proposed. In finance this is often
            true and in KYC it is not, because autonomy defaults to `none`
            there — which is why the two queues feel materially different and
            the training has to say so.
        awaitingReply:
          type: boolean
          description: |
            A procedure `await` is parked on a correspondence thread. The
            exception stays open and visible rather than disappearing into
            someone's inbox.

    ObservedValue:
      type: object
      description: |
        A captured value with WHERE IT CAME FROM. `dataClass` is carried here
        and not merely on the source document, because an explanation OUTLIVES
        the document it was drawn from — `RetentionPolicy.days.exception` is
        deliberately longer than `days.source_document`, so purging the source
        does not remove this copy. Carrying the class is what lets the subject
        index find and erase it.

        (Named `exceptionDays` and `sourceDocumentDays` until 7 Aug 2026, when
        `RetentionPolicy` was re-keyed on `RetentionClass`. Same two windows.)
      additionalProperties: false
      required: [slot, path, scalar, lineIndex, sourceDocumentId, provenance, dataClass]
      properties:
        slot: { type: string }
        path: { $ref: '#/components/schemas/FieldPath' }
        scalar: { $ref: '#/components/schemas/ExtractedScalar' }
        lineIndex: { type: [integer, 'null'] }
        sourceDocumentId: { type: string }
        provenance: { $ref: '#/components/schemas/Provenance' }
        dataClass: { $ref: '#/components/schemas/DataClass' }

    Delta:
      type: object
      description: |
        Discriminated by `kind`. A `money` delta carries its currency, which is
        what makes `autoResolveValueCeiling` enforceable at all.

        G3803, 4 Oct 2026 — A `money` DELTA CARRIES `direction` (`over` |
        `under` | `null`), applying THE OWNER'S RULING ON C3-02: *"Store a
        signed delta: the engine records direction (over/under) …"*.
        `absolute` STAYS A MAGNITUDE. `over` is the LEFT side exceeding the
        RIGHT (the engine's `signedVarianceMinor = leftTotal − rightTotal`);
        `null` is a zero magnitude (zero has no sign) or a row stored before
        `db/migrations/0510` (not recorded) — never a guessed `over`.
      additionalProperties: true
      required: [kind]
      properties:
        kind:
          type: string
          enum: [numeric, money, temporal, textual]
        direction:
          type: [string, 'null']
          enum: [over, under, null]
          description: |
            `money` arm only. See above. A client signs `absolute` with it:
            `under` is negative.

    Explanation:
      type: object
      description: |
        STRUCTURED, NOT PROSE — so provenance links render and deltas
        aggregate. Non-optional on Exception: PRODUCT.md Principle 1 says an
        exception without its explanation has lost the product's point, and the
        model enforces that in the type system rather than in a convention.
      additionalProperties: false
      required: [summary, observed, expected, delta, confidence]
      properties:
        summary:
          type: [string, 'null']
          description: |
            ⚠️ NULLABLE SINCE G3748 — R-D. `null` is an exception whose
            sentence nobody authored (every engine-raised exception, `0500`
            §2); the client composes from `expected`, `observed` and `delta`.
        observed:
          type: array
          description: The comparand values. Why it broke.
          items: { $ref: '#/components/schemas/ObservedValue' }
        expected:
          type: string
          description: |
            Drawn from the REFERENCE SLOT, which is what makes the sentence
            directional. A KYC finding reads "the passport disagrees with the
            registry" rather than the reverse because of this field.
        delta:
          oneOf:
            - $ref: '#/components/schemas/Delta'
            - type: 'null'
        confidence:
          type: [number, 'null']
          description: |
            EXPOSED ON THE DETAIL READ ONLY. Absent from `ExceptionQueueRow`,
            from every filter and sort parameter, and from `Proposal`. The full
            reasoning is on `GET /exceptions/{exceptionId}`; in short, a number
            you can sort a list by is a ranking signal that invites bulk
            approval, and the same number rendered beside the observed values
            it was computed over is provenance. This document exposes the
            second and makes the first unconstructible.

            Null for parsed documents — no OCR, no model call, no confidence
            score. Null means not applicable, never unknown.

    ExceptionResolution:
      type: object
      additionalProperties: false
      required: [dispositionKey, proposalId, mode, at]
      properties:
        dispositionKey: { type: string }
        proposalId: { type: string }
        mode:
          type: string
          enum: [autonomous, approved, manual]
          description: |
            `autonomous` means NO ApprovalDecision exists — the policy was the
            authority. That is legitimate, and it is exactly the case that
            needs a name attached to it.
        authorisedByPolicyId:
          type: [string, 'null']
          description: |
            Set when `mode` is `autonomous`. Without it the accountability
            chain terminates at the agent — the authorless output that makes
            abdication easy. This moves it to whoever authored the policy.
        authorisedByPolicyVersion: { type: [integer, 'null'] }
        decidedBy:
          type: [string, 'null']
          description: |
            The FIRST approver, and a lossy projection of `approvedBy` below —
            retained rather than replaced, because it is the field every
            existing reader of this schema already binds to.

            ⚠️ IT WAS THE ONLY APPROVER THIS SCHEMA COULD CARRY UNTIL
            19 Sep 2026, and `db/migrations/0015_exception_register.sql` named
            the loss in its own voice: *"The wire's `decidedBy`, singular. THE
            MODEL'S IS `approvedBy: UserId[]`."* A quorum of two published one
            name, so the wire could not answer *"who signed this"* — which is
            the question a four-eyes control exists to make answerable.
            `tests/model/approval-state.test.ts` pins `decidedBy ===
            approvedBy[0]` so the two cannot drift.
        approvedBy:
          type: array
          items: { type: string }
          description: |
            EVERY approver, not one. Set when `mode` is `approved`; empty for
            `manual` and `autonomous`.

            🛑 ADDED 19 Sep 2026, G660, AND IT CLOSES A DIVERGENCE THE PREVIOUS
            WAVE ASSERTED RATHER THAN HID. The model's `approved` arm has
            carried `approvedBy: UserId[]` throughout — *"Quorum may exceed 1
            and four-eyes means two names"* — and this schema carried one
            string, so `tests/db/exception-register.test.ts` §6 asserted the
            absence *"so a later commit adding one meets a red"*. This is that
            commit.

            ⚠️ DERIVED, NEVER STORED. There is no `resolution_approved_by`
            column and there must not be one: the names come from
            `tenant.approval_decision`, the rows that RECORD the approvals, and
            a stored copy would be a second answer that disagrees the first
            time a decision arrives after an execution.
        executedBy:
          type: [string, 'null']
          description: |
            The person who ACTED. Set when `mode` is `approved` or `manual`;
            null when `autonomous`.

            🛑 ADDED 19 Sep 2026, G660. A DIFFERENT FACT FROM PROPOSER AND FROM
            APPROVER, and the model says why the omission mattered: the
            `manual` arm *"named nobody at all. `decidedBy` documented the
            APPROVER, so a manual execution requiring no approval recorded the
            proposer (reachable via the proposal) and never the person who
            actually acted."* A resolution below the approval threshold
            therefore published no human name whatsoever.

            ⚠️ `policyEvaluationId` IS STILL ABSENT FROM THIS SCHEMA AND THAT
            IS DELIBERATE RATHER THAN A THIRD OMISSION. It belongs to `mode:
            'autonomous'`, which nothing in this repository can reach — no
            agent proposer, no `policy` table, no policy evaluation. A wire
            field ahead of its writer is worse than a column ahead of its
            reader: it reads as a fact that merely happens to be null.
        at: { type: string, format: date-time }

    ReversalReason:
      type: string
      description: |
        THE DISTINCTION INSIDE THIS VOCABULARY IS LOAD-BEARING. Not every
        reversal indicts the autonomy that produced it.
        `wrong_disposition` and `insufficient_evidence` do.
        `data_corrected`, `rule_wrong` and `downstream_rejected` do not — those
        were the right judgement on what was known at the time, and counting
        them would drive autonomy to `none` across the fleet while looking like
        evidence.
        `undone_by_actor` does not either — G3811, 4 Oct 2026, THE OWNER'S
        RULING ON C3-12: *"New 'undone' reason: add an 'undone_by_actor'
        reversal reason that does not count against the disposition's reversal
        rate."* It is the person retracting their own act inside the reversal
        window; `getDispositionMix` excludes it from `reversalRate` because
        `reversalIndictsAutonomy()` answers false for it, and counts it nowhere
        else differently.
      enum:
        - wrong_disposition
        - insufficient_evidence
        - data_corrected
        - rule_wrong
        - downstream_rejected
        - undone_by_actor

    ExceptionReversal:
      type: object
      additionalProperties: false
      required: [at, reversedBy, reason, newStatus]
      properties:
        at: { type: string, format: date-time }
        reversedBy:
          type: string
          description: Always a user. A reversal is a correction, and corrections are signed.
        reason: { $ref: '#/components/schemas/ReversalReason' }
        indictsAutonomy:
          type: boolean
          description: |
            Derived from `reason` by `reversalIndictsAutonomy()`. Returned
            rather than left to each client to recompute, because every call
            site that computes a reversal rate must agree — and one that
            quietly counts all reversals looks like evidence while being wrong.
        note: { type: [string, 'null'] }
        newStatus: { $ref: '#/components/schemas/ExceptionStatus' }
        correctedDispositionKey: { type: [string, 'null'] }

    Exception:
      type: object
      additionalProperties: false
      required:
        - exceptionId
        - matchGroupId
        - ruleId
        - ruleVersion
        - definitionVersion
        - explanation
        - domain
        - definitionId
        - ruleLabel
        - severity
        - severityRank
        - valueAtRisk
        - costCentre
        - legalEntity
        - status
        - assignedTo
        - assignedToName
        - assignedToFormerMember
        - raisedAt
        - runId
        - resolution
        - reversals
      properties:
        exceptionId: { type: string }
        matchGroupId: { type: string }
        ruleId: { type: string }
        ruleVersion:
          type: integer
          description: |
            Pins the rule as it was when this fired. An exception raised under
            v1 must remain explicable when the rule moves on.
        definitionVersion: { type: integer }
        lineKey:
          type: [string, 'null']
          description: |
            Set for line-scoped rules; identifies which matched line failed.
            Lines are paired by LineMatchKey, never by position — positional
            pairing is wrong the moment a vendor sorts differently.
        carriedForwardFrom: { type: [string, 'null'] }
        runId:
          type: [string, 'null']
          description: |
            G3622, 3 Oct 2026 — THE RUN THAT RAISED THIS EXCEPTION
            (`db/migrations/0480`, the owner's ruling G3621: *"exceptions
            record the run that raised them"*). REQUIRED AND NULLABLE: `null`
            means NOT RECORDED — a row stored before the column existed — and
            never "no run" and never a guessed one. A run-scoped read
            (`runId`, `periodId`) does not return a `null` row.
        severity: { $ref: '#/components/schemas/Severity' }
        severityRank: { type: integer }
        explanation: { $ref: '#/components/schemas/Explanation' }
        domain: { $ref: '#/components/schemas/DomainKey' }
        definitionId: { type: string }
        ruleLabel: { type: string }
        valueAtRisk:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        costCentre:
          type: [string, 'null']
          description: |
            ADDED 7 Aug 2026. The attribute `AssignmentScope.costCentres`
            narrows on — before it existed, that dimension matched every row.
            Resolved at raise time from `TagPolicy.chargebackKey`; opaque
            customer text. Null is untagged, and untagged is outside every
            cost-centre-scoped assignment.
        legalEntity:
          type: [string, 'null']
          description: |
            ADDED 7 Aug 2026. The attribute `AssignmentScope.legalEntities`
            narrows on. Resolved at raise time from `TagPolicy.legalEntityKey`.
            Null is the common single-entity case.
        status: { $ref: '#/components/schemas/ExceptionStatus' }
        assignedTo: { type: [string, 'null'] }
        assignedToName:
          type: [string, 'null']
          description: |
            G3886, 4 Oct 2026 — THE ASSIGNEE'S `display_name`, AS STORED, verbatim and parsed by
            nothing (D6-9: drawn as a text node). THE OWNER'S C3-05 RULING, quoted:
            *"Narrow name-only read: a policy letting a tenant member read
            display_name (only) of people who share their tenant membership; widen
            G447's directory rule for that one column."* Read through
            `tenant.co_member_name` (`db/migrations/0520`), so it is `null` when the
            person is not a LIVE co-member of the reader (a lapsed member, another
            tenant's person, a reader holding no membership) and when the
            id itself is `null`. REQUIRED AND NULLABLE: `null` is a refusal to name,
            never an empty name.
        assignedToFormerMember:
          type: boolean
          description: |
            G4021, 4 Oct 2026 — WHETHER THE ASSIGNEE IS A FORMER MEMBER OF THIS TENANT: they
            held a membership here and hold no LIVE one now. Derived from
            `tenant.membership` alone (G447: *"a tenant can read WHO BELONGS and cannot
            read WHO THEY ARE"*), so it NAMES NOBODY and widens nothing the owner's
            C3-05 ruling decided. It exists because `assignedToName` is `null` for a
            lapsed member AND for a reader holding no membership, and a client that
            cannot tell the two apart draws a lapsed person as "a colleague". `true`
            implies `assignedToName` is `null`. `false` when the id is `null`, when the
            person holds a live membership, and when they NEVER held one (a partner
            under a grant) — that last is not a former member, and its word is the
            owner's to choose (G4022). REQUIRED.
        raisedAt: { type: string, format: date-time }
        resolution:
          oneOf:
            - $ref: '#/components/schemas/ExceptionResolution'
            - type: 'null'
          description: Null while unresolved, and cleared on reversal.
        reversals:
          type: array
          description: |
            In order. An array rather than a flag because an exception can be
            resolved, reversed, re-resolved and reversed again — and a
            disposition that needs two goes is a signal in itself.
          items: { $ref: '#/components/schemas/ExceptionReversal' }

    # ---------------------------------------------------------- C7

    EvidenceInput:
      type: object
      description: |
        `ref` is opaque — a document id, a thread id, a message id, a prior
        exception id. A `correspondence` ref MUST name an admitted message;
        anything else is `message_not_admitted`.
      additionalProperties: false
      required: [kind, ref]
      properties:
        kind:
          type: string
          enum: [document, correspondence, system_record, attestation, free_text]
        ref: { type: string }
        note: { type: [string, 'null'] }

    ProcedureNode:
      oneOf:
        - $ref: '#/components/schemas/NodeRunning'
        - $ref: '#/components/schemas/NodeAwaitingHuman'
        - $ref: '#/components/schemas/NodeParked'
        - $ref: '#/components/schemas/NodeTerminated'
      discriminator:
        propertyName: state
        mapping:
          running: '#/components/schemas/NodeRunning'
          awaiting_human: '#/components/schemas/NodeAwaitingHuman'
          parked: '#/components/schemas/NodeParked'
          terminated: '#/components/schemas/NodeTerminated'

    NodeRunning:
      type: object
      description: The engine holds it. Nothing for a human to do.
      additionalProperties: false
      required: [state, stepId, stepKind, label, advanceable]
      properties:
        state: { type: string, const: running }
        stepId: { type: string }
        stepKind: { type: string, enum: [agent, branch, notify] }
        label: { type: string }
        advanceable: { type: boolean, const: false }

    NodeAwaitingHuman:
      type: object
      description: |
        A `human` step, addressed to a CAPABILITY rather than a person.
        `advanceable` is true only when the SESSION USER may take it — the
        requirement is what the step declares, and whether this caller satisfies
        it is F3's answer.

        MIGRATED 7 Aug 2026, with the deletion of `RoleKey`. This carried
        `role: RoleKey` and mirrored `ProcedureStep.human.role`, which became
        `requires: CapabilityRequirement` on 5 Aug. A step asking for "an
        approver" got any pack's role keyed `approver`; what it meant was
        "someone who may approve, on this domain, at or above this value", and
        that is expressible in a requirement and was not expressible in a key.
      additionalProperties: false
      required: [state, stepId, label, requires, requiredEvidence, secondApproverAbove, advanceable]
      properties:
        state: { type: string, const: awaiting_human }
        stepId: { type: string }
        label: { type: string }
        requires:
          $ref: '#/components/schemas/CapabilityRequirement'
          description: |
            What the step needs held, never who holds it. Mirrors
            `ProcedureStep.human.requires` in `model/domain.ts` — singular
            there, singular here.
        requiredEvidence:
          type: array
          description: |
            Enforced at advance. The boolean this replaced had nowhere to put
            any evidence, so the requirement was decorative.
          items:
            type: string
            enum: [document, correspondence, system_record, attestation, free_text]
        secondApproverAbove:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: |
            Above this amount the step requires a SECOND approver. Null means
            no threshold. Surfaced on the step so a client can warn before the
            first approver signs, rather than after.

            ⚠️ DERIVED FROM `requires` AS OF 7 Aug 2026, NOT INDEPENDENT OF IT.
            The model deleted `ProcedureStep.secondApproverAbove` on 5 Aug
            because it said exactly what `distinctHolders: 2` plus
            `appliesAtOrAboveValue` already says, and two encodings of one rule
            are two encodings that can disagree with no tiebreak written
            anywhere. It survives on the wire only as a projection: non-null iff
            `requires.distinctHolders > 1`, and equal to
            `requires.appliesAtOrAboveValue` when it is. A server must compute
            it; a client must not send it back as a separate gate. It is
            retained rather than removed because `ProposalExecution` names the
            state `approved_pending_second_approver` in an enum and three prose
            blocks cite the field, and re-cutting those is a separate change.
        advanceable: { type: boolean }
        blockedBy:
          type: array
          description: Codes explaining a false `advanceable`.
          items: { $ref: '#/components/schemas/ErrorCode' }

    NodeParked:
      type: object
      description: |
        AN `await` STEP. `advanceable` IS A CONSTANT FALSE.

        A parked await on a counterparty reply resumes when a message on its
        thread is ADMITTED — not when one arrives, and never because a caller
        asserted one did. That distinction is the entire control. A client that
        could advance this would make admission optional and put a
        prompt-injection bypass behind a button.
      additionalProperties: false
      required: [state, stepId, label, waitingFor, resumesOn, deadlineAt, advanceable]
      properties:
        state: { type: string, const: parked }
        stepId: { type: string }
        label: { type: string }
        waitingFor:
          type: object
          additionalProperties: true
          required: [kind]
          properties:
            kind:
              type: string
              enum: [document, counterparty_reply, timer]
        resumesOn:
          type: string
          enum: [admission, arrival, timeout]
          description: |
            `admission` for `counterparty_reply` — always. `arrival` applies
            only to a `document` target, where there is no trust decision to
            take because the document came through intake's own pipeline.
        threadId:
          type: [string, 'null']
          description: The thread this is parked on, where the target is a reply.
        deadlineAt:
          type: [string, 'null']
          format: date-time
          description: |
            Mirrors the step's `timeoutHours`. When it passes, the step takes
            its `timeout` edge, or escalates to `defaultEscalationRole` where
            no timeout edge was declared.
        advanceable: { type: boolean, const: false }

    NodeTerminated:
      type: object
      description: |
        A `terminate` step ran. A NON-TERMINAL DISPOSITION DOES NOT CLOSE THE
        EXCEPTION — it routes to another procedure, named here rather than left
        for a client to infer from a status it did not get.
      additionalProperties: false
      required: [state, stepId, label, dispositionKey, closedException, advanceable]
      properties:
        state: { type: string, const: terminated }
        stepId: { type: string }
        label: { type: string }
        dispositionKey: { type: string }
        closedException: { type: boolean }
        routedToProcedureId: { type: [string, 'null'] }
        advanceable: { type: boolean, const: false }

    ProcedureState:
      type: object
      description: |
        NO "STEP 3 OF 7". A procedure is a graph; a branch and an escalation
        both make a remaining count meaningless, and a progress bar computed
        from one is a lie the UI tells confidently.
      additionalProperties: false
      required: [procedureId, procedureVersion, archetype, current, history]
      properties:
        procedureId: { type: string }
        procedureVersion: { type: integer }
        archetype: { $ref: '#/components/schemas/ReconciliationArchetype' }
        current: { $ref: '#/components/schemas/ProcedureNode' }
        history:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [stepId, label, at]
            properties:
              stepId: { type: string }
              label: { type: string }
              at: { type: string, format: date-time }
              byUserId: { type: [string, 'null'] }
              edgeTaken: { type: [string, 'null'] }
        renderedSopUrl:
          type: [string, 'null']
          format: uri
          description: |
            The human-readable SOP is RENDERED from this graph, not written
            beside it, so the document and the behaviour cannot drift — which
            is the failure mode written SOPs already have in the field.

    # ---------------------------------------------------------- C9

    CorrespondenceChannel:
      type: string
      enum: [email, portal, phone_log, connector]

    ThreadStatus:
      type: string
      enum: [open, awaiting_reply, answered, closed]

    Thread:
      type: object
      additionalProperties: false
      required: [threadId, counterpartyId, subject, channel, exceptionIds, status, openedAt, lastMessageAt]
      properties:
        threadId: { type: string }
        counterpartyId: { type: string }
        counterpartyName: { type: string }
        subject: { type: string }
        channel: { $ref: '#/components/schemas/CorrespondenceChannel' }
        exceptionIds:
          type: array
          description: |
            Many-to-many. One reply can concern three invoices and one
            exception can need two conversations. The act of linking is a
            judgement recorded as an AuditEvent, never inferred from a subject
            line.
          items: { type: string }
        status: { $ref: '#/components/schemas/ThreadStatus' }
        openedAt: { type: string, format: date-time }
        lastMessageAt: { type: string, format: date-time }
        awaitingStepId:
          type: [string, 'null']
          description: The procedure step parked on this thread. Null once answered.
        awaitDeadline: { type: [string, 'null'], format: date-time }

    DisclosureRecord:
      type: object
      description: |
        WRITTEN BECAUSE THE DISCLOSURE HAPPENED, not as a log line. PDPA treats
        disclosure to a third party as a distinct act from collection or use,
        and "which fields did we send to which counterparty" has to be
        answerable without reading email bodies.
      additionalProperties: false
      required: [disclosedClass, fieldsDisclosed, policyVersion, approvedBy]
      properties:
        disclosedClass:
          $ref: '#/components/schemas/DataClass'
          description: Highest class actually sent. Never exceeds the policy ceiling.
        fieldsDisclosed:
          type: array
          description: |
            The queryable half. This is what makes the disclosure log a log.
            Mirrors `DisclosureRecord.fieldsDisclosed: FieldPath[]` in
            `model/correspondence.ts`.
          items: { $ref: '#/components/schemas/FieldPath' }
        policyVersion:
          type: integer
          description: |
            The OutboundCorrespondenceConfig version in force when it went.
            A ceiling tightened afterwards does not retroactively make a past
            send a breach, and this field is how that is provable.
        approvedBy:
          type: [string, 'null']
          description: Set when the class required a named human before sending.

    AdmissionRefusal:
      type: string
      description: |
        A CLOSED VOCABULARY, for the same reason `PolicyEvaluation.reason` is:
        this value ends up in telemetry that a restrictive SpanAttributePolicy
        strips everything else from, and a free-text refusal reason is
        undiagnosable — which matters most for the one decision in the product
        that is purely a security decision.
      enum:
        - injection_suspected
        - unclassifiable
        - out_of_scope
        - malware_detected
        - sender_unverified

    MessageEvidence:
      oneOf:
        - $ref: '#/components/schemas/EvidenceUnadmitted'
        - $ref: '#/components/schemas/EvidenceAdmitted'
        - $ref: '#/components/schemas/EvidenceRefused'
      discriminator:
        propertyName: state
        mapping:
          not_evidence: '#/components/schemas/EvidenceUnadmitted'
          admitted: '#/components/schemas/EvidenceAdmitted'
          refused: '#/components/schemas/EvidenceRefused'
      description: |
        THREE STATES, AND THEY ARE NOT ORDERED. Unadmitted is not a weaker form
        of refused; refused is not a slower form of unadmitted. `mayCite` is a
        CONSTANT per variant so that a schema-driven client cannot end up with
        a boolean whose value it forgot to read, and the fields that make a
        message usable as evidence — `attachmentDocumentIds` above all — exist
        only in the admitted variant.

    EvidenceUnadmitted:
      type: object
      description: |
        NOT EVIDENCE. The message may be read, displayed and audited. It may
        NOT be cited in a ResolutionProposal, fed to an agent as grounds, or
        satisfy an `await` step. Its attachments are BLOB REFERENCES and are
        not SourceDocuments — an attachment from an unadmitted message never
        reaches extraction.
      additionalProperties: false
      required: [state, mayCite, attachmentRefs]
      properties:
        state: { type: string, const: not_evidence }
        mayCite: { type: boolean, const: false }
        attachmentRefs:
          type: array
          description: Opaque blob refs. Not document ids, and not fetchable as documents.
          items: { type: string }
        decidableBy:
          type: object
          description: |
            Whether the SESSION USER may take the decision, and why not where
            they may not. Present so a UI can render the button's absence with
            a reason rather than silently.
          additionalProperties: false
          required: [sessionUserMayDecide]
          properties:
            sessionUserMayDecide: { type: boolean }
            capabilityToAdmit:
              type: string
              description: |
                What a principal must HOLD to admit. Mirrors
                `CorrespondenceConfig.capabilityToAdmit` in `model/policy.ts`,
                whose value is `'admit_correspondence'` — a capability that
                exists precisely so this gate has something to ask for that
                survives a pack inventing role names.

                MIGRATED 7 Aug 2026 from `minimumRoleToAdmit: RoleKey`, and the
                ladder went with it rather than being retyped. The ordered
                ladder leaked twice. A partner cleared it: it excluded
                `'partner_admin'` on the stated ground that a partner "is never
                the party that decides what to believe", while the partner clamp
                in governance.ts guaranteed a partner carried `'operator'` — the
                ladder's own default minimum. And a total order denied everyone
                else: `roleOrder.indexOf()` returns -1 for every pack-origin and
                tenant-origin role, so once roles are composed rather than
                enumerated, admission was unreachable across the whole customer
                estate. A checkpoint that fails open for the one party it names
                and closed for everybody else is not a checkpoint.

                Left as an opaque string rather than enumerated, for the same
                reason `CapabilityRequirement.capability` is: not one of the
                thirty-six capabilities appears in any contract file yet, and a
                second partial copy of a closed set is the divergence this
                migration exists to undo.

                ⚠️ NOT THE WHOLE GATE. `CorrespondenceConfig` conjoins
                `orgClassesThatMayAdmit` with this, because the partner hole is
                an org-class problem wearing a role costume, and there is no
                arrangement under which 1CloudHub staff decide what a customer
                treats as evidence. `sessionUserMayDecide` folds both; this
                field explains one of them and must not be read as sufficient.
            secondPersonRequired:
              type: boolean
              description: |
                True when the message's class exceeds
                `secondPersonToAdmitAboveClass`.
            blockedBy:
              type: array
              items: { $ref: '#/components/schemas/ErrorCode' }

    EvidenceAdmitted:
      type: object
      description: |
        ADMITTED. May be cited, may satisfy a parked `await`, and its
        attachments have become SourceDocuments.
      additionalProperties: false
      required: [state, mayCite, admittedAsEvidenceAt, admittedBy, admittingToolScopeSize, attachmentDocumentIds]
      properties:
        state: { type: string, const: admitted }
        mayCite: { type: boolean, const: true }
        admittedAsEvidenceAt: { type: string, format: date-time }
        admittedBy:
          type: object
          description: A ProposalActor — a user, or an agent step with its model.
          additionalProperties: true
          required: [kind]
          properties:
            kind: { type: string, enum: [user, agent] }
        admittingToolScopeSize:
          type: integer
          description: |
            RECORDED AT ADMISSION, NEVER INFERRED LATER. Zero is the safe value
            for an agent, and it is kept on the message so an audit can check
            that the control held AT THE TIME rather than trusting that the
            procedure has not been edited since. A procedure edited afterwards
            would otherwise rewrite the history of every message it admitted.
        admissionSecondedBy:
          type: [string, 'null']
          description: Set when a second person countersigned because of the class.
        attachmentDocumentIds:
          type: array
          description: |
            PRESENT ONLY IN THIS VARIANT. Attachments become SourceDocuments
            and re-enter the intake flow at admission and not before.
          items: { type: string }

    EvidenceRefused:
      type: object
      description: TERMINAL. The decision was taken and it was no.
      additionalProperties: false
      required: [state, mayCite, refusedFor, refusedAt]
      properties:
        state: { type: string, const: refused }
        mayCite: { type: boolean, const: false }
        refusedFor: { $ref: '#/components/schemas/AdmissionRefusal' }
        refusedAt: { type: string, format: date-time }
        refusedBy: { type: [string, 'null'] }

    Message:
      type: object
      additionalProperties: false
      required: [messageId, threadId, direction, channel, trust, at, bodyRef, dataClass, evidence]
      properties:
        messageId: { type: string }
        threadId: { type: string }
        direction: { type: string, enum: [outbound, inbound] }
        channel: { $ref: '#/components/schemas/CorrespondenceChannel' }
        trust:
          type: string
          enum: [system_generated, operator_authored, untrusted_inbound]
          description: |
            PROVENANCE, NOT SEVERITY AND NOT CONFIDENCE. This is the field an
            agent prompt branches on: `untrusted_inbound` content is quoted as
            data with its provenance attached, never concatenated into
            instructions.
        at: { type: string, format: date-time }
        bodyRef:
          type: string
          description: |
            A POINTER. Bodies are content in object storage — never a column,
            never searched, and reachable by the erasure index only through
            SubjectLocation's `blob` variant.
        dataClass:
          $ref: '#/components/schemas/DataClass'
          description: |
            Highest classification found in the body, set by classification and
            NEVER asserted by the sender. A sender-declared class on an inbound
            message would let the sender lower the bar for admitting itself.
        evidence: { $ref: '#/components/schemas/MessageEvidence' }
        disclosure:
          oneOf:
            - $ref: '#/components/schemas/DisclosureRecord'
            - type: 'null'
          description: Set on outbound only. Always null inbound.
        redactedPaths:
          type: array
          description: |
            On outbound: what the ceiling removed before sending. The caller is
            told what it lost.
          items: { $ref: '#/components/schemas/FieldPath' }

    OutboundDraft:
      type: object
      additionalProperties: false
      required: [body, includeFields]
      properties:
        body:
          type: string
          description: |
            Prose. Values are NOT interpolated by the client — see
            `includeFields`.
        includeFields:
          type: array
          description: |
            `FieldPath`s on the exception's observed values that the message may
            quote, named rather than pasted. Naming them is what makes the
            ceiling applicable at all: a client that pasted a value into `body`
            would be disclosing a classified field the ceiling never saw.

            Each entry addresses EXACTLY ONE observed value — G243 refused a
            wildcard, and this field is one of the reasons: `includeFields` is
            what the outbound ceiling is computed over, and a maximum over a set
            is computable only if each path names one field (G222).
          items: { $ref: '#/components/schemas/FieldPath' }
        exceptionId:
          type: [string, 'null']
          description: The exception whose values `includeFields` refer to.
        approverUserId:
          type: [string, 'null']
          description: |
            Supplied when the draft's class exceeds
            `requiresApprovalAboveClass` and this send has been approved. Lands
            in `DisclosureRecord.approvedBy`.

    DisclosureCheck:
      type: object
      description: |
        A DRY RUN. Writes no DisclosureRecord and sends nothing. The verdict can
        change before the send if the policy version moves, which is why the
        send re-evaluates rather than trusting a token from here.
      additionalProperties: false
      required: [verdict, wouldDiscloseClass, wouldRedactPaths, ceiling, policyVersion]
      properties:
        verdict:
          type: string
          enum: [sendable, sendable_redacted, requires_approval, refused]
        wouldDiscloseClass: { $ref: '#/components/schemas/DataClass' }
        wouldRedactPaths:
          type: array
          description: |
            Named, because silent redaction produces a chase email missing the
            number it was about.
          items: { type: string }
        ceiling:
          $ref: '#/components/schemas/DataClass'
          description: '`CorrespondenceConfig.maxDataClassInOutbound`.'
        requiresApprovalAboveClass:
          oneOf:
            - $ref: '#/components/schemas/DataClass'
            - type: 'null'
        endpointVerified:
          type: [boolean, 'null']
          description: |
            False refuses the send where `requireVerifiedEndpoint` is set. An
            unverified address is a phishing vector pointing outward.
        policyVersion: { type: integer }

    AdmitDecisionInput:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, const: admit }
        secondPersonUserId:
          type: [string, 'null']
          description: |
            The countersignature, required when the message's class exceeds
            `secondPersonToAdmitAboveClass`. Absent where required, the request
            is refused with `admission_second_person_required` — the second
            person is not requested afterwards, because an admission that
            happened and is waiting for a countersignature has already happened.

    RefuseDecisionInput:
      type: object
      additionalProperties: false
      required: [decision, refusedFor]
      properties:
        decision: { type: string, const: refuse }
        refusedFor: { $ref: '#/components/schemas/AdmissionRefusal' }
        note:
          type: [string, 'null']
          description: |
            For humans. NOT the diagnostic channel — `refusedFor` is, and it is
            what survives a restrictive telemetry profile.

    AdmissionOutcome:
      type: object
      description: |
        A REFUSAL IS A SUCCESS. `outcome: refused` arrives with HTTP 200
        because it is a decision correctly taken, exactly as a policy denial
        is. Making it a 4xx would bury the most security-relevant signal in the
        product inside every dashboard that counts errors.
      additionalProperties: false
      required: [outcome, message, resumedStepId, admittedDocumentIds]
      properties:
        outcome: { type: string, enum: [admitted, refused] }
        message: { $ref: '#/components/schemas/Message' }
        resumedStepId:
          type: [string, 'null']
          description: |
            The parked `await` this unblocked. Null on refusal — a refused
            message does not resume anything, and the step continues to wait
            or times out, which is the correct outcome for a reply nobody could
            trust.
        admittedDocumentIds:
          type: array
          description: |
            Attachments that have JUST become SourceDocuments and are now
            entering extraction. Empty on refusal.
          items: { type: string }

    # ---------------------------------------------------------- C10

    AvailableDisposition:
      type: object
      description: |
        One entry from the closed set. `available: false` entries are RETURNED
        rather than omitted — a UI that silently drops options teaches the
        operator that the option does not exist, and the reason it is
        unavailable is frequently the thing they need to know.
      additionalProperties: false
      required: [key, label, family, reversibility, terminal, requiresAdjustment, available]
      properties:
        key: { type: string }
        label: { type: string }
        family:
          type: string
          description: |
            Belongs to the ARCHETYPE, never the domain. Set reconciliation
            always yields timing differences and in-transit items; N-way match
            always yields quantity and price variance. The names are
            domain-flavoured; the families are structural. Put families on the
            domain and every new vertical reinvents them.
        reversibility:
          type: string
          enum: [reversible, reversible_with_cost, irreversible]
          description: |
            DECLARED BY THE PACK AUTHOR, NEVER INFERRED. Whether posting a
            credit note can be undone is a fact about the customer's finance
            process and the world, not about anything we can observe — and it
            is the only one of C13's four dials that cannot be measured.

            An `irreversible` disposition is never a candidate for autonomous
            execution however well it has behaved. Good behaviour does not make
            an unrecoverable action safe.
        terminal:
          type: boolean
          description: False routes to another procedure rather than closing the exception.
        requiresAdjustment:
          type: boolean
          description: A Money adjustment must be stated to choose it.
        available: { type: boolean }
        unavailableFor:
          oneOf:
            - $ref: '#/components/schemas/ErrorCode'
            - type: 'null'

    ProposalActor:
      type: object
      description: |
        A user, or an AGENT STEP with its model. `proposedBy` was a UserId
        while `propose_resolution` was a listed AgentAction and AutonomyConfig
        carried `mayProposeBeyondLimits` — two modules contradicting each other
        on the core act of an agentic product.
      additionalProperties: true
      required: [kind]
      properties:
        kind: { type: string, enum: [user, agent] }
        userId: { type: [string, 'null'] }
        stepId: { type: [string, 'null'] }
        modelId: { type: [string, 'null'] }
        displayName:
          type: [string, 'null']
          description: |
            G3886, 4 Oct 2026 — THE PROPOSING USER'S `display_name` (absent for an agent), AS STORED, verbatim and parsed by
            nothing (D6-9: drawn as a text node). THE OWNER'S C3-05 RULING, quoted:
            *"Narrow name-only read: a policy letting a tenant member read
            display_name (only) of people who share their tenant membership; widen
            G447's directory rule for that one column."* Read through
            `tenant.co_member_name` (`db/migrations/0520`), so it is `null` when the
            person is not a LIVE co-member of the reader (a lapsed member, another
            tenant's person, a reader holding no membership) and when the
            id itself is `null`. PRESENT ON A `user` ACTOR: `null` is a refusal to name,
            never an empty name.
        formerMember:
          type: boolean
          description: |
            G4021, 4 Oct 2026 — WHETHER THE PROPOSING USER IS A FORMER MEMBER OF THIS TENANT: they
            held a membership here and hold no LIVE one now. Derived from
            `tenant.membership` alone (G447: *"a tenant can read WHO BELONGS and cannot
            read WHO THEY ARE"*), so it NAMES NOBODY and widens nothing the owner's
            C3-05 ruling decided. It exists because `displayName` is `null` for a
            lapsed member AND for a reader holding no membership, and a client that
            cannot tell the two apart draws a lapsed person as "a colleague". `true`
            implies `displayName` is `null`. `false` when the id is `null`, when the
            person holds a live membership, and when they NEVER held one (a partner
            under a grant) — that last is not a former member, and its word is the
            owner's to choose (G4022). PRESENT ON A `user` ACTOR, absent for an agent.

    ApprovalDecisionRecord:
      type: object
      description: |
        KEYED TO THE PROPOSAL, NOT THE EXCEPTION. Quorum and segregation of
        duties are unimplementable against an exception key: you cannot count
        distinct approvers of a thing, nor assert approver ≠ proposer, without
        knowing which proposal is being decided.
      additionalProperties: false
      required: [decidedBy, decidedByName, decidedByFormerMember, decision, decidedAt]
      properties:
        decidedBy: { type: string }
        decidedByName:
          type: [string, 'null']
          description: |
            G3886, 4 Oct 2026 — THE APPROVER'S `display_name`, AS STORED, verbatim and parsed by
            nothing (D6-9: drawn as a text node). THE OWNER'S C3-05 RULING, quoted:
            *"Narrow name-only read: a policy letting a tenant member read
            display_name (only) of people who share their tenant membership; widen
            G447's directory rule for that one column."* Read through
            `tenant.co_member_name` (`db/migrations/0520`), so it is `null` when the
            person is not a LIVE co-member of the reader (a lapsed member, another
            tenant's person, a reader holding no membership) and when the
            id itself is `null`. REQUIRED AND NULLABLE: `null` is a refusal to name,
            never an empty name.
        decidedByFormerMember:
          type: boolean
          description: |
            G4021, 4 Oct 2026 — WHETHER THE APPROVER IS A FORMER MEMBER OF THIS TENANT: they
            held a membership here and hold no LIVE one now. Derived from
            `tenant.membership` alone (G447: *"a tenant can read WHO BELONGS and cannot
            read WHO THEY ARE"*), so it NAMES NOBODY and widens nothing the owner's
            C3-05 ruling decided. It exists because `decidedByName` is `null` for a
            lapsed member AND for a reader holding no membership, and a client that
            cannot tell the two apart draws a lapsed person as "a colleague". `true`
            implies `decidedByName` is `null`. `false` when the id is `null`, when the
            person holds a live membership, and when they NEVER held one (a partner
            under a grant) — that last is not a former member, and its word is the
            owner's to choose (G4022). REQUIRED.
        decision: { type: string, enum: [approved, rejected] }
        reason: { type: [string, 'null'] }
        decidedAt: { type: string, format: date-time }

    ProposalExecution:
      type: object
      description: |
        WHY THIS BLOCK EXISTS. "Approved" and "executable" are different facts,
        and the gap between them is the entire reason a money threshold exists.
        The five states:

          `not_approved`                     nobody has decided.
          `rejected`                         decided, and no.
          `approved_pending_second_approver` APPROVED AND NOT EXECUTABLE. The
                                             step declares `secondApproverAbove`
                                             and this proposal's value exceeds
                                             it, or the quorum is unmet. This is
                                             the state a client most often gets
                                             wrong, rendering a green tick over
                                             an exception nobody has authorised
                                             to move money.
          `executable`                       every gate satisfied.
          `executed`                         done; see the exception's
                                             `resolution`.
      additionalProperties: false
      required: [state, approvals, requiredApprovals, blockedBy]
      properties:
        state:
          type: string
          enum:
            - not_approved
            - rejected
            - approved_pending_second_approver
            - executable
            - executed
        approvals:
          type: array
          items: { $ref: '#/components/schemas/ApprovalDecisionRecord' }
        requiredApprovals:
          type: object
          description: The gates, stated so a client can explain the wait.
          additionalProperties: false
          required: [quorum, segregationOfDuties, mandatoryAtOrAbove]
          properties:
            quorum:
              type: integer
              description: '`ApprovalConfig.quorum`. Distinct approvers required.'
            secondApproverAbove:
              oneOf:
                - $ref: '#/components/schemas/Money'
                - type: 'null'
              description: |
                From the `human` step, not from policy — the two are separate
                gates and BOTH must be satisfied. A quorum of one and a
                threshold of SGD 10,000 means one approver below the threshold
                and two above it.
            segregationOfDuties:
              type: boolean
              description: |
                The proposer cannot approve. Enforced, not advised — the same
                person approving their own proposal is not a policy nuance, it
                is the control being absent.
            mandatoryAtOrAbove:
              $ref: '#/components/schemas/Severity'
              description: Below this severity the disposition may resolve without approval.
        blockedBy:
          type: array
          description: |
            The machine-readable form of what is outstanding. Empty when
            `state` is `executable` or `executed`.
          items: { $ref: '#/components/schemas/ErrorCode' }

    Proposal:
      type: object
      additionalProperties: false
      required: [proposalId, exceptionId, proposedBy, dispositionKey, rationale, evidence, proposedAt, execution]
      properties:
        proposalId: { type: string }
        exceptionId: { type: string }
        proposedBy: { $ref: '#/components/schemas/ProposalActor' }
        dispositionKey:
          type: string
          description: |
            From the closed list. The free-text field this replaced made the
            judgement the product exists to automate unscoreable, unreportable
            and unlearnable.
        dispositionLabel: { type: string }
        rationale:
          type: string
          description: |
            Prose, and deliberately NOT the disposition. Keeping the two apart
            is what stops the rationale becoming a de facto free-text
            disposition.
        evidence:
          type: array
          description: |
            EVIDENCE FOR *THIS* DISPOSITION, as distinct from evidence that it
            broke. `Explanation.observed[]` is why it broke; this is the
            delivery note, the vendor reply, the prior case that settled the
            same way.
          items:
            type: object
            additionalProperties: false
            required: [kind, ref]
            properties:
              kind:
                type: string
                enum: [document, correspondence, system_record, attestation, free_text]
              ref: { type: string }
              note: { type: [string, 'null'] }
        adjustment:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        proposedAt: { type: string, format: date-time }
        supersededByProposalId: { type: [string, 'null'] }
        execution: { $ref: '#/components/schemas/ProposalExecution' }

    ExecutionResult:
      type: object
      additionalProperties: false
      required: [exceptionId, resolution, closedException]
      properties:
        exceptionId: { type: string }
        resolution: { $ref: '#/components/schemas/ExceptionResolution' }
        closedException:
          type: boolean
          description: False for a non-terminal disposition.
        routedToProcedureId: { type: [string, 'null'] }

    # ---------------------------------------------------------- C11

    Export:
      type: object
      description: |
        AN EXPORT IS A BLOB, AND THEREFORE AN OBLIGATION. The `retention` block
        is not metadata about the request; it is the commitment the request
        created.
      additionalProperties: false
      required: [exportId, kind, format, status, requestedAt, retention]
      properties:
        exportId: { type: string }
        kind:
          type: string
          enum: [exception_queue, disposition_mix, run_history, audit_extract]
        format: { type: string, enum: [csv, xlsx, json] }
        status:
          type: string
          enum: [queued, building, ready, failed, purged]
        requestedAt: { type: string, format: date-time }
        requestedBy: { type: string }
        download:
          type: [object, 'null']
          description: |
            Present only when `status` is `ready`. SHORT-LIVED AND NOT TO BE
            STORED — a presigned URL pasted into a ticket is an unauthenticated
            copy of classified data with a longer life than anyone intended.
            Re-fetch instead; each fetch writes a DataAccessEvent, which is the
            point.
          additionalProperties: false
          properties:
            url: { type: string, format: uri }
            expiresAt: { type: string, format: date-time }
            byteLength: { type: integer }
        retention:
          type: object
          additionalProperties: false
          required: [retentionClass, purgeAfter, subjectLocationsRegistered]
          properties:
            retentionClass:
              type: string
              const: export
              description: |
                The lifecycle rule is DERIVED from this, never configured
                beside it. Two settings expressing one obligation drift, and
                the direction that matters is the one nobody notices.
            purgeAfter: { type: string, format: date-time }
            purgedAt:
              type: [string, 'null']
              format: date-time
              description: |
                Non-null once the lifecycle rule has fired. The row survives as
                a tombstone, so "there was an export and it is gone" is
                distinguishable from "there was never an export".
            subjectLocationsRegistered:
              type: integer
              description: |
                HOW MANY CLASSIFIED VALUES IN THIS BLOB REGISTERED A
                SubjectLocation OF KIND `blob`. Zero on an export containing
                personal data means erasure cannot reach it — you cannot
                retroactively discover which blobs held whose data. Returned so
                the number is visible rather than assumed.

    # ---------------------------------------------------------- C12

    InstalledPack:
      type: object
      additionalProperties: false
      required: [packId, packKey, packVersion, environment, rolloutState, installedAt, installedBy]
      properties:
        packId: { type: string }
        packKey: { type: string }
        packLabel: { type: string }
        packVersion: { type: integer }
        environment: { type: string, enum: [sandbox, evaluation, production] }
        rolloutState:
          type: string
          enum: [pending, rolling_out, active, rolled_back]
          description: |
            Where THIS TENANT sits in the pack's current rollout, which is not
            the pack's fleet-wide lifecycle state. A pack can be `active`
            across the fleet while this tenant is still `pending`.
        rolledBackBy: { type: [string, 'null'] }
        mintedDefinitionIds:
          type: array
          description: |
            The proof that this tenant's definitions are its OWN copies rather
            than shared references into a control-plane object. A pack may not
            point at tenant rows; installing mints.
          items: { type: string }
        mintedDocumentTypeIds:
          type: array
          items: { type: string }
        mintedProcedureIds:
          type: array
          items: { type: string }
        installedAt: { type: string, format: date-time }
        installedBy: { type: string }

    # ---------------------------------------------------------- C13

    AutonomyDials:
      type: object
      description: |
        FOUR DIALS, AND THEY ARE NOT THE SAME KIND OF THING — which is the
        whole reason this is a loop and not a form. One is declared, two are
        observed, and the fourth is inferred from three separate outcome
        measures.
      additionalProperties: false
      required: [reversibility, blastRadiusMinor, frequency, reversalRate, medianDecisionSeconds, evidenceRate]
      properties:
        reversibility:
          type: string
          enum: [reversible, reversible_with_cost, irreversible]
          description: DECLARED. The one dial no observation yields.
        blastRadiusMinor:
          type: integer
          description: OBSERVED. Total value at risk across the window, minor units.
        frequency:
          type: integer
          description: OBSERVED. Exceptions raised for this definition in the window.
        reversalRate:
          type: number
          description: |
            INFERRED, 0..1. Share of auto-resolved outcomes later reversed —
            the honest measure of verifiability. A disposition humans reverse a
            third of the time was not verifiable, whatever anyone believed when
            the pack was authored.

            Counts ONLY reversals where `reversalIndictsAutonomy()` holds. A
            resolution undone because the source data was later corrected was
            the right judgement on what was known, and counting it here would
            have the loop strangle itself on the tenant's own data corrections.
        medianDecisionSeconds:
          type: number
          description: |
            INFERRED. FAST IS A WARNING, NOT A REASSURANCE. A median of four
            seconds across a queue means nobody opened the evidence — the
            green-checkmark failure, made measurable.
        evidenceRate:
          type: number
          description: INFERRED, 0..1. Share of proposals that carried citable evidence.

    AutonomyDecision:
      type: object
      additionalProperties: false
      required: [outcome, decidedBy, decidedAt, ceilingSet]
      properties:
        outcome: { type: string, enum: [accepted, overridden] }
        decidedBy: { type: string }
        decidedAt: { type: string, format: date-time }
        reason:
          type: [string, 'null']
          description: |
            Required on `overridden`. Agreeing with a measurement needs no
            explanation; disagreeing with one does — and the overrides are the
            more interesting data.
        ceilingSet:
          $ref: '#/components/schemas/AutonomyCeiling'
          description: What was actually applied. This is the acting field.

    AutonomyRecommendation:
      type: object
      description: |
        RECOMMENDS, NEVER APPLIES. A system that silently widens its own
        autonomy is the failure the whole approval layer exists to prevent, and
        measurement would only be its disguise. The decision is a tenant
        user's.
      additionalProperties: false
      required:
        - recommendationId
        - definitionId
        - windowFrom
        - windowTo
        - sampleSize
        - dials
        - configuredCeiling
        - recommendedCeiling
        - direction
        - basis
        - producedAt
        - decision
        - thresholds
      properties:
        recommendationId: { type: string }
        definitionId: { type: string }
        dispositionKey:
          type: [string, 'null']
          description: Null when the recommendation is over the definition as a whole.
        windowFrom: { type: string, format: date-time }
        windowTo: { type: string, format: date-time }
        sampleSize:
          type: integer
          description: |
            Below `MIN_SAMPLE_TO_WIDEN` the basis carries
            `insufficient_sample` and the direction cannot be `widen`. A
            reassuring number computed from eleven exceptions is not evidence.
        dials: { $ref: '#/components/schemas/AutonomyDials' }
        configuredCeiling: { $ref: '#/components/schemas/AutonomyCeiling' }
        recommendedCeiling: { $ref: '#/components/schemas/AutonomyCeiling' }
        direction: { type: string, enum: [widen, narrow, unchanged] }
        basis:
          type: array
          description: |
            A CLOSED VOCABULARY, so the reason survives a restrictive
            SpanAttributePolicy and can be reported on across the fleet. A
            free-text justification would be stripped in exactly the
            deployments where fleet-wide analysis is hardest.
          items:
            type: string
            enum:
              - irreversible_disposition
              - high_reversal_rate
              - low_evidence_rate
              - decisions_too_fast
              - high_value_at_risk
              - insufficient_sample
              - stable_and_low_risk
        thresholds:
          type: object
          description: |
            STARTING POSITIONS, NOT SETTLED NUMBERS. Returned rather than
            compiled into a client so that a change is visible to the person
            deciding rather than a silent shift in what the screen recommends.
          additionalProperties: false
          required:
            - minSampleToWiden
            - maxReversalRateToWiden
            - minEvidenceRateToWiden
            - minDecisionSeconds
            - reversalRateToNarrow
          properties:
            minSampleToWiden: { type: integer }
            maxReversalRateToWiden: { type: number }
            minEvidenceRateToWiden: { type: number }
            minDecisionSeconds:
              type: number
              description: A median faster than this reads as rubber-stamping, not efficiency.
            reversalRateToNarrow: { type: number }
        producedAt: { type: string, format: date-time }
        decision:
          oneOf:
            - $ref: '#/components/schemas/AutonomyDecision'
            - type: 'null'
          description: |
            Null until a human decides. NOTHING IN C13 CHANGES A CEILING WHILE
            THIS IS NULL.
        supersededByRecommendationId: { type: [string, 'null'] }

    # ---------------------------------------------------------- authority

    # THE RECORD A CONFERRAL PRODUCES.
    #
    # It publishes the pin. `roleVersion` is read from the role in the same
    # transaction that writes the row, and `decide()` stops evaluating an
    # assignment whose pin has moved in EITHER direction — so a caller that did
    # not see the version it got cannot tell a live assignment from an inert
    # one, and an inert authority row is the thing an auditor most needs to be
    # able to spot.
    #
    # There is no `scope` field and that is not an omission. `AssignmentScope`
    # has six dimensions, none of which has a column in this schema; publishing
    # a scope here would publish the deny-all filler as though a narrowing had
    # been chosen, and a narrowed grant that looks unconditional is the failure
    # the data plane's authoriser already refuses to commit one layer up.
    #
    # There is no `revokedAt` either: nothing revokes, so the field would be a
    # constant null describing a lifecycle this product does not have yet.
    RoleAssignmentRecord:
      type: object
      additionalProperties: false
      required: [assignmentId, userId, roleId, roleVersion, grantedBy, grantedAt, expiresAt]
      properties:
        assignmentId: { type: string }
        userId: { type: string }
        roleId: { type: string }
        roleVersion:
          type: integer
          description: The role version this assignment is pinned to.
        grantedBy:
          type: string
          description: |
            The person who conferred it, derived from the session. It is not a
            request field and the database checks it against the act's own
            authorisation record.
        grantedAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }

# ------------------------------------------------------------- reason codes
    #
    # 🛑 A LOCAL COPY OF `errors.yaml#/components/schemas/ErrorCode`, GENERATED
    # FROM IT, AND THE COPY IS A RULING RATHER THAN AN OVERSIGHT. The owner,
    # 21 Sep 2026: *"Stop `$ref`-ing `errors.yaml` from success bodies. A
    # success body carries its own closed enum rather than pointing at the error
    # taxonomy."* `server/contract/bundle.ts` is NOT changed and its refusal of
    # external pointers stands — that refusal is the thing that made a success
    # body pointing here unserialisable, and it is deliberate.
    #
    # ⚠️ WHAT IT COST, NAMED RATHER THAN DISCOVERED: this is a SECOND HOME for a
    # closed vocabulary, which is `db/migrations/0002`'s *"third place to
    # drift"*. It is a MIRROR rather than a fork, and the thing that makes it one
    # is `tests/contracts/success-body-error-codes.test.ts`, which asserts SET
    # EQUALITY WITH `errors.yaml` IN BOTH DIRECTIONS and compares ORDER —
    # `db/migrations/0008`'s precedent for seeded reference data, and
    # `tests/contracts/field-path-wire.test.ts` §3's precedent for a structural
    # copy this same bundler refusal already forced on `FieldPath`.
    #
    # ⚠️ IT IS NOT NARROWED, AND THE NON-NARROWING IS A DECISION WITH A
    # MEASUREMENT BEHIND IT. Only FIVE of these members can be produced into a
    # success body today — `BLOCKER_CODE` in
    # `server/data-plane/resolution-vocabulary.ts` is a TOTAL
    # `Record<ApprovalBlocker, string>` over four, and `unavailableFor`'s
    # producer writes two literals. A narrowed copy was refused for three
    # measured reasons: `decidableBy.blockedBy` has NO producer at all, so any
    # subset there is a guess; at `fast-json-stringify@7.0.1` an `enum` nested
    # in a `oneOf` IS ENFORCED, so an under-guess on `unavailableFor` is a 500
    # in production rather than a documentation error; and a narrow set has no
    # mechanically checkable completeness direction, which is the whole control.
    # **This slice changes the POINTER, not the SURFACE.** Narrowing is a second
    # ruling and needs producers most of these fields do not have.
    #
    # ⚠️ IT IS APPENDED AT THE END OF `components.schemas` DELIBERATELY, AND NOT
    # PLACED ALPHABETICALLY. `docs/contracts/README.md` records that roughly
    # sixty citations in this record address these files as `file.yaml:NNN`;
    # inserting 88 lines anywhere above would shift every one of them into
    # the resolving-but-wrong class `tools/check-citations.mjs` structurally
    # cannot catch.
    #
    # DERIVED, NEVER HAND-TYPED. Regenerate and diff:
    #   node -e "const y=require('yaml'),f=require('fs');\
    #     const p=(x)=>y.parse(f.readFileSync(x,'utf8')).components.schemas.ErrorCode.enum;\
    #     console.log(JSON.stringify(p('docs/contracts/errors.yaml'))===\
    #       JSON.stringify(p('docs/contracts/<this file>')))"

    ErrorCode:
      type: string
      description: |
        Closed and shared. Listed alphabetically; any tier may return any code.

        A LOCAL COPY of `errors.yaml`'s enum of the same name, kept identical to
        it — members and order — by
        `tests/contracts/success-body-error-codes.test.ts`. Read the comment
        block above before changing a member here: this file is the MIRROR and
        `errors.yaml` is the AUTHORITY.
      enum:
        - access_grant_absent
        - adjustment_currency_mismatch
        - admission_already_decided
        - admission_class_above_agent_ceiling
        - admission_role_insufficient
        - admission_second_person_required
        - admitting_step_carries_tools
        - approval_quorum_unmet
        - approval_rejection_reason_required
        - approval_second_approver_required
        - approval_segregation_violation
        - attestation_chain_broken
        - attestation_sequence_gap
        - attestation_signature_invalid
        - autonomy_override_reason_required
        - bound_negative
        - bound_not_a_number
        - bound_not_an_integer
        - bound_zero
        - bounds_not_configured
        - capability_not_held
        - classification_ceiling_exceeded
        - connection_disabled
        - data_plane_decommissioned
        - data_plane_unknown
        - definition_not_active
        - disposition_not_offered
        - disposition_requires_adjustment
        - document_type_unknown
        - domain_claimed_by_more_than_one_connection
        - domain_not_claimed
        - domain_not_verified
        - entitlement_ceiling_breached
        - entitlement_exhausted
        - entitlement_expired
        - exception_already_resolved
        - export_class_excluded
        - export_destination_not_allowed
        - export_forbidden_by_policy
        - idempotency_conflict
        - idle_exceeds_lifetime
        - lease_revoked
        - membership_absent
        - message_not_admitted
        - model_provider_throttled
        - model_residency_violation
        - model_unavailable_in_account
        - non_synthetic_ingest_refused
        - outbound_channel_not_permitted
        - outbound_endpoint_unverified
        - pack_not_entitled
        - pack_version_unsupported
        - period_closed
        - policy_bundle_version_unsupported
        - policy_denied
        - policy_redacted
        - policy_requires_approval
        - proposal_not_executable
        - proposal_superseded
        - rate_limited
        - recommendation_superseded
        - required_evidence_missing
        - resolution_not_configured
        - resource_not_found
        - retention_class_unknown
        - reversal_window_expired
        - sanitisation_rejected
        - schema_version_unsupported
        - sender_unverified
        - sequence_regressed
        - session_idle_exceeds_ceiling
        - session_invalid
        - session_lifetime_exceeds_ceiling
        - sign_in_attempt_challenge_mismatch
        - sign_in_attempt_connection_mismatch
        - sign_in_attempt_handle_mismatch
        - sign_in_attempt_replayed
        - signature_key_unknown
        - slot_fill_incomplete
        - step_awaiting_reply
        - step_not_current
        - subject_location_unregistered
        - tag_vocabulary_violation
        - tenant_context_missing
        - tenant_suspended
        - tool_out_of_scope
        - trigger_not_enabled
        - upload_expired
        - upstream_unavailable
        - user_disabled
        - validation_failed
