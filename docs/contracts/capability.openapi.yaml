  #    · "The handler lands with the migration, in that commit" — **the owner
  #      separated them, and this comment is not thereby wrong.** G200's freeze
  #      was re-put on 19 Sep 2026 and reaffirmed: **it binds until the gate
  #      GENUINELY ALLOWS SOMEBODY.** The gate exists and answers `not_held` to
  #      every caller, because three of `PrincipalContext`'s seven terms have no
  #      producer — so a handler mounted today 403s for everybody, which is the
  #      same "route that asserts nothing" this block already refuses, arriving
  #      by the other door.
  #
  #    ⚠️ WHAT THE SENTENCE WAS RIGHT ABOUT IS WHY IT IS QUOTED IN THE
  #    MIGRATION: **a column with no reader is a column nothing checks.** The
  #    reader therefore lands with the columns, shaped as these two operations
