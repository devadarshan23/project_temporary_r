  /runs/{runId}/account:
    get:
      tags: [C5 Run Admission]
      operationId: getRunAccount
      # 🛑 `view_exception` SINCE 4 Oct 2026 — G3801, THE OWNER'S RULING ON C3-06,
      # QUOTED AND NEVER PARAPHRASED: *"Open run reads to view_exception: anyone
      # who can see the register can see its runs; admit_source stays the gate
      # for starting runs."* (Starting a run is `admitRun`, gated `trigger_run`;
      # `admit_source` stays on intake.) The comment above is the reasoning the
      # ruling OVERTURNS and is kept as the history it is. ⚠️ ITS COST IS NAMED
      # (G3802): `view_exception` sits in `PARTNER_CAPABILITY_MASK`, so a partner
      # under a live grant whose scope carries it now reads runs too.
      # 🛑 `view_run` SINCE 4 Oct 2026 — G3881, THE OWNER'S RULING ON G3802,
      # QUOTED AND NEVER PARAPHRASED: *"Keep partners out: run reads open to
      # customer roles holding view_exception, but are excluded from the partner
      # capability mask; partners still see exceptions, not run residue."*
      # `view_run` is CARRIED by `view_exception` (`CAPABILITY_CARRIED_BY`), so
      # G3801's reach is unchanged for every customer role; it is in NO partner
      # scope, so the `x-partner-exposure: accepted` that stood here is GONE
      # rather than reworded — there is no exposure left to accept.
      x-capability: view_run
      summary: The run's own account of itself — refused, or produced with every channel.
      description: |
        WHAT THE ENGINE DID, AND WHAT IT COULD NOT ESTABLISH.

        A refused run produced NOTHING, and before this operation existed the
        only thing a consumer could learn about one was the word `failed` on
        `Run.status` — fifteen distinct refusals with fifteen distinct remedies
        flattened into one word. The `refused` arm names which.

        A produced run carries all SIX channels unconditionally: what admission
        did per side and every row it refused; the post-conditions, beside the
        declaration that says which of them were ever about soundness at all; the
        completeness findings that make `incomplete` mean something a person can
        act on; and — since G237 — what the run spent, as four meters and no
        price.

        ⚠️ THIS SENTENCE SAID *"all five channels"* UNTIL 22 Aug 2026 and it is
        corrected here rather than deleted, because it is the sentence a reader
        would have quoted onward. The sixth channel is `meterFacts`. It mints no
        operation and no capability: the meters are facts about one run, and this
        is already that run's own account.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunEngineAccount' }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runs/{runId}/residue:
    get:
      tags: [C5 Run Admission]
      operationId: listRunResidue
      # 🛑 `view_exception` SINCE 4 Oct 2026 — G3801, THE OWNER'S RULING ON C3-06,
      # QUOTED AND NEVER PARAPHRASED: *"Open run reads to view_exception: anyone
      # who can see the register can see its runs; admit_source stays the gate
      # for starting runs."* (Starting a run is `admitRun`, gated `trigger_run`;
      # `admit_source` stays on intake.) The comment above is the reasoning the
      # ruling OVERTURNS and is kept as the history it is. ⚠️ ITS COST IS NAMED
      # (G3802): `view_exception` sits in `PARTNER_CAPABILITY_MASK`, so a partner
      # under a live grant whose scope carries it now reads runs too.
      # 🛑 `view_run` SINCE 4 Oct 2026 — G3881, THE OWNER'S RULING ON G3802,
      # QUOTED AND NEVER PARAPHRASED: *"Keep partners out: run reads open to
      # customer roles holding view_exception, but are excluded from the partner
      # capability mask; partners still see exceptions, not run residue."*
      # `view_run` is CARRIED by `view_exception` (`CAPABILITY_CARRIED_BY`), so
      # G3801's reach is unchanged for every customer role; it is in NO partner
      # scope, so the `x-partner-exposure: accepted` that stood here is GONE
      # rather than reworded — there is no exposure left to accept.
      x-capability: view_run
      summary: The residue, one row per open item, addressed at line grain.
      description: |
        THE RESIDUE IS THE PRODUCT. Every row of the register an operator works
        is one of these, and a residue of a hundred thousand open rows is not a
        property on an envelope — which is why this is its own cursor-paged
        operation rather than a field on `getRunAccount`.

        Addressed by `ItemRef` — `(sourceDocumentId, lineIndex)` — because a set
        reconciliation is LINE grain: a bank statement is one document with four
        hundred lines, and a match group addresses documents and can never record
        which line paired.

        🛑 STATED NON-GOAL: THIS OPERATION DOES NOT OPEN A FINDING, and that is
        now a statement about THIS OPERATION rather than about the model.

        ⚠️ IT READ *"See `ResidueEntry` for why the transition is out of scope
        (MG14)"* UNTIL #247 [W-12], AND THE REASON IT GAVE IS GONE. MG14 is
        closed: G228 minted `LineFinding` as a second row type at line grain and
        `openLineFinding()` is the join that was missing. What is still true, and
        it is narrower: no operation on this tier produces one. The route is
        `/close/finding/:ref`, which is #213's. The sentence is corrected here
        rather than deleted because a reader would have taken it as evidence that
        the transition cannot be built.
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of residue rows.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ResidueEntry' }
                  nextCursor: { type: [string, 'null'] }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runs/{runId}/allocations:
    get:
      tags: [C5 Run Admission]
      operationId: listRunAllocations
      # 🛑 `view_exception` SINCE 4 Oct 2026 — G3801, THE OWNER'S RULING ON C3-06,
      # QUOTED AND NEVER PARAPHRASED: *"Open run reads to view_exception: anyone
      # who can see the register can see its runs; admit_source stays the gate
      # for starting runs."* (Starting a run is `admitRun`, gated `trigger_run`;
      # `admit_source` stays on intake.) The comment above is the reasoning the
      # ruling OVERTURNS and is kept as the history it is. ⚠️ ITS COST IS NAMED
      # (G3802): `view_exception` sits in `PARTNER_CAPABILITY_MASK`, so a partner
      # under a live grant whose scope carries it now reads runs too.
      # 🛑 `view_run` SINCE 4 Oct 2026 — G3881, THE OWNER'S RULING ON G3802,
      # QUOTED AND NEVER PARAPHRASED: *"Keep partners out: run reads open to
      # customer roles holding view_exception, but are excluded from the partner
      # capability mask; partners still see exceptions, not run residue."*
      # `view_run` is CARRIED by `view_exception` (`CAPABILITY_CARRIED_BY`), so
      # G3801's reach is unchanged for every customer role; it is in NO partner
      # scope, so the `x-partner-exposure: accepted` that stood here is GONE
      # rather than reworded — there is no exposure left to accept.
      x-capability: view_run
      summary: What matched with what, and how much — one row per allocation, as ids and amounts.
      description: |
        THE OTHER HALF OF THE RESIDUE. R13, THE OWNER'S RULING OF 1 Oct 2026,
        QUOTED AND NEVER PARAPHRASED: *"Persist ids only: persist allocations
        as typed rows of item refs + amounts, never the counterparty join-key
        text; publish via a read operation. Invariant 6 held by absence."*

        Before this operation the product persisted what did NOT match and
        never what did, so a screen could show residue and never the pairing
        that explains an exception — and a fully matched run was, on every
        served surface, the same empty residue as a run whose pairs were never
        recorded.

        🛑 IT PUBLISHES ADDRESSES AND AMOUNTS AND NOTHING THAT CAME OUT OF A
        PAYLOAD. Each end is an `ItemRef` plus its side; the model's internal
        `itemKey()` is not on the wire (see `ItemRef`). The identifier VALUE that
        joined, the counterparty and the description have NO STORAGE
        (`db/migrations/0260_run_allocation.sql`), so they cannot be published
        at any price. `evidence.on` is the DECLARED `FieldPath`, operator-
        authored, on `AmbiguityFinding.on`'s argument.

        ⚠️ `admit_source`, BECAUSE THIS IS THE SAME RUN'S ACCOUNT. ⚠️ AND
        `view_exception` SINCE 4 Oct 2026 FOR THE SAME REASON — G3801, the
        owner's C3-06 ruling moved the whole `/runs/{runId}` family together, so
        the sentence's argument survives and its verb is corrected beside it.
        It mints no
        capability: it is `getRunAccount`'s ledger at line grain, cursor-paged
        for `listRunResidue`'s reason. A run with no engine account is a 404 and
        NEVER an empty page — an empty page means the engine paired nothing.
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of allocations, in the engine's own append order.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RunAllocation' }
                  nextCursor: { type: [string, 'null'] }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ================================================================== C6
  /exceptions:
    get:
      tags: [C6 Exception]
      operationId: listExceptions
      x-capability: view_exception
      x-partner-exposure: 'accepted: the queue is what a partner supports, and exceptions_read exists for exactly this'
      summary: The queue. The product's home screen.
      description: |
        EVERY FILTER AND SORT HERE READS A DENORMALISED COLUMN, AND THAT IS WHY
        THOSE COLUMNS EXIST. `domain`, `definitionId`, `ruleLabel`,
        `severityRank` and `valueAtRisk` are copied onto Exception for exactly
        this query and nothing else. Reaching `domain` through the live
        relations is three joins; rule labels live inside a JSON array on the
        definition. At a hundred thousand open rows that is the difference
        between a home screen and a timeout.

        `severityRank` is an ordinal because `ORDER BY` on the string union
        sorts critical, high, low, medium — alphabetically, and therefore
        wrongly, in a way that looks plausible enough to ship.

        THE SORT SET IS CLOSED. Four orderings, each backed by a covering
        index. An arbitrary `sort=<column>` parameter is how a queue acquires a
        sort nobody indexed, and the first person to notice is the customer
        with the most exceptions — which is the customer who matters most.

        `valueAtRiskAtLeast` REQUIRES A CURRENCY. `Money` carries currency and
        exponent because a USD invoice compared against an SGD purchase order
        once reported a 35% critical variance on a correct invoice. A bare
        number threshold across mixed currencies reproduces that defect in the
        filter instead of the rule.

        THERE IS NO TEXT SEARCH OVER `explanation.summary`, AND NO FILTER OR
        SORT ON CONFIDENCE. The summary is not a denormalised column; searching
        it is a scan over the exact JSON the queue columns were extracted from
        to avoid scanning. Confidence is discussed at
        `GET /exceptions/{exceptionId}` — the short version is that a sortable
        confidence column is a bulk-approval affordance, and this contract has
        no bulk operations.
      parameters:
        - name: domain
          in: query
          description: Denormalised. Three joins if it were not.
          schema:
            type: array
            items: { $ref: '#/components/schemas/DomainKey' }
        - name: definitionId
          in: query
          description: Denormalised.
          schema:
            type: array
            items: { type: string }
        - name: ruleLabel
          in: query
          description: |
            Denormalised. Exact match on the label as it was pinned at
            `ruleVersion` — a rule renamed since does not silently drop older
            exceptions out of the filter.
          schema:
            type: array
            items: { type: string }
        - name: severity
          in: query
          description: Filters on `severityRank`, not on the string.
          schema:
            type: array
            items: { $ref: '#/components/schemas/Severity' }
        - name: status
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/ExceptionStatus' }
        - name: assignedTo
          in: query
          description: A user id. Mutually exclusive with `unassignedOnly`.
          schema: { type: string }
        - name: unassignedOnly
          in: query
          schema: { type: boolean }
        - name: mineOrUnassigned
          in: query
          description: |
            G3424, 3 Oct 2026 — rows that are UNASSIGNED or assigned to the
            ACTING PERSON: the queue that needs this caller. A BOOLEAN, never a
            user id: the person it means is the session's own subject, so a
            caller cannot ask what needs somebody else by naming them. Mutually
            exclusive with `assignedTo` and `unassignedOnly` (a 422).
          schema: { type: boolean }
        - name: valueAtRiskAtLeastMinor
          in: query
          description: |
            Exact integer minor units, as a DECIMAL STRING. Requires `currency`.
            Rows whose `valueAtRisk` is null are excluded — a non-monetary
            finding is not below the threshold, it is outside the question.

            🛑 A STRING SINCE 19 Sep 2026 — G286. It was `{ type: integer }`,
            and a filter BOUND on money that caps at 2^53 would have re-imposed
            the ceiling at the read surface the moment the model stopped having
            one. A threshold is money; it takes money's wire form.
          schema: { type: string, pattern: '^-?[0-9]+$' }
        - name: currency
          in: query
          description: ISO 4217. Required whenever `valueAtRiskAtLeastMinor` is set.
          schema: { type: string }
        - name: raisedFrom
          in: query
          schema: { type: string, format: date-time }
        - name: raisedTo
          in: query
          schema: { type: string, format: date-time }
        - name: carriedForwardOnly
          in: query
          description: |
            Exceptions that survived a prior period. The controller's first
            question at close, and the one the queue is worst at answering
            without this.
          schema: { type: boolean }
        - name: runId
          in: query
          description: |
            G3622, 3 Oct 2026 — the runs that RAISED the rows
            (`db/migrations/0480`). A row whose run is not recorded matches no
            run: it is outside the question, never inside every answer.
          schema:
            type: array
            items: { type: string }
        - name: periodId
          in: query
          description: |
            G3622 — the reconciliation periods of the runs that raised the
            rows, reached through `runId` → `Run.periodId`. Answers G954, which
            refused a period filter because nothing joined an exception to a
            run. A row whose run is not recorded matches no period.
          schema:
            type: array
            items: { type: string }
        - name: sort
          in: query
          description: |
            Default `severity_then_value` — the journey's stated default:
            sorted by severity rank then value at risk.
          schema:
            type: string
            default: severity_then_value
            enum:
              - severity_then_value
              - value_at_risk_desc
              - raised_at_desc
              - raised_at_asc
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: |
            A page of queue rows. Note what a row does NOT carry: the
            explanation's observed values, its provenance, and its confidence.
            A list row carries the summary and the denormalised columns, which
            is what a triage decision needs and no more.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, nextCursor, estimatedTotal]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ExceptionQueueRow' }
                  nextCursor: { type: [string, 'null'] }
                  estimatedTotal:
                    type: [integer, 'null']
                    description: |
                      APPROXIMATE, and null when it cannot be estimated
                      cheaply. An exact count over a hundred thousand filtered
                      rows is a scan on every keystroke of a filter. A queue
                      that shows "about 12,400" and is fast beats one that
                      shows 12,417 and is not.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Denied' }
        '422':
          description: '`validation_failed` — e.g. a value threshold without a currency.'
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }

  /exceptions/facets:
    get:
      tags: [C6 Exception]
      operationId: getExceptionFacets
      x-capability: view_exception
      x-partner-exposure: 'accepted: facet counts over the queue the grant already reaches, disclosing no row the list does not'
      summary: The values the filters can legally take, with counts.
      description: |
