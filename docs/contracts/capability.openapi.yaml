openapi: 3.1.0

info:
  title: ReconcileAI — Capability Services (C1–C13)
  version: 0.1.0-draft
  summary: The thirteen product surfaces. The only tier a customer's browser meets.
  description: |
    THE SAME TWO CONVENTIONS AS THE FOUNDATION TIER, AND THEY MATTER MORE HERE.

    `tenantId` appears in no request body and no query parameter in this
    document. Scope is derived from the session by F1 and pinned for the
    request. In the foundation tier that absence is discipline; here it is the
    attack surface, because these are the operations an authenticated user can
    actually reach. A request that could state its tenant could state the wrong
    one — invariant 1, expressed as an absence.

    Errors are the same closed enum, referenced. `ErrorCode` is defined once in
    `errors.yaml` and `$ref`d here; there is no local copy. (This paragraph
    formerly described a verbatim reproduction — that copy is what diverged by
    13 members in an afternoon, and extracting it is what `errors.yaml` exists
    for.) It is one vocabulary, not two: under a restrictive SpanAttributePolicy the error class
    is the only diagnostic channel that survives redaction, so a code that
    exists in one tier and not the other is a support call nobody can answer.

    THREE THINGS THIS TIER HAS TO GET RIGHT.

    ADMISSION IS THE SECURITY BOUNDARY. A message is not evidence until
    something admits it. Every representation of a message in this document
    carries a discriminated `evidence` object whose `mayCite` flag is a
    constant per variant — `true` only in the admitted variant. A client cannot
    reach citable content without having read the discriminator, because the
    fields that make a message citable are not present in the other variants.
    Without that, "the agent read the email" and "the agent obeyed the email"
    are the same event.

    DISPOSITIONS ARE A CLOSED SET, DISCOVERED AT RUNTIME. There is no free-text
    disposition anywhere. `GET /exceptions/{exceptionId}/dispositions` is how a
    client learns which keys are legal for this exception, and the server
    refuses any other key. Free text is what made the judgement the product
    exists to automate unscoreable and unreportable.

    THERE IS NO BULK OPERATION IN THIS DOCUMENT. No bulk approve, no bulk
    admit, no bulk resolve, no multi-id mutation of any kind. That is a
    deliberate omission, not an oversight — see the `confidence` discussion on
    `GET /exceptions/{exceptionId}`. `AutonomyDials.medianDecisionSeconds`
    exists to measure whether humans actually looked, and
    `MIN_DECISION_SECONDS = 20` names the threshold below which a queue is
    being cleared rather than reviewed. An endpoint that clears a queue in one
    request would make that measurement meaningless while it was being taken.

    NOTHING HERE IS BUILT. These are contracts derived from the model's
    invariants, not descriptions of running code.

servers:
  - url: https://{dataPlaneHost}/v1
    description: |
      There is no single server URL and there is not going to be one. Under
      `hosted` the data plane is a 1CloudHub-operated host; under `byoa` it is
      inside the customer's own AWS account and we cannot reach it. The host is
      configuration a client is given, never a constant a client compiles in.
    variables:
      dataPlaneHost:
        default: data-plane.example
        description: Per-tenant. Resolved at sign-in, never guessed.

tags:
  - name: C1 Intake
    description: |
      Four channels — upload, watched drop, connector pull, mailbox. Only
      `upload` has a browser-facing operation; the other three are server-side
      arrivals a user observes rather than performs, which is the point of them.
  - name: C2 Extraction
    description: |
      No browser-facing trigger. Extraction is started by C1 on arrival. What
      is exposed here is the READ — the extracted values and their provenance,
      because an exception detail that cannot show which page a number came
      from has lost the argument.
  - name: C5 Run Admission
  - name: C6 Exception
  - name: C7 Procedure Runtime
  - name: C8 Agent Runtime
    description: |
      Deliberately absent from this document. An agent is an `agent` step
      inside a procedure, invoked by C7 through F13. There is no operation that
      runs an agent directly, because an agent reachable outside a procedure
      step is an agent outside the step's declared tool scope — which is the
      one thing F13 exists to make impossible.
  - name: C9 Correspondence
  - name: C10 Resolution
  - name: C11 Reporting & BI
  - name: C12 Pack Install
  - name: C13 Autonomy Advisor
  - name: C15 Source Credentials
  - name: C9 Sources
    description: |
      The pack's C9 · Configure sources and packs — which this document cannot
      tag C9, because this document's C9 is Correspondence. G2401, the owner's
      ruling of 1 Oct 2026: a source credential lives in Secrets Manager,
      encrypted under the tenant's own KMS key, and only a reference to it
      lives in the database. This tier can WRITE one and can never read one
      back.

security:
  - sessionContext: []

paths:

  # ================================================================== C1
  /intake/channels:
    get:
      tags: [C1 Intake]
      operationId: listIntakeChannels
      x-capability: admit_source
      summary: The four channels, and which of them are actually wired.
      description: |
        Journey step 01 is "nobody does anything" — documents arrive on
        whichever channels are wired. That is only reassuring if a user can see
        that the channel is alive. A silent connector and a connector with
        nothing to pull look identical from the queue, and the difference is a
        week of missing invoices.

        `lastArrivalAt` is the liveness signal. It is not a health check and
        does not claim the connector is well; it says when something last came
        through, which is the question an operator is actually asking.
      responses:
        '200':
          description: Channel status.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [channels]
                properties:
                  channels:
                    type: array
                    items: { $ref: '#/components/schemas/IntakeChannelStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Denied' }

  /intake/uploads:
    post:
      tags: [C1 Intake]
      operationId: createUpload
      x-capability: admit_source
      summary: Mint a short-lived presigned PUT. The server chooses the key.
      description: |
        THE CLIENT NEVER CHOOSES THE OBJECT KEY. The URL is minted through F8,
        which places the tenant prefix as the FIRST path segment so an IAM
        condition on `s3:prefix` is expressible. A client that could name its
        own key could name another tenant's prefix, and the isolation would
        then depend on a string comparison in application code rather than on a
        policy the storage layer enforces.

        Bytes do not travel through this API. F8's `putObject` takes
        `bytesBase64`, which is correct for an in-process caller and wrong for
        a browser holding a 40 MB scan — base64 inflates by a third and the
        whole thing would sit in an application process's heap for no reason.
        The presign moves the bytes directly and keeps the boundary.

        `synthetic` IS DECLARED HERE, BEFORE THE BYTES MOVE. A sandbox tenant
        accepts only `true`, enforced rather than advisory, and refusing at
        presign time means a real invoice never reaches sandbox storage at all
        — refusing after the upload would leave the thing we refused sitting in
        a bucket. See `acceptsNonSyntheticIngest()` in model/domain.ts.

        The document row does not exist yet. An upload that is never completed
        leaves a blob with a lifecycle rule and no row; that blob carries no
        classified value because nothing has extracted it, so it owes no
        SubjectLocation. This is the one case where an unregistered blob is
        correct, and it is correct only because it is unread.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [documentTypeId, filename, contentType, byteLength, synthetic]
              properties:
                documentTypeId:
                  type: string
                  description: |
                    Declared, never inferred from the filename. The type
                    determines the FieldSpecs, and therefore every
                    classification decision downstream.
                filename: { type: string }
                contentType: { type: string }
                byteLength:
                  type: integer
                  description: Checked against the tenant's limit before a URL is minted.
                synthetic:
                  type: boolean
                  description: |
                    Recorded on the row. Carried so "was real data ever in the
                    sandbox?" stays a query rather than an investigation.
                tags:
                  type: object
                  additionalProperties: { type: string }
                  description: |
                    Intake-origin tags. Highest precedence in F11's resolution
                    order, and validated against the tenant's TagPolicy — a key
                    outside the declared vocabulary is refused rather than
                    stored, because free-form tags do not roll up.
      responses:
        '201':
          description: A URL, an expiry, and nothing else the client may vary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadTicket' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Denied' }
        '422':
          description: |
            Refused before any byte moves. `non_synthetic_ingest_refused` is
            the sandbox rule; `document_type_unknown` is a type that does not
            exist in this tenant; `tag_vocabulary_violation` is an undeclared
            tag key.
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }

  /intake/uploads/{uploadId}/complete:
    post:
      tags: [C1 Intake]
      operationId: completeUpload
      x-capability: admit_source
      summary: Turn a stored blob into a SourceDocument. Sanitisation runs after.
      description: |
        Returns 202, not 201. Sanitisation (F12) and extraction (C2) are
        asynchronous, and a synchronous 201 would be a lie about work that has
        not happened — worse, it would tempt a client to treat the document as
        extracted.

        A REJECTION IS NOT AN ERROR RESPONSE HERE. F12 may reject the artefact
        by structure — a macro, an executable, an archive nested past the
        depth limit. That verdict arrives after this call returns, so it
        surfaces as `status: rejected` with a `rejectedFor` code on
        `GET /documents/{documentId}`. Making it a 4xx here would require
        holding the request open across the sanitiser, which is exactly the
        coupling the process boundary exists to prevent.
      parameters:
        - $ref: '#/components/parameters/UploadId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                checksumSha256:
                  type: string
                  description: |
                    Optional. Verified against the stored object when supplied.
                    A mismatch is a truncated upload, which otherwise becomes
                    an extraction failure blamed on the model.
      responses:
        '202':
          description: Accepted. The document exists; nothing has read it yet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentSummary' }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `upload_expired` — the presign lapsed and the blob is gone, or the
            upload was already completed. Both are the same to a client: mint a
            new ticket.
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }

  # ================================================================== C2
  /documents/{documentId}:
    get:
      tags: [C2 Extraction]
      operationId: getDocument
      x-capability: view_document
      x-partner-exposure: 'accepted: a partner under exceptions_operate must read the counterparty paper behind the break it is working, and the mask is the only clamp'
      summary: Extracted values with per-value provenance.
      description: |
        THIS IS WHAT MAKES AN EXPLANATION CHECKABLE. Journey step 04: each
        observed value carries provenance — which document, which page. That
        claim is only true if the client can fetch the document and render the
        bounding box over it, which is what this returns.

        Values arrive redacted where the reader's role requires it. The
        redaction is F4's, applied at the `outbound` ceiling for an export and
        at read time here; `redactedPaths` names what was removed. Silent
        redaction produces a screen that is quietly wrong, and a reviewer
        comparing a redacted value against an unredacted one reaches a
        confident wrong conclusion.

        `pageRenderUrl` is short-lived and is a blob under the tenant prefix
        like everything else — page renders carry the personal data of the
        document they render, which is why `page_render` is its own
        RetentionClass rather than a cache.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The document as extracted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ================================================================== C5
  /runs:
    get:
      tags: [C5 Run Admission]
      operationId: listRuns
      # `admit_source` AND NOT `view_dashboard`, AND THE CHANGE IS §11.9a BEING
      # OBEYED RATHER THAN OVERRIDDEN. `view_dashboard` sits inside
      # PARTNER_CAPABILITY_MASK.exceptions_read; `Run.exceptionsRaised` is
      # METERS.exceptionsRaised and a run list is METERS.reconciliationsRun. So
      # annotating this `view_dashboard` delivers, through the mask, exactly what
      # §11.9a minted `view_metering` to keep out of it: "a partner supporting a
      # customer's queue would read that customer's volume in the clear through
      # the mask". `admit_source` is out of every scope and is G173's own
      # sentence applied — "what the run produces is `tenant_data` and is gated
      # by the capability that reads it".
      # 🛑 `view_exception` SINCE 4 Oct 2026 — G3801, THE OWNER'S RULING ON C3-06,
      # QUOTED AND NEVER PARAPHRASED: *"Open run reads to view_exception: anyone
      # who can see the register can see its runs; admit_source stays the gate
      # for starting runs."* (Starting a run is `admitRun`, gated `trigger_run`;
      # `admit_source` stays on intake.) The comment above is the reasoning the
      # ruling OVERTURNS and is kept as the history it is. ⚠️ ITS COST IS NAMED
      # (G3802): `view_exception` sits in `PARTNER_CAPABILITY_MASK`, so a partner
      # under a live grant whose scope carries it now reads runs too.
      # 🛑 `view_run` SINCE 4 Oct 2026 — G3881, THE OWNER'S RULING ON G3802,
      # QUOTED AND NEVER PARAPHRASED: *"Keep partners out: run reads open to
      # customer roles holding view_exception, but are excluded from the partner
      # capability mask; partners still see exceptions, not run residue."*
      # `view_run` is CARRIED by `view_exception` (`CAPABILITY_CARRIED_BY`), so
      # G3801's reach is unchanged for every customer role; it is in NO partner
      # scope, so the `x-partner-exposure: accepted` that stood here is GONE
      # rather than reworded — there is no exposure left to accept.
      x-capability: view_run
      summary: Runs, most recent first.
      parameters:
        - name: definitionId
          in: query
          schema: { type: string }
        - name: periodId
          in: query
          schema: { type: string }
        # 🛑 THE COPY NO PAIR CAN REACH, AND IT IS EDITED BY HAND. This is a
        # PARAMETER, not a schema under `components.schemas`, and
        # tools/check-wire-mirror.mjs addresses a wire vocabulary BY SCHEMA
        # NAME — so its `run_status` pair has nothing to bind to here and its
        # every run says so about itself. `incomplete` was added to this list on
        # 16 Aug 2026 with `RunStatus` and `Run.properties.status`; a miss would
        # have made a strictly-validating plane REFUSE a client asking for the
        # runs the engine could not complete, which is the population an
        # operator most needs to list. `tests/contracts/run-status-wire.test.mjs`
        # is the only thing that catches a miss — verified by mutation, not by
        # reading: drift this list alone and `npm run check:wire` exits 0.
        - name: status
          in: query
          schema:
            type: array
            items: { type: string, enum: [queued, running, completed, failed, incomplete, refused] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of runs.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Run' }
                  nextCursor: { type: [string, 'null'] }
        '403': { $ref: '#/components/responses/Denied' }

    post:
      tags: [C5 Run Admission]
      operationId: admitRun
      x-capability: trigger_run
      summary: Press Run. Idempotent on (period, definition, slot-fill state).
      description: |
        THE CLIENT DOES NOT SUPPLY AN IDEMPOTENCY KEY, AND THAT IS THE POINT.
        The key is computed by the server from the period, the definition and
        the slot-fill state — the fingerprint of exactly which documents are
        sitting in which slots right now. A client-supplied key would let a
        client mint a duplicate run by varying it, which is the race this rule
        exists to close: an operator presses Run at the same moment a document
        lands and fires the `ingest` trigger, and two runs form over identical
        inputs. Two runs mean two sets of exceptions over the same break, two
        `exceptions_raised` meter events, and a queue that has doubled for no
        reason a user can see.

        THE TRIGGER IS ATTRIBUTION, NEVER IDENTITY. This operation always
        records `{ kind: 'manual', byUserId }` taken from the session. A client
        cannot claim `scheduled` or `ingest` — those are recorded by the
        mechanisms that actually did them. A trigger a caller could assert
        would be a trigger a caller could disown.

        A deduplicated request is a SUCCESS, not a conflict. It returns 200
        with the run that already exists and `outcome: deduplicated`. Returning
        409 would put a normal, expected, correct outcome into every dashboard
        that counts errors, and someone would then "fix" it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [definitionId]
              properties:
                definitionId: { type: string }
                periodId:
                  type: [string, 'null']
                  description: |
                    Null for continuous reconciliation with no period concept.
                    Where a period exists it is part of the idempotency basis,
                    so omitting it on a period-bound definition is refused
                    rather than defaulted — a run silently attributed to the
                    wrong period is a close that does not tie out.
      responses:
        '201':
          description: A new run was admitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunAdmission' }
        '200':
          description: |
            An equivalent run already exists. `outcome` is `deduplicated` and
            `run` is the existing one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunAdmission' }
        '403': { $ref: '#/components/responses/Denied' }
        '409':
          description: |
            `period_closed` — the period was closed and a run against it would
            reopen a signed number behind the controller's back. Reopen the
            period first; that is a deliberate, audited act.
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }
        '422':
          description: |
            `slot_fill_incomplete` — a slot with cardinality `exactly_one` or
            `at_least_one` has nothing in it. Running anyway would raise
            exceptions for absent documents and call them breaks.

            `definition_not_active` — draft or archived.

            `trigger_not_enabled` — `manual` is not in the definition's
            `enabledTriggers`.
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }

  /runs/{runId}:
    get:
      tags: [C5 Run Admission]
      operationId: getRun
      # Same verb as listRuns, for the same reason, at one row — and the same
      # verb as getRunAccount and listRunResidue below it, so the whole
      # `/runs/{runId}` family is gated by one capability rather than by two that
      # disagree about what a run is.
      # 🛑 `view_exception` SINCE 4 Oct 2026 — G3801, THE OWNER'S RULING ON C3-06,
      # QUOTED AND NEVER PARAPHRASED: *"Open run reads to view_exception: anyone
      # who can see the register can see its runs; admit_source stays the gate
      # for starting runs."* (Starting a run is `admitRun`, gated `trigger_run`;
      # `admit_source` stays on intake.) The comment above is the reasoning the
      # ruling OVERTURNS and is kept as the history it is. ⚠️ ITS COST IS NAMED
      # (G3802): `view_exception` sits in `PARTNER_CAPABILITY_MASK`, so a partner
      # under a live grant whose scope carries it now reads runs too.
      # 🛑 `view_run` SINCE 4 Oct 2026 — G3881, THE OWNER'S RULING ON G3802,
      # QUOTED AND NEVER PARAPHRASED: *"Keep partners out: run reads open to
      # customer roles holding view_exception, but are excluded from the partner
      # capability mask; partners still see exceptions, not run residue."*
      # `view_run` is CARRIED by `view_exception` (`CAPABILITY_CARRIED_BY`), so
      # G3801's reach is unchanged for every customer role; it is in NO partner
      # scope, so the `x-partner-exposure: accepted` that stood here is GONE
      # rather than reworded — there is no exposure left to accept.
      x-capability: view_run
      summary: One run, with its inputs pinned.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runs/{runId}/rerun:
    post:
      tags: [C5 Run Admission]
      operationId: rerunRun
      x-capability: trigger_run
      summary: Re-run, carrying why. Exceptions are carried forward, not re-raised.
      description: |
        `rerun` is deliberately absent from `RUN_TRIGGER_KINDS` as a
        configurable option: it is always available to an operator and is not a
        configuration choice.

        The reason is required and closed. `definition_changed`,
        `rule_changed` and `data_corrected` produce different expectations
        about what should differ, and a re-run whose diff nobody can explain is
        a re-run nobody trusts.

        Exceptions that recur set `carriedForwardFrom` to the original. March's
        exception stays March's in April. Without that, resolved-then-recurred
        is indistinguishable from never-resolved, and the billable
        `exceptions_raised` meter inflates on every re-run — which is a
        customer noticing their bill grew because we retried.
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [definition_changed, rule_changed, data_corrected]
      responses:
        '201':
          description: A new run, attributed to the one it re-runs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunAdmission' }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`period_closed`.'
          content:
            application/problem+json:
              schema: { $ref: './errors.yaml#/components/schemas/Problem' }

  # ---- THE ENGINE'S READ SURFACE ------------------------------------------
  #
  # 🛑 BOTH OPERATIONS ARE UNGATED, EXACTLY LIKE EVERY OTHER OPERATION IN THIS
  #    REPOSITORY, AND THAT IS SAID HERE RATHER THAN LEFT TO BE DISCOVERED.
  #    Derive it — and MIND THE ELLIPSES, they are load-bearing and the reason is
  #    two paragraphs down. The command is a `grep -rowE` over `docs/contracts/`
  #    whose alternation is the three capability spellings with each `…` filled
  #    in, piped to `wc -l`:
  #      grep -rowE "view_…|trigger…|export…" docs/contracts/ | wc -l
  #    It returns 0 — at `origin/main` 5bd23bdd and at this revision alike —
  #    across four tiers and every operation in them. The unabbreviated form is
  #    in this slice's PR body, which is not a file this command scans.
  #    ⚠️ AN EARLIER REVISION OF THIS COMMENT SAID THAT COMMAND RETURNED 2, AND
  #    THAT SENTENCE IS CORRECTED HERE RATHER THAN DELETED. It was true of the
  #    revision that wrote it and of nothing since: that draft quoted the pattern
  #    LITERALLY, so the file counted its own prose, twice. The pattern is now
  #    written with an ellipsis wherever it appears inside a comment, so the
  #    self-count no longer occurs and the bare command measures 0. That repair
  #    was itself made twice: the revision that first wrote this correction
  #    spelled the pattern out again on the line above, and
  #    `tests/contracts/engine-read-wire.test.mjs` G1 caught it at `Found 2` —
  #    which is the argument for measuring the claim instead of asserting it in
  #    prose, made by the claim. The finding the draft recorded is real and
  #    survives its own repair — reading the
  #    character stream instead of the structure is the §5.1 shape (a rule keyed
  #    on a convenient landmark instead of the property it protects, an
  #    annotation on an operation) — which is why
  #    `tests/contracts/engine-read-wire.test.mjs` G1 strips whole-line comments
  #    before counting anyway, the way `tests/http/engine-on-served-path.test.ts`
  #    strips them before asserting invariant 3. A control kept only because the
  #    condition that motivated it was repaired is a control that goes back to
  #    sleep the next time somebody quotes a pattern.
  #    Neither operation below declares a
  #    capability annotation because NO operation on ANY tier does. W-11 (#192) — "Reading a run's engine account
  #    has no verb, so every operation this track mints would be gated by a
  #    capability that does not exist" — is OPEN, labelled `blocked` and
  #    `needs-g-decision`. The capability roster is CLOSED at 37 and minting a
  #    thirty-eighth to make this look rigorous would be a gate that exists in
  #    one place and nowhere else, which reads as a system property and is not.
  #    When #192 is ruled, both operations gain their annotation in that commit.
  #
  # 🛑 AND BOTH ARE DATA-PLANE READS. Invariant 3 — "the control plane publishes
  #    downward and never reads tenant data" — makes declaring either of them in
  #    `control-plane.openapi.yaml` a violation rather than a convenience.
  #
  # Invariant 1: neither takes anything tenant-bearing. The run id is in the
  # path and there is no body at all; scope comes from the session and the
  # row-level security policy is what answers.
  #
  # 🛑 DECLARED AND NOT MOUNTED, DELIBERATELY, AND THE REASON IS RECORDED HERE
  #    RATHER THAN LEFT AS AN OMISSION. `server/contract/routes.ts` states the
  #    direction this file may take: "an operation declared with no handler is
  #    simply not registered, and its path 404s. The contract cannot be a subset
  #    of what the server serves; it can only be a superset."
  #
  #    NOTHING PERSISTS A RECONCILIATION RESULT. `ls db/migrations/` is 0001,
  #    0002 and 0003; `run` carries `status` and no findings channel, and
  #    0002_run.sql says so in its own header — "storing columns no wire can
  #    carry would create a second vocabulary with nothing checking it. They
  #    land with the schemas that publish them." The schemas land HERE. The
  #    columns do not, because choosing between a typed column set and a `jsonb`
  #    operand column is a ruling W-3 (#193) reserves to the owner: a `jsonb`
  #    column inherits invariant 4's G106 problem, since a key with no
  #    `FieldSpec` is UNREADABLE.
  #
  #    So a handler mounted today would answer 404 for every run id that will
  #    ever be passed to it — a route that asserts nothing, and one a later
  #    reader would take for a real implementation and "fix" by inventing data.
  #    An unmounted declared operation 404s from the ROUTER, with "The OpenAPI
  #    documents are the router. A path they do not declare is not a route.",
  #    which leaves the gap legible. `tests/http/run-completeness-served.test.ts`
  #    asserts that this is the state, so it cannot change silently in either
  #    direction. The handler lands with the migration, in that commit.
  #
  # ══════════════════════════════════════════════════════════════════════════
  # 🛑 19 Sep 2026 — TWO OF THE SENTENCES ABOVE ARE NOW FALSE AND THE LAST ONE
  #    WAS OVERRULED. THEY ARE CORRECTED HERE RATHER THAN DELETED, because the
  #    first is the sentence a reader would have quoted onward.
  #
  #    · "NOTHING PERSISTS A RECONCILIATION RESULT" — **false.** G284 ruled W-3
  #      (#193) on 19 Sep 2026: a result is stored in TYPED COLUMNS, one per
  #      declared findings channel, never in a `jsonb` operand column. The
  #      columns are `db/migrations/0007_run_engine_account.sql`, thirteen
  #      tables, and the writer and reader are
  #      `server/data-plane/run-account-store.ts`.
  #    · "`ls db/migrations/` is 0001, 0002 and 0003" — **false, and it was
  #      already false before 0007.** Derive it, never read it:
