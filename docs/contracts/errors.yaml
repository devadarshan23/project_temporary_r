openapi: 3.1.0

info:
  title: ReconcileAI — Shared Error Vocabulary
  version: 0.1.0-draft
  description: |
    ONE vocabulary, referenced by all FIVE tiers. Not foundation's, not
    capability's, not session's — the system's.

    This file exists because it had to. The three tier specs were written
    concurrently on 5 Aug and the capability spec copied the enum at 27 members
    while the control-plane spec was extending it to 40. Within an afternoon
    there were two ErrorCode definitions that disagreed by 13 members, in a
    document set whose stated premise is a single vocabulary. A copied enum
    diverges; a referenced one cannot.

    THE ENUM BELOW NOW HOLDS 89 MEMBERS. ⚠️ IT SAID 88 UNTIL 22 Sep 2026, 87
    UNTIL 19 Sep 2026 AND 71 UNTIL THE SESSION TIER LANDED; the 27-and-40
    figures above are the origin story, not the count. The sixteen that took
    it to 87 are the arms of DOMAIN_ROUTING_REFUSALS,
    SIGN_IN_ATTEMPT_REFUSALS and SESSION_BOUND_REFUSAL_REASONS, mirrored by
    exact name and by nothing else. Derive it, never read it:
    `grep -c '^        - ' docs/contracts/errors.yaml`.

    ⚠️ AND THE "89" ABOVE WAS ALREADY ONE BEHIND WHEN G3441 ARRIVED — the
    command returned 90 — and it is left standing as the history it is rather
    than swept to another number. THE MEMBER G3441 ADDS IS
    `resolution_not_configured` (3 Oct 2026, DERIVED, not the owner's): the
    tenant has no `tenant.approval_config` row, or the exception's definition
    has no `tenant.definition_archetype` row, so no approval gate or offered
    set can be evaluated. It replaces a 500 `upstream_unavailable` that every
    client rendered as "try again" — a refusal that is DETERMINISTIC, which a
    retry can never help. 🛑 IT IS STILL FAIL-CLOSED: the chain does not default
    to the weakest gate; it says plainly that resolutions are not set up.

    THE EIGHTY-NINTH IS `reversal_window_expired`, minted 22 Sep 2026 under
    THE OWNER'S ruling that a resolution is reversible for 24 hours from the
    post — `model/domain.ts`'s `REVERSAL_WINDOW_HOURS`. It closes a finding
    (`docs/build/pack-tree-join.md`, G1733) that `reverseResolution` was
    served and mounted with the window enforced NOWHERE — no constant, no
    column, no check, no contract field — so a reversal was unbounded in
    time on a live operation.

    THE EIGHTY-EIGHTH IS `capability_not_held`, minted 19 Sep 2026 with G200's
    request-time gate (server/http/app.ts, decision 4 of its header). 🛑 IT IS
    NOT `policy_denied`, AND REUSING THAT ONE WAS THE OBVIOUS SHORTCUT AND IS
    REFUSED. The two sit three lines apart in this enum and mean opposite things
    about what the caller should do next: `policy_denied` is F3 evaluating a
    policy and refusing THIS ACT — the caller holds the verb and the act was
    still refused — while `capability_not_held` is the caller never having been
    granted the verb at all. Collapsing them destroys exactly the diagnostic
    distinction this file's own argument for a closed enum exists to protect:
    "under a restrictive SpanAttributePolicy the error class is the only
    diagnostic channel that survives redaction", so a support engineer reading a
    redacted span would be unable to tell "widen this grant" from "this policy
    fired", which are answered by different people. Adding a member is what this
    file says to do — the enum "must be exhaustive BEFORE launch" — and the
    paragraph below already budgets roughly 23 further members for the same
    reason.

    STILL TO ADD. The decisions of 5 Aug (docs/access-and-agency.md 8-10) require
    roughly 23 further members — org resolution, notification, support
    authorisation, the inverted egress polarity, the two new resource classes and
    the commercial floors — plus one rename, `export_class_excluded` ->
    `export_class_not_permitted`, whose current name encodes the polarity that
    decision 8.6 inverts.

    WHY IT IS CLOSED. Under a restrictive SpanAttributePolicy the error class is
    the only diagnostic channel that survives redaction — a free-text message is
    stripped and undiagnosable. It follows that this enum must be exhaustive
    BEFORE launch: adding a code later means shipping an engine release into a
    customer account before the thing you just learned about can be diagnosed.

    `Problem.detail` is for humans reading a screen. It is never the diagnostic
    channel, and it MUST NOT carry field values, record contents, or
    customer-authored strings.

paths: {}

components:
  schemas:

    Problem:
      type: object
      description: RFC 9457.
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { $ref: '#/components/schemas/ErrorCode' }
        detail:
          type: string
          description: |
            Human-facing only. MUST NOT contain field values, record contents or
            customer-authored strings — it is stripped from telemetry, so
            anything load-bearing put here is invisible exactly when it matters.

    ErrorCode:
      type: string
      description: |
        Closed and shared. Listed alphabetically; any tier may return any code.

        (This read "grouped by origin in the source order below". The members
        are strictly alphabetical and there are no groups.)
